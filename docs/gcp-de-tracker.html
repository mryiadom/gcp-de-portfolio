,"Dockerfile - Building our own Docker Image"]],"Wed":[[4208,"Developing with Containers"],[8846,"Docker Volumes - Persist data in Docker"]],"Thu":[[7476,"Pushing our built Image into a private Registry on Google Cloud"]],"Fri":[[5389,"Docker Compose - Running multiple services"]]},"dod":"Dockerfile written; image builds and runs locally; pushed to Artifact Registry; build/run steps documented.","exercises":{"Tue":["Explain image versus container versus registry in one line each.","Look at any Dockerfile and predict which layers rebuild when only source code changes.","Write a Dockerfile for your ingestion script.","Order the layers so a code change does **not** reinstall dependencies. Prove it by timing two builds.","Choose `CMD` or `ENTRYPOINT` deliberately and write one line on why."],"Wed":["Build and run it locally, passing the API key as an environment variable — never baked into the image.","Mount a local folder as a volume and confirm output lands outside the container.","Run `docker history` and confirm no secret appears in any layer."],"Thu":["Convert to a multi-stage build and record the image size before and after.","Push to Artifact Registry and pull it back down to prove the push worked."],"Fri":["Write a `docker-compose.yml` running your container against a local Postgres.","Confirm `docker compose up` works from a clean clone — you will rely on this for Airflow and Kafka."]},"dayfiles":{"Tue":{"act":"new","path":"Dockerfile","note":"Repo root, no extension."},"Wed":{"act":"new","path":".dockerignore","note":"Same idea as `.gitignore` — keep `.venv/` and `.git/` out of the build context."},"Thu":{"act":"continue","path":"Dockerfile","note":"Convert to multi-stage today, then push to Artifact Registry."},"Fri":{"act":"new","path":"docker-compose.yml","note":"You will extend this pattern for Airflow (Week 27) and Kafka (Week 31)."}}},{"n":25,"phase":3,"title":"Production Python for Data Engineering","goal":"A reusable, tested, packaged extraction module hitting a live markets API and writing to Cloud Storage — the difference between a script and software.","days":[["Mon","Package structure: modules, `__init__.py`, `pyproject.toml`, type hints throughout, `requirements.txt` frozen from an isolated venv."],["Tue","Build the API client class extending the Week-11 pattern: session reuse, pagination, rate-limit awareness (respect the free-tier limits documented in Week 16)."],["Wed","Resilience: retries with exponential backoff, timeouts, structured logging (not `print`), custom exception types."],["Thu","`google-cloud-storage` to write to Cloud Storage; make the load **idempotent** — re-running must not duplicate data. Deterministic key naming is how you get this."],["Fri","`pytest`: unit tests, fixtures, mocking the API so tests don't hit the network. Critical paths, not 100% coverage."]],"files":["src/ingestion/__init__.py","src/ingestion/client.py","src/ingestion/writer.py","tests/test_client.py","tests/test_writer.py","pyproject.toml"],"mini":{"n":16,"name":"`src/ingestion/` package","desc":"Class-based extractor with retries, logging, idempotent Cloud Storage writes and passing pytest tests.","feeds":"Major Projects 2 and 3 both ingest through this.","mp":[2,3]},"resources":[{"day":null,"md":"Course: [Pytest Tutorial — How to Test Python Code (freeCodeCamp)](https://www.youtube.com/watch?v=cHYq1MRoyI0)"},{"day":null,"md":"Reference: [Python client for Cloud Storage — reference](https://docs.cloud.google.com/python/docs/reference/storage/latest)"},{"day":null,"md":"Video: [How to Use Python with Google Cloud Cloud Storage — Boto3 Tutorial](https://www.youtube.com/watch?v=O3LCsq1g0GU)"},{"day":"Fri","md":"[pytest: Effective Python Testing (Real Python)](https://realpython.com/pytest-python-testing/) and [pytest — official docs](https://docs.pytest.org/)"},{"day":"Mon","md":"[Python Packaging User Guide — packaging projects](https://packaging.python.org/en/latest/tutorials/packaging-projects/)"}],"vidbase":"https://www.youtube.com/watch?v=cHYq1MRoyI0","vidlabel":"freeCodeCamp pytest","chapters":{"Fri":[[366,"Our First Tests"],[1789,"Fixtures"],[3324,"Mocking"]]},"dod":"A reusable class-based extraction module; retries and structured logging in place; idempotent Cloud Storage write proven by running it twice; at least two meaningful pytest tests passing.","data":[{"title":"The fixture your tests mock","lang":"python","note":"Friday's tests must not hit the network. This is the canned response to mock — same shape as the real one from Week 16, including the `no_data` failure case, because the error path is the one worth testing.","code":"# tests/conftest.py\nimport pytest\n\n@pytest.fixture\ndef candle_ok():\n    return {\n        \"c\": [225.31, 227.02, 224.88],\n        \"h\": [226.90, 228.44, 226.10],\n        \"l\": [223.05, 224.71, 223.02],\n        \"o\": [224.10, 225.66, 225.90],\n        \"s\": \"ok\",\n        \"t\": [1767225600, 1767312000, 1767398400],\n        \"v\": [42817300, 38290100, 51004200],\n    }\n\n@pytest.fixture\ndef candle_empty():\n    \"\"\"What a delisted or misspelled ticker returns - HTTP 200, no data.\"\"\"\n    return {\"s\": \"no_data\"}","check":"Two tests worth having: parsing `candle_ok` yields **3 rows** with a timezone-aware UTC date, and parsing `candle_empty` raises your own exception rather than a `KeyError`. For the idempotency proof, run your writer twice against `candle_ok` and assert Cloud Storage holds **one** object, not two — deterministic key naming is what makes that true."}],"exercises":{"Mon":["Create the package layout with `pyproject.toml` and confirm `pip install -e .` works.","Freeze `requirements.txt` from a **clean** venv, not your system Python.","Add type hints to every public function."],"Tue":["Build the API client class with session reuse and pagination.","Add rate-limit awareness that respects the free-tier limit you documented in Week 16.","Prove the session is reused — log the connection count across 10 calls."],"Wed":["Add retries with exponential backoff. Only retry what is worth retrying: 429 and 5xx, never 401.","Replace every `print` with structured logging carrying ticker and attempt number.","Define two custom exceptions and state when each is raised."],"Thu":["Write the Cloud Storage writer with deterministic key naming.","Run the full ingestion **twice** and confirm Cloud Storage holds one object per ticker, not two. This is the week's real deliverable.","Write one line explaining why deterministic keys give you idempotency for free."],"Fri":["Write a test that parses the good fixture into 3 rows with a timezone-aware UTC date.","Write a test that the empty fixture raises **your** exception, not a `KeyError`.","Mock the API so the suite runs offline, then confirm by disabling wi-fi and re-running."]},"dayfiles":{"Mon":{"act":"new","path":"pyproject.toml · src/ingestion/__init__.py","note":"Create the `src/ingestion/` package folder."},"Tue":{"act":"new","path":"src/ingestion/client.py","note":"Extends the Week-11 `MarketDataClient` pattern — same shape, real API behind it."},"Wed":{"act":"continue","path":"src/ingestion/client.py","note":"Retries, backoff, logging and custom exceptions go in here."},"Thu":{"act":"new","path":"src/ingestion/writer.py","note":"Deterministic Cloud Storage object naming is what makes this idempotent."},"Fri":{"act":"new","path":"tests/test_client.py · tests/test_writer.py","note":"Create the `tests/` folder at the repo root, not inside `src/`."}}},{"n":26,"phase":3,"title":"MAJOR PROJECT 2: Market Data ELT Pipeline","major":2,"goal":"Markets API → Cloud Storage → BigQuery → dbt → Looker Studio, provisioned with Terraform. **This is the junior/mid DE job**, near-verbatim from UK adverts.","research_intro":"**Research first:**","research":["Does your Week-16 source decision still hold for ~15 tickers daily?","Free-tier headroom?","What does one response look like — fields and grain?","How do you land it raw and why does an immutable raw layer matter?","Failure cases: empty ticker, rate-limit hit, source down.","What is the simplest defensible VaR you can compute from daily returns, and what does it assume that markets violate?","Which of your marts would a risk team actually query, and at what grain?"],"days":[["Mon","New repo `market-data-elt`; architecture from the Week-20 doc; scaffold Terraform."],["Tue","Extraction via the Week-25 package landing raw responses in Cloud Storage (`raw.prices_raw`, untouched)."],["Wed","Catalogue with Knowledge Catalog; dbt staging → marts with tests (Week 21), on the star schema (Week 19)."],["Thu","Partitioned Parquet in the curated layer (Week 22); Looker Studio dashboard over the marts."],["Fri","README with architecture diagram; verify a full re-run produces no duplicates; commit and pin."]],"tree_title":"Target repo tree — `market-data-elt`","tree":"market-data-elt/\n├── README.md\n├── pyproject.toml\n├── requirements.txt\n├── .gitignore\n├── src/\n│   └── ingestion/\n│       ├── __init__.py\n│       ├── client.py\n│       └── writer.py\n├── dbt/\n│   ├── dbt_project.yml\n│   ├── profiles.yml.example\n│   └── models/\n│       ├── staging/stg_prices.sql\n│       ├── marts/fct_daily_prices.sql\n│       ├── marts/dim_instrument.sql\n│       └── schema.yml\n├── infra/\n│   ├── main.tf\n│   ├── variables.tf\n│   └── outputs.tf\n├── tests/\n│   ├── test_client.py\n│   └── test_writer.py\n└── docs/\n    ├── architecture.md\n    ├── architecture.png\n    └── cost_analysis.md","spec":"`raw.prices_raw` (API response, untouched) · `staging.stg_prices` (typed, cleaned, deduplicated, one row per instrument per day) · `marts.fct_daily_prices` (close, daily return, 7-day moving average) · `marts.dim_instrument` (ticker, name, sector) · all infrastructure via Terraform, not console clicks · a **risk mart** on top of the price marts: rolling annualised volatility, maximum drawdown, and a 95% historical VaR per instrument · every mart built from the adjusted series, never from raw.","resources":[{"day":null,"md":"[Knowledge Catalog (formerly Dataplex) — overview](https://docs.cloud.google.com/dataplex/docs/introduction)"},{"day":null,"md":"[dbt — best practice project structure](https://docs.getdbt.com/best-practices/how-we-structure/1-guide-overview)"},{"day":null,"md":"[diagrams.net — free architecture diagramming](https://app.diagrams.net/)"},{"day":null,"md":"Walkthrough: [Setup dbt with BigQuery, end to end (CK Data Tech, 1h)](https://www.youtube.com/watch?v=Zl6OVJdqAc8)"},{"day":null,"md":"Reference: [dbt — how we structure our projects](https://docs.getdbt.com/best-practices/how-we-structure/1-guide-overview)"},{"day":"Thu","md":"[Estimate and control costs — BigQuery](https://docs.cloud.google.com/bigquery/docs/best-practices-costs)"}],"dod":"Runs end-to-end with one command; idempotent — no duplicate rows on re-run; dbt tests pass (unique instrument+date, not_null close); dashboard picks any ticker; README has an architecture diagram.","exercises":{"Mon":["Answer the five research questions in the README before coding.","Create the repo and copy in the Week-20 architecture doc.","Scaffold Terraform for Cloud Storage, Knowledge Catalog and IAM, and `apply` it."],"Tue":["Wire in the Week-25 package to land 15 tickers into `raw.prices_raw`, untouched.","Confirm the raw layer is byte-identical to what the API returned.","Handle the empty-ticker case without failing the whole run."],"Wed":["Catalogue the raw layer with Knowledge Catalog.","Build staging and marts with dbt on the Week-19 star schema.","All tests must pass, including unique on ticker + date."],"Thu":["Write the curated layer as partitioned Parquet.","Build the Looker Studio dashboard over the marts, not over raw.","Record bytes scanned for the dashboard's heaviest query."],"Fri":["Write the README with the architecture diagram embedded.","**Run the whole pipeline twice and prove zero duplicate rows.** If duplicates appear, Week 25 Thursday is not finished.","Time a cold run start to finish and put the number in the README. Commit and pin."]},"dayfiles":{"Mon":{"act":"new","path":"market-data-elt/","note":"New repo. Copy `docs/architecture.md` over from Week 20 and scaffold `infra/` from Week 23."},"Tue":{"act":"reuse","path":"src/ingestion/","note":"Carried over from Week 25 unchanged. If you find yourself editing it, the Week-25 version was not finished."},"Wed":{"act":"reuse","path":"dbt/","note":"Carried over from Week 21, pointed at the new raw layer."},"Thu":{"act":"reuse","path":"sql/ddl/create_partitioned_prices.sql","note":"The Week-22 partitioning work, applied to the curated layer."},"Fri":{"act":"new","path":"README.md · docs/architecture.png","note":"The README is the deliverable here, not an afterthought."}},"build":["**Terraform first, and apply it.** Buckets, datasets, service account. If the infrastructure is not code before the pipeline exists, it never will be.","**Ingestion via the Week 24 package.** Import it; do not rewrite it. If you find yourself editing it, note what was missing — that is a finding about Week 24.","**Raw → staging in dbt.** `stg_prices`: typed, renamed to your conventions, deduplicated, one row per ticker per day. Add the `unique` test on the **combination** now, not later.","**Adjust, then model.** Corporate actions applied in a dedicated model, then the star schema on top. `fct_daily_prices`, `dim_instrument`, `dim_date`.","**Risk marts.** Rolling volatility, maximum drawdown, 95% historical VaR — each as its own model with its own test.","**Partition and cluster**, then measure. Record bytes billed before and after with a dry run.","**Serve and document.** Looker Studio over the marts. Architecture diagram in the README."],"accept":["`terraform destroy` then `terraform apply` rebuilds the whole stack, and the pipeline still runs.","**One command runs the pipeline end to end.** If it takes three commands in the right order, write the wrapper.","Running it twice produces **zero** duplicate rows. Prove it with a count before and after, in the README.","Every dbt test passes, including uniqueness on ticker+date and `not_null` on close.","Every mart reads from the adjusted series. Grep for the raw table name in `models/marts/` — it should not appear.","The cost note shows a real before/after in bytes billed, converted to pounds at the current published rate.","The risk marts return sane numbers: annualised volatility in the tens of percent, drawdown negative, VaR negative."],"failure":["**Source down or rate-limited.** The run should fail loudly and leave the warehouse in its previous state, not half-loaded.","**Late-arriving data.** Yesterday's bar is corrected today. Does your load overwrite, append, or duplicate?","**Schema drift.** The API adds a field. Does staging break, silently ignore it, or quarantine the row?","**A duplicate in the raw layer.** Your dedup logic runs *before* the unique test — confirm which one actually catches it.","**Partition filter missing.** A query without a date filter should be rejected, not silently expensive."],"rubric":["Is `profiles.yml` in the repo? *It must not be.* Is `profiles.yml.example` in the repo? *It must be.*","Does every dbt model have a description, or are the docs empty boxes?","Can you explain, without looking, why each mart is a table rather than a view — or the reverse?","Is the architecture diagram a real diagram, or a list of service names in a box?","Does the README say what this would cost to run daily for a year?"],"data":[{"title":"Reconciliation query — run this before you call it done","lang":"BigQuery SQL","note":"The four checks that catch the errors dbt tests miss. Run after every full pipeline run. If any row returns, you are not finished.","code":"-- 1. duplicates that survived staging\nSELECT ticker, price_date, COUNT(*) AS n\nFROM market_elt.stg_prices\nGROUP BY ticker, price_date HAVING COUNT(*) > 1;\n\n-- 2. rows lost between raw and staging\nSELECT\n  (SELECT COUNT(*) FROM market_elt.raw_prices) AS raw_rows,\n  (SELECT COUNT(*) FROM market_elt.stg_prices) AS stg_rows;\n\n-- 3. impossible bars\nSELECT * FROM market_elt.stg_prices\nWHERE high < low OR close <= 0 OR volume < 0;\n\n-- 4. gaps in the trading calendar per ticker\nSELECT ticker, price_date,\n       DATE_DIFF(price_date,\n         LAG(price_date) OVER (PARTITION BY ticker ORDER BY price_date),\n         DAY) AS gap_days\nFROM market_elt.stg_prices\nQUALIFY gap_days > 4;","check":"Query 1 must return **nothing**. Query 2's two numbers should differ only by rows you deliberately dropped — if staging has *more* rows than raw, you have a join fanning out. Query 3 must return nothing. Query 4 will return legitimate rows around bank holidays: **your job is to be able to explain every single one**, which is why the trading calendar from Week 15 matters."}]},{"n":27,"phase":4,"title":"Orchestration I: Airflow Foundations","goal":"A scheduled DAG running your ingest → transform flow with real retry logic, written against Airflow 3.","callout":{"title":"Build on Airflow 3, not Airflow 2","body":"Airflow 3 is the current stable line (3.2.x as of July 2026) and it moved things most tutorials still get wrong. Pin it explicitly — `pip install \"apache-airflow==3.*\" apache-airflow-providers-standard` — and treat any blog post that imports `PythonOperator` from `airflow.operators` as out of date. The three that will actually break your code: the common operators moved to the **standard provider**, `BaseOperator` moved to **`airflow.sdk`**, and **SLAs were removed** (Week 28). Every docs link in these two weeks points at `/stable/`, so they show Airflow 3."},"days":[["Tue","DAGs, tasks, operators, sensors, hooks; scheduler vs executor, plus the **API server** — Airflow 3 split the old webserver into an API server, and workers now talk to it instead of hitting the metadata database directly. Schedule intervals, and what `catchup` does if you're not paying attention: it now defaults to `False`, so the classic Airflow 2 trap of a hundred backfill runs firing the moment you unpause a DAG is off by default. **Then:** Run Airflow locally via Docker using **Apache's own `docker-compose.yaml` quickstart** rather than assembling one — it wires the scheduler, API server, dag processor and metadata DB for you. UI at `localhost:8080`, default login `airflow`/`airflow`. Note that in Airflow 3 the **dag processor is its own component** (`airflow dag-processor`) and must run even locally, and the webserver command is now `airflow api-server`. Managed Service for Apache Airflow has no free tier, so stay local and keep the bill at zero."],["Wed","Build the DAG: extract → load to Cloud Storage → `dbt run`. `PythonOperator` and `BashOperator` — both now live in **`apache-airflow-providers-standard`**, not in core, so install that provider and import from `airflow.providers.standard.operators.python` / `.bash`. Dependencies with `>>`."],["Thu","Retries, `retry_delay`, exponential backoff, task timeouts, and idempotent task design so a retry is safe. XComs for passing small values, and why passing large data through XCom is an antipattern."],["Fri","A custom operator subclassing `BaseOperator` — imported from **`airflow.sdk`** in Airflow 3, not `airflow.models.baseoperator`. Where inheritance genuinely belongs (Week 11 pays off). Document; commit."]],"files":["dags/market_elt_daily_dag.py","plugins/operators/athena_query_operator.py","docker-compose.airflow.yml","requirements-airflow.txt  (pins apache-airflow==3.*, apache-airflow-providers-standard)"],"mini":{"n":17,"name":"`market_elt_daily_dag.py` + a custom operator","desc":"","feeds":"Major Project 3's orchestration layer, first half.","mp":[3]},"resources":[{"day":null,"md":"Course: [Airflow Tutorial for Beginners 2026 — Full Course (covers Airflow 3 DAG versioning and assets)](https://www.youtube.com/watch?v=IiczxlbQb8s)"},{"day":"Tue","md":"[Airflow 3 architecture and breaking changes — official upgrade guide](https://airflow.apache.org/docs/apache-airflow/stable/installation/upgrading_to_airflow3.html)"},{"day":"Tue","md":"[Running Airflow in Docker — official docker-compose quickstart](https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html)"},{"day":"Wed","md":"[apache-airflow-providers-standard — where PythonOperator and BashOperator now live](https://airflow.apache.org/docs/apache-airflow-providers-standard/stable/operators/index.html)"},{"day":null,"md":"Course: [Astronomer — get started with Airflow](https://www.astronomer.io/docs/learn/get-started-with-airflow)"},{"day":null,"md":"Reference: [Airflow — core concepts](https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/index.html)"},{"day":"Fri","md":"[Creating a custom operator — official docs (uses `airflow.sdk.BaseOperator`)](https://airflow.apache.org/docs/apache-airflow/stable/howto/custom-operator.html)"}],"vidbase":"https://www.youtube.com/watch?v=IiczxlbQb8s","vidlabel":"Airflow 3 Full Course","chapters":{"Tue":[[2415,"Airflow Core Components"],[4798,"Airflow Architecture"],[5842,"What is DAG, Task, Operator?"],[6674,"Airflow Installation and Setup"],[8372,"Airflow UI"]],"Wed":[[8714,"Linear DAG and Parsing"],[10999,"Operators and DAGs Syncing"]],"Thu":[[11563,"XCOMs in Airflow"],[12434,"Manual XCOMs with Kwargs"]]},"dod":"A DAG runs locally on Airflow 3; extract → load → `dbt run` chained; retries and a daily schedule set; a custom operator working, subclassed from `airflow.sdk.BaseOperator`; your requirements file pins the Airflow major version and the standard provider.","exercises":{"Tue":["Define DAG, task, operator, sensor and hook in one line each.","Explain what the scheduler does versus the executor versus the API server.","Write down what `catchup=True` would do to a DAG with a `start_date` six months ago — and confirm the Airflow 3 default is `False`.","Get Airflow 3 running from Apache's compose file and reach the UI.","Confirm the dag processor is running as its own container.","Add a one-task hello-world DAG and watch it appear. If it does not, that is your dags volume mount."],"Wed":["Build the three-task DAG: extract → load to Cloud Storage → `dbt run`.","Import both operators from `apache-airflow-providers-standard` and confirm it runs.","Set the dependencies with `>>` and check the graph view matches your intent."],"Thu":["Set retries to 3 with exponential backoff and a task-level timeout.","Force a failure mid-DAG, let it retry, and confirm the retry does not duplicate data.","Pass a small value between tasks with XCom, then write one line on why you would not pass a DataFrame this way."],"Fri":["Write a custom operator subclassing `airflow.sdk.BaseOperator` that runs an BigQuery query and returns the result location.","Use it in the DAG in place of one existing task.","Write down why this is a legitimate use of inheritance when composition is usually better."]},"dayfiles":{"Tue":{"act":"new","path":"docker-compose.airflow.yml · requirements-airflow.txt","note":"Download Apache's compose file rather than writing one. Pin `apache-airflow==3.*` and `apache-airflow-providers-standard` in the requirements file."},"Wed":{"act":"new","path":"dags/market_elt_daily_dag.py","note":"Create the `dags/` folder — the compose file mounts it."},"Thu":{"act":"continue","path":"dags/market_elt_daily_dag.py","note":"Retries and timeouts go on the tasks you wrote yesterday."},"Fri":{"act":"new","path":"plugins/operators/athena_query_operator.py","note":"Create `plugins/operators/`. Subclass `airflow.sdk.BaseOperator`."}}},{"n":28,"phase":4,"title":"Orchestration II: Airflow in Production","goal":"The difference between a DAG that runs and a DAG that survives. This is the week most self-taught candidates skip, and the one that separates you in interview.","callout":{"title":"Be bilingual — you build on 3, you'll interview about 2","body":"Airflow 3 is what you should build on, but a large share of UK teams are still running 2.x, so an interviewer may well describe an Airflow 2 codebase. Know both sides of each change below and you sound like someone who has actually migrated a platform rather than followed a tutorial. Practical tip worth stating out loud in interview: `ruff check dags/ --select AIR301` flags Airflow 2 patterns that break on 3, and `--fix` repairs most of them."},"days":[["Mon","**Backfills and reprocessing.** `catchup` (now `False` by default in Airflow 3), `start_date` semantics, running a backfill over a date range, and why a task must be idempotent for backfill to be safe at all. Data intervals and logical dates — the concept that confuses everyone, and the one Airflow 3 quietly changed: a bare cron string in `schedule=` now gets a `CronTriggerTimetable` rather than the old `CronDataIntervalTimetable`, so `data_interval_start`/`data_interval_end` and the `ds`/`ts` values derived from them behave differently. Set `create_cron_data_intervals=True` if you genuinely depend on the old windows. Also note `execution_date` is gone from the task context — it's `logical_date` now, along with `prev_ds`, `next_ds`, `yesterday_ds` and friends."],["Tue","**Sensors and external dependencies.** Waiting on an Cloud Storage object, waiting on another DAG, poke vs reschedule mode and why poke mode eats a worker slot. Timeouts so a stuck sensor doesn't block forever. Note that `ExternalTaskSensor` and `FileSensor` moved to the standard provider alongside the operators, and `BaseSensorOperator` now comes from `airflow.sdk`."],["Wed","**Dynamic task mapping.** Generate one task per ticker at runtime instead of hard-coding fifteen. Task groups for readability — and they carry more weight now, because **SubDAGs were removed in Airflow 3**; TaskGroups plus **Assets** (the renamed Datasets, `airflow.sdk.Asset`) and data-aware scheduling are the supported way to compose work. Branching with conditional logic when a source is unavailable."],["Thu","**Monitoring and alerting.** **SLAs were removed in Airflow 3** — **Deadline Alerts** replace them, so learn the new API and keep \"we used to express this as an SLA\" as the interview answer rather than the implementation. `on_failure_callback`, email/Slack notification, Airflow logs and where they actually live, and what a useful failure alert contains — which task, which run, which data interval, what to do next."],["Fri","**Production shape.** How Managed Service for Apache Airflow runs this on Google Cloud and what it costs — Managed Service for Apache Airflow has supported Airflow 3.2 since April 2026, so a portfolio built on 3 maps straight onto it. Executors compared: Local vs Celery vs Kubernetes, noting the Sequential executor was removed and LocalExecutor-on-SQLite is now the local-dev answer. Secrets via an Airflow connection rather than hard-coded. **Task isolation** — in Airflow 3 task code can no longer reach the metadata database directly, everything goes through the Task Execution API; be able to explain why that is a security improvement. DAG-level testing. Write a short operational runbook: what to do when the DAG fails at 3am."]],"files":["dags/market_elt_backfill_dag.py","docs/runbook.md","updated dags/market_elt_daily_dag.py  (sensors, dynamic mapping, alerting)"],"mini":{"n":18,"name":"A production-shaped DAG + `runbook.md`","desc":"Dynamic task mapping across tickers, an Cloud Storage sensor, failure alerting via Deadline Alerts and `on_failure_callback`, and a documented backfill procedure.","feeds":"Major Project 3's orchestration layer, completed.","mp":[3]},"resources":[{"day":null,"md":"Course: [Airflow Full Course — second half: scheduling, incremental loads, assets](https://www.youtube.com/watch?v=IiczxlbQb8s)"},{"day":"Mon","md":"[Airflow — DAG runs, data intervals and catchup](https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/dag-run.html)"},{"day":"Tue","md":"[Airflow sensors — official docs](https://airflow.apache.org/docs/apache-airflow/stable/core-concepts/sensors.html)"},{"day":"Wed","md":"[Dynamic task mapping — official docs](https://airflow.apache.org/docs/apache-airflow/stable/authoring-and-scheduling/dynamic-task-mapping.html)"},{"day":"Thu","md":"[Airflow callbacks and notifications](https://airflow.apache.org/docs/apache-airflow/stable/administration-and-deployment/logging-monitoring/callbacks.html)"},{"day":"Thu","md":"[Deadline Alerts — the Airflow 3 replacement for SLAs](https://airflow.apache.org/docs/apache-airflow/stable/howto/deadline-alerts.html) and [Migrating from SLA to Deadline Alerts](https://airflow.apache.org/docs/apache-airflow/stable/howto/sla-to-deadlines.html)"},{"day":"Fri","md":"[Managed Service for Apache Airflow — overview](https://docs.cloud.google.com/composer/docs/composer-3/composer-overview) and [Airflow versions available on Google Cloud](https://docs.cloud.google.com/composer/docs/composer-versions)"},{"day":null,"md":"Best practice: [Airflow — best practices guide](https://airflow.apache.org/docs/apache-airflow/stable/best-practices.html)"},{"day":null,"md":"Bilingual reference: [Airflow 3 breaking changes and the `airflow.sdk` import map](https://airflow.apache.org/docs/apache-airflow/stable/installation/upgrading_to_airflow3.html#breaking-changes)"}],"vidbase":"https://www.youtube.com/watch?v=IiczxlbQb8s","vidlabel":"Airflow 3 Full Course","chapters":{"Mon":[[14459,"Scheduling Presets in Airflow"],[15601,"Cron Syntax in Airflow"],[16858,"Incremental Load and Jinja Template"]],"Tue":[[18506,"Special Schedules with Events"],[18865,"Assets in Airflow"]]},"dod":"A backfill run successfully over a past date range with no duplicate data; a sensor waiting on an Cloud Storage object with a timeout; dynamic task mapping generating one task per ticker; a failure alert firing with useful content; a written runbook committed; and you can name three things that changed between Airflow 2 and 3 and say why each was changed.","exercises":{"Mon":["Run a backfill over a past 30-day range.","**Confirm zero duplicate rows afterwards.** If there are duplicates, the task is not idempotent and backfill was never safe.","Write out the difference between logical date and wall-clock run time, then check whether a bare cron string gives you `CronTriggerTimetable` or data intervals."],"Tue":["Add an Cloud Storage object sensor upstream of extraction, with a timeout.","Run it in both poke and reschedule mode and observe the worker slot difference.","Let a sensor time out deliberately and confirm the DAG fails rather than hanging."],"Wed":["Replace hard-coded per-ticker tasks with dynamic task mapping. **15 mapped instances from one definition.**","Wrap related tasks in a task group and confirm the graph view collapses.","Add branching so an unavailable source skips downstream rather than failing the run."],"Thu":["Add `on_failure_callback` posting a message containing task id, run id, data interval and the runbook link.","Configure a Deadline Alert — **not** an SLA, which was removed in Airflow 3.","Trigger a real failure and confirm the alert arrives with enough detail to act on at 3am."],"Fri":["Compare Local, Celery and Kubernetes executors in a three-row table with when to use each.","Move every credential into an Airflow connection and confirm nothing sensitive remains in the DAG file.","Write `docs/runbook.md`: the DAG failed at 3am — first five things to check, in order.","PDP: Break the DAG on purpose, let it fail, then write an **incident log**: how you detected it, root cause, the fix, and what prevents a recurrence. That four-part structure is what a reviewer looks for."]},"dayfiles":{"Mon":{"act":"new","path":"dags/market_elt_backfill_dag.py"},"Tue":{"act":"continue","path":"dags/market_elt_daily_dag.py","note":"Add the Cloud Storage sensor here."},"Wed":{"act":"continue","path":"dags/market_elt_daily_dag.py","note":"Replace the hard-coded ticker tasks with dynamic mapping."},"Thu":{"act":"continue","path":"dags/market_elt_daily_dag.py","note":"Callbacks and Deadline Alerts."},"Fri":{"act":"new","path":"docs/runbook.md","note":"Write it as if handing over to someone who has never seen the DAG."}}},{"n":29,"phase":4,"title":"Security & IAM for Data Platforms","goal":"Least-privilege everywhere, zero hard-coded secrets — and the ability to explain why this matters more in finance than almost anywhere else.","days":[["Tue","The GCP model: members, roles and bindings, and the three role types — basic (`owner`/`editor`/`viewer`, avoid), predefined, and custom. Service accounts are the workload identity. The rule: never download a service-account key; use Workload Identity or ADC instead, because a leaked JSON key is the GCP equivalent of a leaked access key. **Then:** Write a genuinely least-privilege binding for your ingestion job — read one bucket, write another, run BigQuery jobs, nothing else. Start from a predefined role, then narrow to custom if it is still too broad. Test that it fails when it should."],["Wed","Secret Manager for API keys; purge every hard-coded secret from your repos; rotate one. Check your git *history*, not just current files."],["Thu","Encryption at rest (Google-managed by default, CMEK via Cloud KMS when the client demands it) and in transit; IAM conditions and VPC Service Controls as the boundary story; what this maps to in a bank's compliance language — data classification, access review, audit trail. **Data residency**: know why `europe-west2` versus a US multi-region is a compliance question, not a latency one."],["Fri","Run a real access review on your own project: list every service account and role binding, use Policy Analyzer to see who can actually reach your data, delete anything unused, document what remains and why."]],"files":["docs/security.md","infra/iam.tf  (hardened)"],"mini":{"n":19,"name":"`docs/security.md` + hardened Terraform IAM","desc":"","feeds":"Major Project 3 ships with least-privilege IAM per service.","mp":[3]},"resources":[{"day":null,"md":"Reference: [Use IAM securely — official Google Cloud docs](https://docs.cloud.google.com/iam/docs/using-iam-securely)"},{"day":null,"md":"Video: [GCP IAM Basics — roles, permissions, service accounts, with a demo](https://www.youtube.com/watch?v=ZhunHQcj3XY)"},{"day":null,"md":"Course: [Google Cloud IAM Basics — users, groups, roles and policies (Tiny Technical Tutorials)](https://www.youtube.com/watch?v=hAk-7ImN6iM)"},{"day":null,"md":"Practice: [Policy Troubleshooter — test who can do what](https://docs.cloud.google.com/policy-intelligence/docs/troubleshoot-access)"},{"day":"Wed","md":"[Secret Manager — overview](https://docs.cloud.google.com/secret-manager/docs/overview)"}],"dod":"A least-privilege role binding written, attached and tested; zero hard-coded secrets and zero downloaded service-account keys in any repo or its history; an access review documented; and you can explain data residency in one sentence.","exercises":{"Tue":["Write the difference between a user, a role and a policy in one line each.","Find every long-lived access key in your account and write down what it is for.","State the rule you will follow for the rest of the plan in one sentence.","Write a policy granting read on the raw bucket and write on the curated bucket, and nothing else.","Attach it via a role and run the ingestion successfully.","**Now prove it fails correctly** — try to write to the raw bucket and confirm access denied. An untested policy is not least-privilege."],"Wed":["Move every API key into Secret Manager and update the code to fetch at runtime.","Search your full git **history** for secrets, not just the working tree.","Rotate one credential and confirm the pipeline still runs.","PDP: Write a **data-handling note** for a dataset containing personal data: what fields are PII, how they are protected, who can reach them, and how long they are kept. Your market data has none — so use a worked example with a client-style dataset, because this is the note your PDP asks for."],"Thu":["Enable SSE on both buckets and confirm encryption at rest.","Write a bucket policy denying any request not using TLS.","Write one paragraph translating your setup into bank compliance language: data classification, access review, audit trail."],"Fri":["List every role and policy in your account and mark each keep or delete.","Delete the unused ones, then re-run the pipeline to confirm you deleted nothing load-bearing.","Write `docs/security.md` recording what remains and why each exists.","PDP: Apply the three governance controls together on one dataset — **access** (who), **retention** (how long, via a lifecycle rule), and **lineage/documentation** (where it came from, via dbt docs or the catalog). Screenshot each."]},"dayfiles":{"Tue":{"act":"new","path":"infra/iam.tf","note":"Split IAM out of `main.tf` into its own file — the Week-23 convention."},"Wed":{"act":"none","note":"Secret Manager console, plus a sweep across **every** repo you have made so far. Check git history, not just the working tree."},"Thu":{"act":"new","path":"docs/security.md"},"Fri":{"act":"continue","path":"docs/security.md","note":"The access review goes in here — what exists, and why each thing still exists."}}},{"n":30,"phase":4,"title":"Data Quality, Testing & CI/CD","goal":"Pipelines that fail loudly rather than silently — and automation that runs those checks on every push. These pair deliberately: writing tests and *automating* them are one discipline, not two.","days":[["Mon","Data-quality dimensions: completeness, uniqueness, validity, timeliness, consistency, accuracy. Map each to a check you could actually write. Expand your dbt tests to cover them."],["Tue","Great Expectations for what dbt can't express — distributions, ranges, freshness. Alerting: an email notification channel, or an Airflow `on_failure_callback` reusing Week 28's pattern. Simulate a bad load (negative price, duplicate day, missing ticker); confirm it's caught *and* alerts fire."],["Wed","GitHub Actions: workflows, jobs, steps, triggers, repository secrets. Write a workflow installing dependencies and running `pytest` on pull requests."],["Thu","Extend CI to run `dbt build` against a CI target; add SQL linting with sqlfluff and Python linting with ruff. Gate merges on green checks; add a status badge to the README."],["Fri","Observability beyond tests: Cloud Monitoring metrics and logs, a pipeline-health view, freshness monitoring. Document the QA layer and what you'd add with more time."]],"files":[".github/workflows/ci.yml",".sqlfluff","great_expectations/","docs/data_quality.md"],"mini":{"n":20,"name":"Quality layer + CI pipeline","desc":"Checks, alerting, and a green CI run on a pull request.","feeds":"Major Project 3's trust layer.","mp":[3]},"resources":[{"day":null,"md":"Course: [GitHub Actions — From Zero to Hero in 90 Minutes (CoderDave)](https://www.youtube.com/watch?v=TLB5MY9BBa4)"},{"day":null,"md":"Reference: [Great Expectations — official documentation](https://docs.greatexpectations.io/docs/)"},{"day":null,"md":"Tutorial: [Great Expectations: validating data with Python (DataCamp)](https://www.datacamp.com/tutorial/great-expectations-tutorial)"},{"day":"Mon","md":"[dbt tests — official docs](https://docs.getdbt.com/docs/build/data-tests)"},{"day":"Wed","md":"[GitHub Actions — official documentation](https://docs.github.com/en/actions) and [GitHub Skills — free interactive course](https://skills.github.com/)"},{"day":"Thu","md":"[sqlfluff — SQL linter](https://docs.sqlfluff.com/) and [dbt in CI — official guidance](https://docs.getdbt.com/docs/deploy/continuous-integration)"},{"day":"Tue","md":"[Cloud Monitoring alerting — official docs](https://docs.cloud.google.com/monitoring/alerts)"}],"vidbase":"https://www.youtube.com/watch?v=TLB5MY9BBa4","vidlabel":"CoderDave GitHub Actions","chapters":{"Wed":[[364,"Components of GitHub Actions"],[423,"Events (Triggers) details"],[535,"Workflows details"],[4367,"GitHub Actions Secrets Overview"]],"Thu":[[2774,"CI Workflows with Actions"],[3099,"CD Workflows with Actions"]]},"dod":"Quality checks added to the pipeline; failure alerting works end-to-end; a simulated bad load is caught; CI runs tests and `dbt build` on PRs with a status badge; merges gated on green checks.","data":[{"title":"The bad load you must catch","lang":"python","note":"Tuesday says simulate a bad load. **Do it at the source, not with SQL** — a standard BigQuery external table is read-only, so `INSERT` and `DELETE` will simply fail against it. Corrupt the raw file in Cloud Storage and re-run the pipeline, which is also how a bad load actually reaches you in production: upstream sends rubbish and your checks are the only thing standing there.","code":"# scripts/inject_bad_load.py  -- writes a deliberately broken raw file\nimport pandas as pd\n\ndf = pd.read_csv(\"data/prices.csv\", parse_dates=[\"price_date\"])\n\n# 1. VALIDITY - a negative close is impossible\ndf.loc[(df.ticker == \"AAPL\") & (df.price_date == \"2026-06-30\"), \"close\"] = -12.50\n\n# 2. UNIQUENESS - the same ticker and day twice\ndupe = df[(df.ticker == \"MSFT\") & (df.price_date == \"2026-06-30\")]\ndf = pd.concat([df, dupe], ignore_index=True)\n\n# 3. COMPLETENESS - a day that should be there and isn't\ndf = df[~((df.ticker == \"JPM\") & (df.price_date == \"2026-06-29\"))]\n\n# 4. CONSISTENCY - high below low\nmask = (df.ticker == \"XOM\") & (df.price_date == \"2026-06-30\")\ndf.loc[mask, [\"high\", \"low\"]] = [108.00, 115.00]\n\ndf.to_csv(\"data/prices_bad.csv\", index=False)\nprint(len(df), \"rows written - now upload to raw/ and re-run the pipeline\")","check":"Four dimensions, four failures, and they are not equally easy to catch. dbt handles two of them natively: `unique` on ticker+date finds the duplicate, and a singular test or `accepted_values` finds the negative close. The **high < low** row and the **missing day** are the two dbt cannot express naturally — a missing row triggers no test at all, because there is nothing there to test. Those two are precisely why Great Expectations is on the Tuesday. If your run goes green, your checks are decorative."}],"exercises":{"Mon":["Write the six quality dimensions and one check you could actually write for each against your prices data.","Add the ones dbt can express to `schema.yml`.","Note which dimensions dbt **cannot** express — that list is why tomorrow exists."],"Tue":["Add Great Expectations checks for distribution, range and freshness.","Run the bad-load injector and confirm **all four** problems are caught.","Confirm an alert actually fires. A caught failure nobody hears about is not caught.","PDP: Now the hard one — inject a **silently-wrong** result: correct row count, plausible values, wrong numbers. Duplicate one instrument in a dimension so a join double-counts volume. Confirm your existing tests **miss it**, then write the check that catches it. This is the failure mode that reaches production."],"Wed":["Write a GitHub Actions workflow installing dependencies and running pytest on pull requests.","Open a PR that deliberately breaks a test and confirm CI goes red.","Store the Google Cloud credentials as repository secrets, never in the workflow file."],"Thu":["Extend CI to run `dbt build` against a CI target.","Add sqlfluff and ruff, then fix everything they flag.","Turn on branch protection requiring green checks, and add the badge to the README."],"Fri":["Build a Cloud Monitoring view showing pipeline runs, failures and freshness.","Add a freshness check that fires if no data lands for 36 hours.","Write `docs/data_quality.md` including what you would add with another week."]},"dayfiles":{"Mon":{"act":"continue","path":"dbt/models/schema.yml","note":"Expand the Week-21 tests to cover all six quality dimensions."},"Tue":{"act":"new","path":"great_expectations/","note":"Scaffolded by `great_expectations` itself. Note GX 1.0 uses `gx.Context()` — older tutorials will not work."},"Wed":{"act":"new","path":".github/workflows/ci.yml","note":"Create `.github/workflows/`. The leading dot matters."},"Thu":{"act":"new","path":".sqlfluff","note":"Repo root. Also extend `ci.yml` to run `dbt build` and the linters."},"Fri":{"act":"new","path":"docs/data_quality.md"}}},{"n":31,"phase":4,"title":"Streaming with Kafka","goal":"A producer/consumer moving simulated market ticks — the scarcest, most differentiating skill here, and the one that speaks directly to trading desks.","days":[["Tue","Topics, partitions, offsets, consumer groups, ordering guarantees, delivery semantics (at-most/at-least/exactly-once), retention, windowing. **Then:** Run Kafka locally via Docker Compose (free). Create a topic; publish simulated price ticks with a Python producer."],["Wed","A Python consumer reading ticks and writing to Cloud Storage. Batching, commit strategies, and what happens when the consumer dies mid-batch."],["Thu","Simulating a realistic stream: replay historical bars into Kafka on a timer with a proper event schema (symbol, price, volume, timestamp). You won't get free real-time tick data — simulating it well *is* the exercise."],["Fri","How this maps to managed services: Managed Service for Apache Kafka, Pub/Sub, and where each fits. Write the batch-vs-streaming comparison."]],"files":["streaming/producer.py","streaming/consumer.py","streaming/schema.py","docker-compose.kafka.yml","docs/batch_vs_streaming.md"],"mini":{"n":21,"name":"Producer + consumer","desc":"","feeds":"Major Project 3's streaming path.","mp":[3]},"resources":[{"day":null,"md":"Course: [Kafka Crash Course — Hands-On Python Project (TechWorld with Nana)](https://www.youtube.com/watch?v=B7CwU_tNYIE)"},{"day":null,"md":"Course: [Confluent Developer — Apache Kafka for Python Developers (free, with labs)](https://developer.confluent.io/courses/kafka-python/)"},{"day":null,"md":"Client: [confluent-kafka-python — GitHub with examples](https://github.com/confluentinc/confluent-kafka-python)"},{"day":null,"md":"Reference: [Apache Kafka — official documentation](https://kafka.apache.org/documentation/)"},{"day":"Fri","md":"[Managed Service for Apache Kafka — overview](https://docs.cloud.google.com/managed-service-for-apache-kafka/docs/overview)"},{"day":"Fri","md":"[What is Pub/Sub?](https://docs.cloud.google.com/pubsub/docs/overview) — the managed alternative to running Kafka yourself"}],"vidbase":"https://www.youtube.com/watch?v=B7CwU_tNYIE","vidlabel":"Nana Kafka","chapters":{"Tue":[[40,"What is Kafka? Why Kafka?"],[332,"How Kafka achieves scalable performance"],[440,"Kafka vs Other Message Brokers"],[783,"Run Kafka with Docker Compose"],[1663,"Write and Run a Kafka Producer"]],"Wed":[[2652,"Using Kafka CLI"],[2924,"Write and Run a Kafka Consumer"]]},"dod":"Kafka running locally with a working topic; a producer/consumer moving tick data to Cloud Storage; a written batch-vs-streaming note; you can explain how Kafka maps to Managed Service for Apache Kafka.","data":[{"title":"The tick event schema","lang":"python","note":"Thursday says replay historical bars on a timer. Define the event first — a stream with no schema is where streaming projects go wrong, and 'what does one record look like' is the first thing an interviewer asks.","code":"# streaming/schema.py\nfrom dataclasses import dataclass, asdict\nfrom datetime import datetime, timezone\nimport json\n\n@dataclass(frozen=True)\nclass Tick:\n    symbol: str\n    price: float\n    volume: int\n    event_ts: str      # ISO-8601, UTC, when the tick happened\n    seq: int           # monotonic per symbol - lets you detect gaps\n\n    def to_json(self) -> str:\n        return json.dumps(asdict(self))\n\n    @staticmethod\n    def from_bar(symbol: str, close: float, volume: int, seq: int) -> \"Tick\":\n        return Tick(\n            symbol=symbol,\n            price=close,\n            volume=volume,\n            event_ts=datetime.now(timezone.utc).isoformat(),\n            seq=seq,\n        )","check":"Key it by `symbol` when you produce, so all ticks for one symbol land on the same partition and stay ordered — ordering is per-partition, never global, and that is the single most common Kafka interview question. The `seq` field is how your consumer proves it dropped nothing: if you consume 500 ticks for AAPL, `max(seq) - min(seq) + 1` should equal 500."}],"exercises":{"Tue":["Define topic, partition, offset and consumer group in one line each.","Explain why ordering is guaranteed per partition and never globally — the single most common Kafka interview question.","Write when at-least-once is acceptable and when it is not.","Get Kafka running via Docker Compose and create a topic with 3 partitions.","Write a producer publishing simulated ticks, keyed by symbol.","Consume from the console and confirm you see them."],"Wed":["Write a Python consumer batching ticks and writing to Cloud Storage.","Kill the consumer mid-batch, restart it, and record whether you lost or duplicated messages.","Write one line on which commit strategy caused that and what the alternative costs."],"Thu":["Replay historical bars into Kafka on a timer using the `Tick` schema.","Add the `seq` field and prove no gaps: **`max(seq) - min(seq) + 1` must equal the count consumed.**","Run for five minutes and confirm Cloud Storage objects appear steadily."],"Fri":["Compare Managed Service for Apache Kafka against Pub/Sub in a table: cost, ops burden, ecosystem, when to choose each.","Write `docs/batch_vs_streaming.md` stating which parts of your platform justify streaming and which do not. 'Everything should stream' is the wrong answer."]},"dayfiles":{"Tue":{"act":"new","path":"docker-compose.kafka.yml · streaming/producer.py","note":"Create the `streaming/` folder."},"Wed":{"act":"new","path":"streaming/consumer.py"},"Thu":{"act":"new","path":"streaming/schema.py","note":"Define the tick event schema properly — symbol, price, volume, timestamp."},"Fri":{"act":"new","path":"docs/batch_vs_streaming.md"}}},{"n":32,"phase":5,"title":"MAJOR PROJECT 3: Trading-Data Platform (Build)","major":3,"goal":"Everything, wired together and running. Terraform-provisioned, Airflow-orchestrated, Kafka-fed, dbt-transformed, IAM-secured, CI-tested, containerised.","research_intro":"**Research first:**","research":["Does your batch source still hold at this scale?","How do you simulate a stream credibly — replay historical bars into Kafka on a timer?","What record schema does each tick carry?","If someone challenges a number in your dashboard six months from now, what exactly would you need to have kept in order to defend it?","What does dbt's lineage graph give you for free, and what does it not?"],"days":[["Mon","New repo `trading-data-platform`. Architecture diagram covering both data paths; scaffold Terraform for the whole stack."],["Tue","Batch path: daily OHLCV via the Week-25 package into `raw/`."],["Wed","Streaming path: simulated tick stream (Week 31) → Kafka → Cloud Storage."],["Thu","dbt transforms and tests on BigQuery over both paths; Looker Studio serving layer."],["Fri","Orchestrate with Airflow using Week 28's production patterns — dynamic mapping, sensors, alerting. Least-privilege IAM per service. Tear down anything billable when idle."]],"tree_title":"Target repo tree — `trading-data-platform`","tree":"trading-data-platform/\n├── README.md\n├── pyproject.toml\n├── .gitignore\n├── .github/workflows/ci.yml\n├── src/\n│   └── ingestion/          # batch path (Week 25)\n├── streaming/\n│   ├── producer.py         # simulated ticks (Week 31)\n│   ├── consumer.py\n│   └── schema.py\n├── dags/\n│   ├── trading_platform_daily_dag.py\n│   └── trading_platform_backfill_dag.py\n├── plugins/operators/\n├── dbt/\n│   ├── dbt_project.yml\n│   └── models/{staging,marts}/\n├── infra/\n│   ├── main.tf\n│   ├── iam.tf\n│   ├── variables.tf\n│   └── outputs.tf\n├── great_expectations/\n├── tests/\n├── docker-compose.yml\n├── Dockerfile\n└── docs/\n    ├── architecture.md\n    ├── architecture.png\n    ├── runbook.md\n    ├── security.md\n    └── data_quality.md","spec":"Batch ingestion (daily OHLCV) + a streaming path via Kafka (simulated ticks) · dbt marts over both, in BigQuery · an orchestrating Airflow DAG with retries, sensors and dynamic mapping · all infrastructure via Terraform · least-privilege IAM per service, no hard-coded secrets · CI running `dbt build` and tests on PRs · data-quality checks with alerting · a Looker Studio dashboard · an **audit trail**: every mart row traceable to the raw file and pipeline run that produced it, so any figure can be reproduced on demand · a written reproducibility note showing one number recomputed from source.","resources":[{"day":null,"md":"Walkthrough: [End-to-end pipeline with Airflow, dbt, Cosmos, GCS and BigQuery (Data Pipeline Lab, 54 min)](https://www.youtube.com/watch?v=a8wP37AX-d8) — closest public example to this architecture."},{"day":null,"md":"Reference: [Airflow — best practices guide](https://airflow.apache.org/docs/apache-airflow/stable/best-practices.html)"},{"day":null,"md":"Reference: [Google Cloud Well-Architected Framework](https://docs.cloud.google.com/architecture/framework)"},{"day":"Mon","md":"[diagrams.net — free architecture diagramming](https://app.diagrams.net/)"}],"dod":"One DAG run refreshes everything; both ingestion paths land data; a simulated bad tick is caught and alerts; CI is green on PRs.","exercises":{"Mon":["Answer the three research questions in writing.","Draw the architecture diagram covering **both** the batch and streaming paths.","Scaffold and `apply` Terraform for the whole stack."],"Tue":["Wire the Week-25 package in for the batch path.","Confirm it needed **no changes**. If it did, note what — that is a finding about Week 25.","Run it twice and confirm idempotency still holds."],"Wed":["Wire in the Week-31 producer and consumer.","Get simulated ticks flowing to Cloud Storage continuously.","Confirm both paths write to the same lake without colliding on keys."],"Thu":["Build dbt marts over both paths, with tests passing on each.","Build the Looker Studio layer showing batch and streaming side by side.","Reconcile them: does the streaming close for a day match the batch close? Explain any gap."],"Fri":["Orchestrate everything in one Airflow DAG with dynamic mapping, sensors and alerting.","Apply least-privilege IAM per service and confirm each fails correctly outside its scope.","**Tear down everything billable** and confirm your Google Cloud bill returns to near zero."]},"dayfiles":{"Mon":{"act":"new","path":"trading-data-platform/","note":"New repo — the headline one. Scaffold `infra/` for the whole stack and draw both data paths in `docs/architecture.png`."},"Tue":{"act":"reuse","path":"src/ingestion/","note":"Third outing for the Week-25 package. It should still need no changes."},"Wed":{"act":"reuse","path":"streaming/","note":"Carried over from Week 31."},"Thu":{"act":"reuse","path":"dbt/","note":"Carried over from Weeks 21 and 26, now covering both paths."},"Fri":{"act":"reuse","path":"dags/ · plugins/operators/ · infra/iam.tf","note":"Orchestration from Weeks 27–28 and least-privilege IAM from Week 29."}},"build":["**Repo and architecture first.** Both data paths on one diagram before any code. If you cannot draw it, you cannot build it.","**Terraform the whole stack** — buckets, datasets, service accounts, one per service with its own least-privilege binding.","**Batch path.** Week 24's package into the raw layer. Reused, not rewritten.","**Streaming path.** Week 31's producer and consumer, writing to a separate raw prefix. Keep the paths physically separate in storage; merging them is a modelling decision, not a storage one.","**dbt over both.** Staging per path, then shared marts. This is where you decide how a tick and a daily bar reconcile.","**Quality gates.** Week 29's checks on both paths, with alerting that actually fires.","**Orchestrate.** One DAG: sensors, dynamic mapping across tickers, retries, failure callback. Not three DAGs held together by schedule timing.","**Audit trail.** Every mart row carries the source file and run id that produced it.","**CI.** `dbt build` and pytest on pull requests, merges gated.","**Tear down anything billable** and confirm the bill returns to near zero."],"accept":["**One DAG run refreshes everything.** Trigger it, walk away, come back to a complete warehouse.","Both paths land data in the same run, and you can prove which rows came from which.","A deliberately bad tick is caught, quarantined, and produces an alert containing the task, the run and what to do next.","CI is green on a pull request, and a deliberately broken PR goes red.","**Pick any number on the dashboard and trace it back to a raw file** in under five minutes, using only what is in the repo.","The DAG survives a backfill over a past date range with no duplicate rows.","Every service uses its own service account, and each one fails when asked to do something outside its scope.","`terraform destroy` leaves nothing billable behind. Check the billing console the next day."],"failure":["**The streaming consumer dies mid-batch.** On restart, do you lose messages, duplicate them, or neither? Whichever it is, know it and write it down.","**The batch and streaming paths disagree** about the same day's close. Which wins, and why? This is a real reconciliation decision, not a bug.","**The DAG fails at 03:00.** Your runbook is the deliverable — first five things to check, in order.","**A backfill overlaps a live run.** Does Airflow prevent this, or do you?","**A dbt model fails halfway.** Is the warehouse left in a half-transformed state, and can you tell?","**Someone rotates the API key.** How long until the pipeline recovers, and does it alert or fail silently?"],"rubric":["**The reproducibility test:** hand the repo to someone with a Google Cloud project and no context. Could they run it? That is the bar, and the answer is usually no on the first attempt.","Does the README lead with the problem, or with the tech stack? *The stack is not the story.*","Is there anything in the repo you would not want a hiring manager to read — a TODO, a commented-out block, a rude commit message?","Can you talk through the whole system in three minutes without notes? Record yourself and listen back.","For every tool in the stack, can you say what you would have used instead and why you did not?","Does the audit trail actually work, or does it just exist? Pick a number and trace it, timed."],"data":[{"title":"Audit-trail columns — add these to every mart","lang":"BigQuery SQL","note":"Four columns that turn 'the dashboard says 231.40' into 'the dashboard says 231.40, from this file, loaded by this run, at this time'. Add them as a dbt macro so no model can forget.","code":"-- dbt/macros/audit_columns.sql\n{% macro audit_columns() %}\n  _source_uri     STRING,   -- the gs:// object this row came from\n  _pipeline_run   STRING,   -- Airflow run id\n  _loaded_at      TIMESTAMP,-- when it landed\n  _dbt_invocation STRING    -- {{ invocation_id }}\n{% endmacro %}\n\n-- and the trace query you will be asked to run in an interview\nSELECT\n  f.ticker, f.price_date, f.close,\n  f._source_uri, f._pipeline_run, f._loaded_at\nFROM market_elt.fct_daily_prices f\nWHERE f.ticker = 'AAPL' AND f.price_date = DATE '2026-06-11';","check":"The trace query must return **exactly one row**, and `_source_uri` must be an object that still exists in Cloud Storage. Open it and confirm the close price matches. **Time yourself** — if tracing one number takes more than five minutes, your audit trail is not usable, and that is the whole point of having one."}]},{"n":33,"phase":5,"title":"Capstone Polish, CV & Interview Prep","goal":"Ship the headline project and convert the portfolio into interviews.","days":[["Mon","Full capstone README: problem, architecture diagram, stack, how to run it, findings, runbook link. Record a walkthrough video. Pin as headline project."],["Tue","Rewrite the CV around all three projects with impact bullets (tool + action + result), UK English, standardised sections, no fluff. GCP/BigQuery/Dataform framed as multi-cloud strength. Update LinkedIn: headline, About, Featured."],["Thu","SQL interview drills: windows, joins, optimisation. Data-modelling questions — design a star schema out loud, declaring grain first. **Then:** Full pipeline system-design mock: idempotency, backfills, late-arriving data, monitoring, least-privilege IAM, cost. Then behavioural prep (STAR) and the project deep-dive story."],["Fri","Decide on the **Google Cloud Professional Data Engineer** ($200, 2 hours, valid two years) — it also satisfies the certification line in your workplace development plan, which makes it close to free in marginal effort. Book a date if you want it; an unbooked exam never happens. Keep applying — this is a cadence now, not a phase."]],"resources":[{"day":null,"md":"Drills: [DataLemur — SQL & data interview questions](https://datalemur.com/) and [StrataScratch](https://www.stratascratch.com/)"},{"day":null,"md":"Mocks: [30 Data Engineering Live Mock Interviews (playlist)](https://www.youtube.com/playlist?list=PLtgiThe4j67p-vM7wHByuGQ8AD9KXBnac)"},{"day":"Fri","md":"[Google Cloud Professional Data Engineer (official exam page)](https://cloud.google.com/learn/certification/data-engineer)"}],"dod":"Capstone README, diagram and walkthrough video live and pinned; CV and LinkedIn rebuilt around three projects; SQL drills done; a star schema explained out loud; one system-design mock completed; you can talk fluently about why Terraform, IAM, Kafka, dbt and Snowflake are each in your stack — and why your dbt project runs on two warehouses.","exercises":{"Mon":["Write the capstone README: problem, architecture, stack, how to run, findings, runbook link.","Record the walkthrough video and pin the repo as your headline project.","Clone fresh and follow your own README — anything that fails is a README bug."],"Tue":["Rewrite the CV around all three projects, every bullet with a number.","Frame GCP/BigQuery/Dataform as multi-cloud strength.","Update LinkedIn headline, About and Featured to match."],"Thu":["Do 10 window-function and 10 join problems on DataLemur, timed.","Design a star schema out loud for a domain you have never modelled, declaring grain first.","Record yourself once and listen back for filler and hedging.","Do a full system-design mock: ingest 50M rows daily, covering idempotency, backfills, late data, monitoring, IAM and cost.","Write three STAR stories: something you fixed, something you got wrong, something you decided under uncertainty.","Rehearse the 3-minute capstone deep-dive until it needs no notes."],"Fri":["Decide on the Google Cloud Professional Data Engineer and, if yes, book a date. An unbooked exam never happens.","Send the week's applications.","Review the tracker: which stage are you losing candidates at, and what will you change next week?"]},"dayfiles":{"Mon":{"act":"continue","path":"README.md","note":"The capstone README, plus a recorded walkthrough linked from it."},"Tue":{"act":"new","path":"CV (outside the repo)","note":"Rebuilt around three projects. LinkedIn is not a file, but update it the same day."},"Thu":{"act":"none","note":"Mock interview — nothing to commit."},"Fri":{"act":"none","note":"Decision and applications — nothing to commit."}}}],"sources":["[Data Engineering Jobs in the UK 2026: Demand, Salaries & Hiring Data](https://dataengineeringjobs.co.uk/career-advice/data-engineering-jobs-uk-market-data-2026)","[Salary: Junior Data Engineer in London 2026 — Glassdoor](https://www.glassdoor.co.uk/Salaries/london-junior-data-engineer-salary-SRCH_IL.0,6_IM1035_KO7,27.htm)","[Google Cloud Certified Data Engineer Associate Quick Facts (2026)](https://certificationpractice.com/exam-overviews/aws-certified-data-engineer-associate-quick-facts)","[Alpha Vantage vs Yahoo Finance API — an honest comparison](https://dev.to/pickuma/alpha-vantage-vs-yahoo-finance-api-free-market-data-for-side-projects-an-honest-comparison-411o)","[Best Free Stock Market APIs and Data Tools in 2026](https://dev.to/nexgendata/best-free-stock-market-apis-and-data-tools-in-2026-a-developers-honest-comparison-1926)","[Finnhub — API documentation](https://finnhub.io/docs/api)","[Google Cloud Professional Data Engineer (official)](https://cloud.google.com/learn/certification/data-engineer)"],"basket":{"title":"The canonical basket — same 15 tickers from Week 7 to Week 33","intro":"Every synthetic row and every real API call uses this basket. Weeks 7–14 use the first **5**, Week 16 expands to **10**, Week 26 uses all **15**. Because the symbols never change, Week 8's SQL still runs against Week 26's real data.","head":["#","Ticker","Name","Sector","First used"],"rows":[["1","`AAPL`","Apple Inc.","Technology","Week 8"],["2","`MSFT`","Microsoft Corp.","Technology","Week 8"],["3","`JPM`","JPMorgan Chase & Co.","Financials","Week 8"],["4","`XOM`","Exxon Mobil Corp.","Energy","Week 8"],["5","`JNJ`","Johnson & Johnson","Healthcare","Week 8"],["6","`NVDA`","NVIDIA Corp.","Technology","Week 8 *(lookup only — no trades, on purpose)*"],["7","`GS`","Goldman Sachs Group","Financials","Week 16"],["8","`CVX`","Chevron Corp.","Energy","Week 16"],["9","`PFE`","Pfizer Inc.","Healthcare","Week 16"],["10","`WMT`","Walmart Inc.","Consumer Staples","Week 16"],["11","`AMZN`","Google Cloud.com Inc.","Consumer Discretionary","Week 26"],["12","`BAC`","Bank of America Corp.","Financials","Week 26"],["13","`KO`","Coca-Cola Co.","Consumer Staples","Week 26"],["14","`UNH`","UnitedHealth Group","Healthcare","Week 26"],["15","`CAT`","Caterpillar Inc.","Industrials","Week 26"]],"foot":"`NVDA` is in the instruments lookup with **no trades against it**. That is deliberate: it is what makes `INNER JOIN` and `LEFT JOIN` return different row counts in Week 8 Tuesday. Don't delete it."},"chain":{"title":"How one dataset becomes every table in the plan","intro":"Nothing here is thrown away. Each stage is the previous stage transformed:","rows":[["Weeks 8, 18","`trades` · `instruments` · `venues`","Hand-seeded BigQuery SQL. Five instruments, six months, 54 trades."],["Weeks 9–10","`raw_trades.csv`","The same trades exported, then deliberately dirtied with NaNs and a duplicate."],["Weeks 10, 12–14","`prices.csv`","Daily OHLCV generated for the basket — what returns, volatility and correlation need."],["Weeks 12, 16","`gs://…/raw/prices/`","The same CSV, landed in Cloud Storage and exposed as a BigQuery external table."],["Week 16+","Real API OHLCV","Same columns, same tickers — synthetic prices swapped for Finnhub/Alpha Vantage. No schema change."],["Week 15","`adjusted_prices` · `corporate_actions`","Split- and dividend-adjusted series. **Every returns figure from here on reads this, not raw.**"],["Week 19","`fact_prices` · `dim_date` · `dim_instrument`","The star schema over the same prices."],["Weeks 21, 26","`stg_prices` → `fct_daily_prices`","The same star schema, now built and tested by dbt — and in Week 21, run against Snowflake too."],["Week 31","tick events","Historical bars from the same basket, replayed into Kafka as a simulated stream."]],"foot":"**One dialect, two warehouses.** Everything here is BigQuery standard SQL. Week 21 runs the same dbt models against Snowflake to prove the transformation layer is portable — knowing exactly *what* changes is the interview answer."},"translation":{"title":"GCP ↔ AWS translation — so you can answer either in interview","head":["Concept","Google Cloud (what you build)","AWS (what you say you know)"],"rows":[["Object storage","Cloud Storage (`gs://`)","S3 (`s3://`)"],["Query engine over the lake","BigQuery external tables","Athena"],["Warehouse","BigQuery","Redshift / Athena"],["Catalog & discovery","BigQuery catalog · Knowledge Catalog *(was Dataplex)*","Glue Data Catalog + crawlers"],["Managed Airflow","Managed Service for Apache Airflow *(was Cloud Composer)*","MWAA"],["Managed Kafka","Managed Service for Apache Kafka","Amazon MSK"],["Simpler pub/sub","Pub/Sub","Kinesis / SNS+SQS"],["Workload identity","Service account + role binding","IAM role"],["Secrets","Secret Manager","Secrets Manager"],["Container registry","Artifact Registry","ECR"],["Logs & alerting","Cloud Logging / Cloud Monitoring","CloudWatch"],["BI","Looker Studio","QuickSight"],["Cost lever","Partitioning + clustering; billed per **byte processed**","Partitioning + Parquet; billed per **TB scanned**"],["Encryption at rest","Google-managed, or CMEK via Cloud KMS","SSE-S3, or SSE-KMS"],["IaC provider","`hashicorp/google`","`hashicorp/aws`"],["Certification","Professional Data Engineer — $200, 2h, 2 years","DEA-C01 — $150, 130 min, 3 years"]],"foot":"The concepts are one-to-one; only the nouns change. Week 23 makes you write the Terraform bucket module both ways, so this table is something you have done rather than something you have read. If an interviewer asks about a service you have not deployed, say so and describe the equivalent you have — that reads far better than bluffing."},"lede":"33 weeks · 153 study days · 22 mini-projects · 3 projects. Roughly 8–12 months depending on pace. Open a week to see the day, what to build, and where it lands."};

var KEY='gcpDeTracker.v1';
var S={t:{},m:{},o:{}};
var LS=null,MEM={};
try{var pr='__p__';window.localStorage.setItem(pr,'1');window.localStorage.removeItem(pr);
  LS=window.localStorage;}catch(e){LS=null;}
var PERSIST=!!LS;
try{var raw=LS?LS.getItem(KEY):MEM[KEY];if(raw){var p=JSON.parse(raw);
  S.t=p.t||{};S.m=p.m||{};S.o=p.o||{};}}catch(e){}
function save(){var s=JSON.stringify(S);
  if(LS){try{LS.setItem(KEY,s);}catch(e){MEM[KEY]=s;}}else MEM[KEY]=s;}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function md(s){
  var o=esc(s),st=[];
  o=o.replace(/`([^`]+)`/g,function(_,c){st.push(c);return ''+(st.length-1)+'';});
  o=o.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  o=o.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  o=o.replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s.,;:)]|$)/g,'$1<em>$2</em>');
  o=o.replace(/(\d+)/g,function(_,i){return '<code>'+st[+i]+'</code>';});
  return o;
}
function today(){var d=new Date();return d.toISOString().slice(0,10);}
function dnum(iso){return Math.floor(new Date(iso+'T00:00:00Z').getTime()/864e5);}
function addDays(n){var d=new Date();d.setDate(d.getDate()+n);return d;}
function monthYear(d){return d.toLocaleDateString('en-GB',{month:'short',year:'numeric'});}
/* every tick that carries a date; older ticks saved as 1 have no date and are
   counted as done but excluded from pace maths. */
function tickDates(){
  var out=[];
  for(var k in S.t){var v=S.t[k];if(typeof v==='string'&&v.length===10)out.push(v);}
  return out.sort();
}
function actualPace(){
  var ds=tickDates();
  if(ds.length<5)return null;
  var first=dnum(ds[0]),last=dnum(ds[ds.length-1]),span=Math.max(last-first+1,1);
  if(span<7)return null;                       /* too little history to be honest */
  return ds.length/(span/7);
}
function recent(days){
  var cut=dnum(today())-days,n=0,ds=tickDates();
  for(var i=0;i<ds.length;i++)if(dnum(ds[i])>cut)n++;
  return n;
}
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}
function pad(n){return (n<10?'0':'')+n;}
function hms(s){var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;
  return h?(h+':'+pad(m)+':'+pad(x)):(m+':'+pad(x));}
function copy(txt,btn){
  var done=function(ok){btn.textContent=ok?'Copied':'Select';btn.className='cp '+(ok?'y':'n');
    setTimeout(function(){btn.textContent='Copy';btn.className='cp';},1500);};
  var legacy=function(){try{var ta=document.createElement('textarea');ta.value=txt;
    ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);
    var ok=document.execCommand('copy');document.body.removeChild(ta);done(ok);}catch(e){done(false);}};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(function(){done(true);},legacy);
  else legacy();
}
function fold(id,title,o){
  o=o||{};var k='p:'+id,open=(k in S.o)?!!S.o[k]:!!o.def;
  var s=el('section','sec');if(o.anchor)s.id=o.anchor;
  var h=el('button','sech');h.type='button';h.setAttribute('aria-expanded',open?'true':'false');
  h.innerHTML='<span class="chev">&#9654;</span><h3>'+esc(title)+'</h3>'+
    (o.tag?'<span class="tag" data-tag>'+o.tag+'</span>':'');
  var b=el('div','secb');
  h.addEventListener('click',function(){var n=s.classList.toggle('on');
    h.setAttribute('aria-expanded',n?'true':'false');S.o[k]=n?1:0;save();});
  s.appendChild(h);s.appendChild(b);if(open)s.classList.add('on');
  s.body=b;s.openUp=function(){if(!s.classList.contains('on')){s.classList.add('on');
    h.setAttribute('aria-expanded','true');S.o[k]=1;save();}};
  return s;
}
function table(spec,id){
  var s=fold(id,spec.title,{anchor:id});
  if(spec.intro)s.body.appendChild(el('p',null,md(spec.intro)));
  var sc=el('div','scroll'),t=el('table','t'),hr=el('tr');
  spec.head.forEach(function(x){hr.appendChild(el('th',null,esc(x)));});
  var th=document.createElement('thead');th.appendChild(hr);t.appendChild(th);
  var tb=document.createElement('tbody');
  spec.rows.forEach(function(r){var tr=el('tr');
    r.forEach(function(c){tr.appendChild(el('td',null,md(c)));});tb.appendChild(tr);});
  t.appendChild(tb);sc.appendChild(t);s.body.appendChild(sc);
  if(spec.foot)s.body.appendChild(el('p',null,md(spec.foot)));
  return s;
}
var W=DATA.weeks;
function wdone(w){var c=0;for(var i=0;i<w.days.length;i++)if(S.t['w'+w.n+'d'+i])c++;return c;}

function paceWidget(){
  var box=el('div','pace');
  var total=W.reduce(function(a,w){return a+w.days.length;},0);
  box.innerHTML=
    '<div class="pgrid">'+
      '<div class="pstat"><b data-p-done>0</b><span>days done</span></div>'+
      '<div class="pstat"><b data-p-left>0</b><span>days left</span></div>'+
      '<div class="pstat"><b data-p-7>0</b><span>last 7 days</span></div>'+
      '<div class="pstat"><b data-p-30>0</b><span>last 30 days</span></div>'+
    '</div>'+
    '<label class="prow"><span class="plab">Days per week</span>'+
      '<input type="range" min="1" max="7" step="1" id="paceRange" data-pace '+
      'aria-label="Study days per week">'+
      '<output class="pout" data-p-val>3</output></label>'+
    '<p class="pproj" data-p-proj></p>'+
    '<p class="pact" data-p-act></p>';
  var range=box.querySelector('#paceRange');
  range.value=S.pace||3;
  range.addEventListener('input',function(){S.pace=+range.value;save();paceRefresh();});
  box.addEventListener('click',function(e){
    if(e.target&&e.target.dataset&&e.target.dataset.useact!==undefined){
      var a=actualPace();
      if(a){S.pace=Math.max(1,Math.min(7,Math.round(a)));range.value=S.pace;save();paceRefresh();}
    }
  });
  return box;
}
function setAll(sel,txt){
  var ns=document.querySelectorAll(sel);
  for(var i=0;i<ns.length;i++)ns[i].textContent=txt;
}
function htmlAll(sel,html){
  var ns=document.querySelectorAll(sel);
  for(var i=0;i<ns.length;i++)ns[i].innerHTML=html;
}
function paceRefresh(){
  if(!document.querySelector('.pace')&&!document.getElementById('dock'))return;
  var total=0,done=0;
  W.forEach(function(w){total+=w.days.length;done+=wdone(w);});
  var left=total-done, pace=S.pace||3;
  setAll('[data-p-done]',done);
  setAll('[data-p-left]',left);
  setAll('[data-p-7]',recent(7));
  setAll('[data-p-30]',recent(30));
  setAll('[data-p-val]',pace);
  var finTxt='\u2014';
  if(left<=0){
    htmlAll('[data-p-proj]','<strong>Finished.</strong> Every day ticked \u2014 go and write the CV.');
    finTxt='done';
  }else{
    var wks=Math.ceil(left/pace), fin=addDays(wks*7);
    var mons=(wks/4.345).toFixed(1);
    finTxt=monthYear(fin);
    htmlAll('[data-p-proj]','At <strong>'+pace+' day'+(pace===1?'':'s')+' a week</strong>: '+
      '<strong>'+wks+' weeks</strong> ('+mons+' months) remaining \u2014 finishing around <strong>'+
      finTxt+'</strong>. Add ~15% for the weeks that do not go to plan.');
    setAll('[data-p-wks]',wks+'w');
  }
  setAll('[data-p-fin]',finTxt);
  var a=actualPace();
  if(a){
    var verdict=a>=pace?'ahead of':'behind';
    htmlAll('[data-p-act]','Your measured pace so far is <strong>'+a.toFixed(1)+' days a week</strong> \u2014 '+
      verdict+' the setting above. <button class="plink" data-useact type="button">Use my actual pace</button>');
    setAll('[data-p-actshort]',a.toFixed(1)+'/wk actual');
  }else{
    htmlAll('[data-p-act]','<span class="pdim">Tick at least 5 days across a week or more and this will show your '+
      'real pace instead of an estimate.</span>');
    setAll('[data-p-actshort]','no history yet');
  }
  var rs=document.querySelectorAll('input[type=range][data-pace]');
  for(var i=0;i<rs.length;i++)if(+rs[i].value!==pace)rs[i].value=pace;
}
function week(w){
  var a=el('article','wk'+(w.major?' major':''));a.id='week'+w.n;
  var h=el('button','wkh');h.type='button';h.setAttribute('aria-expanded','false');
  var dots='';for(var i=0;i<w.days.length;i++)dots+='<i data-dot="'+i+'"></i>';
  h.innerHTML='<span class="chev">&#9654;</span><span class="wkn">W'+w.n+'</span>'+
    '<span class="wkt">'+esc(w.title)+'</span>'+
    (w.major?'<span class="pill">Project '+w.major+'</span>':'')+
    '<span class="dots">'+dots+'</span><span class="wkc" data-c>0/'+w.days.length+'</span>';
  h.addEventListener('click',function(){var o=a.classList.toggle('on');
    h.setAttribute('aria-expanded',o?'true':'false');S.o['w'+w.n]=o?1:0;save();});
  a.appendChild(h);
  var b=el('div','wkb');
  b.appendChild(el('p','goal','<b>Goal</b>'+md(w.goal)));
  if(w.callout)b.appendChild(el('div','note','<b>'+esc(w.callout.title)+'</b>'+md(w.callout.body)));
  if(w.research){
    b.appendChild(el('h4','blk','Research first'));
    var rl=el('ul','res');w.research.forEach(function(q){rl.appendChild(el('li',null,md(q)));});
    b.appendChild(rl);
  }
  var byDay={};
  (w.resources||[]).forEach(function(r){if(!r.day)return;
    r.day.split('/').forEach(function(d){(byDay[d]=byDay[d]||[]).push(r.md);});});

  b.appendChild(el('h4','blk','The week'));
  w.days.forEach(function(d,i){
    var id='w'+w.n+'d'+i,row=el('div','day');
    var inp=document.createElement('input');inp.type='checkbox';inp.id=id;inp.checked=!!S.t[id];
    inp.setAttribute('aria-label','Week '+w.n+' '+d[0]+' complete');
    inp.addEventListener('change',function(){
      if(inp.checked)S.t[id]=today();else delete S.t[id];
      row.classList.toggle('tick',inp.checked);save();refresh();});
    if(inp.checked)row.classList.add('tick');
    row.appendChild(inp);
    var bd=el('div','dbody');
    bd.appendChild(el('div','dtop','<b>'+esc(d[0])+'</b>'+md(d[1])));
    var ex=(w.exercises||{})[d[0]];
    if(ex&&ex.length){
      var ul=el('ul','todo');
      ex.forEach(function(x){
        var tag='';
        if(x.indexOf('PDP:')===0){tag='<span class="pdp">PDP</span>';x=x.slice(4).trim();}
        ul.appendChild(el('li',null,tag+md(x)));
      });
      bd.appendChild(ul);
    }
    var fg=(w.dayfiles||{})[d[0]];
    if(fg){
      var lab={"new":"Create","continue":"Continue","reuse":"Carried over","none":"No file"}[fg.act];
      var m=el('div','meta','<span class="act a-'+fg.act+'">'+lab+'</span>'+
        (fg.path?'<span class="path">'+esc(fg.path)+'</span>':'')+
        (fg.note?'<span class="why">'+md(fg.note)+'</span>':''));
      bd.appendChild(m);
    }
    var chs=(w.chapters||{})[d[0]];
    if(chs&&w.vidbase)chs.forEach(function(c){
      bd.appendChild(el('div','vid','<a href="'+w.vidbase+'&t='+c[0]+'s" target="_blank" rel="noopener">'+
        esc(c[1])+'</a><span class="vts">'+hms(c[0])+'</span>'));
    });
    if(byDay[d[0]])byDay[d[0]].forEach(function(x){
      bd.appendChild(el('div','dres','<em>'+esc(d[0])+'</em>'+md(x)));});
