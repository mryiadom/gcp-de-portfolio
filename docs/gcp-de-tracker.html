    row.appendChild(bd);b.appendChild(row);
  });

  function ordered(key,label,cls){
    var items=w[key];
    if(!items||!items.length)return;
    b.appendChild(el('h4','blk',label));
    var ol=el(key==='build'?'ol':'ul','req '+cls);
    items.forEach(function(x){ol.appendChild(el('li',null,md(x)));});
    b.appendChild(ol);
  }
  ordered('build','Build in this order','bd');
  ordered('accept','Acceptance criteria — all must pass','ac');
  ordered('failure','Failure modes it must survive','fm');
  ordered('rubric','Self-review — what a reviewer would reject','rb');

  if(w.data){
    b.appendChild(el('h4','blk','Data for this week'));
    w.data.forEach(function(k){
      var c=el('div','card');
      var hd=el('div','chd');
      hd.appendChild(el('span','ct',md(k.title)));
      if(k.lang)hd.appendChild(el('span','lang',esc(k.lang)));
      var cp=el('button','cp','Copy');cp.type='button';
      cp.addEventListener('click',function(){copy(k.code,cp);});
      hd.appendChild(cp);c.appendChild(hd);
      if(k.note)c.appendChild(el('p',null,md(k.note)));
      c.appendChild(el('pre','code',esc(k.code)));
      if(k.check)c.appendChild(el('div','chk','<b>Check yourself</b>'+md(k.check)));
      b.appendChild(c);
    });
  }
  if(w.files&&w.files.length){
    b.appendChild(el('h4','blk','Files this week'));
    var fl=el('div','files');
    w.files.forEach(function(f){fl.appendChild(el('span',null,esc(f)));});
    b.appendChild(fl);
  }
  if(w.notes)w.notes.forEach(function(n){b.appendChild(el('p','goal',md(n)));});
  if(w.mini){
    b.appendChild(el('h4','blk','Mini-project '+w.mini.n));
    var m=el('div','mini');
    m.appendChild(el('div','mh',md(w.mini.name).replace(/<\/?(strong|em)>/g,'')));
    if(w.mini.desc)m.appendChild(el('p',null,md(w.mini.desc)));
    m.appendChild(el('p','fd',md(w.mini.feeds)));
    b.appendChild(m);
  }
  if(w.tree){
    b.appendChild(el('h4','blk',md(w.tree_title||'Target repo tree')));
    b.appendChild(el('pre','code tree',esc(w.tree)));
  }
  if(w.spec){b.appendChild(el('h4','blk','Spec'));b.appendChild(el('div','spec',md(w.spec)));}
  var gen=(w.resources||[]).filter(function(r){return !r.day;});
  if(gen.length){
    b.appendChild(el('h4','blk','Resources'));
    var ul2=el('ul','res');gen.forEach(function(r){ul2.appendChild(el('li',null,md(r.md)));});
    b.appendChild(ul2);
  }
  if(w.dod)b.appendChild(el('div','dod','<b>Done when</b>'+md(w.dod)));
  a.appendChild(b);
  if(S.o['w'+w.n]){a.classList.add('on');h.setAttribute('aria-expanded','true');}
  return a;
}

function minis(){
  var nMini=W.filter(function(w){return w.mini;}).length;
  var s=fold('minis','Mini-projects — '+nMini+' components feeding 3 projects',
             {anchor:'minis',tag:'0 / '+nMini});
  var g=el('div','mpg');
  W.filter(function(w){return w.mini;}).forEach(function(w){
    var m=w.mini,id='m'+m.n,r=el('div','mpr');
    var i=document.createElement('input');i.type='checkbox';i.id=id;i.checked=!!S.m[id];
    i.addEventListener('change',function(){if(i.checked)S.m[id]=1;else delete S.m[id];save();refresh();});
    var l=el('label');l.setAttribute('for',id);
    l.innerHTML='<div class="mpn">'+m.n+'. '+md(m.name)+'</div><div class="mps">'+
      m.mp.map(function(k){return '<span class="mp'+k+'">P'+k+'</span>';}).join('')+' Week '+w.n+'</div>';
    r.appendChild(i);r.appendChild(l);g.appendChild(r);
  });
  s.body.appendChild(g);return s;
}

function render(){
  var m=document.getElementById('main');
  if(!PERSIST)m.appendChild(el('div','note','<b>Progress will not save</b>This browser blocks local storage for the page. Everything works, but ticks vanish on reload. Open in Chrome, or serve the folder with <code>python3 -m http.server</code>.'));
  var hero=el('header','hero');
  hero.appendChild(el('h1',null,esc(DATA.title)));
  hero.appendChild(el('p','lede',esc(DATA.lede)));
  m.appendChild(hero);

  function panelTable(spec){
    var sc=el('div','scroll'),t=el('table','t'),hr=el('tr');
    spec.head.forEach(function(x){hr.appendChild(el('th',null,esc(x)));});
    var th=document.createElement('thead');th.appendChild(hr);t.appendChild(th);
    var tb=document.createElement('tbody');
    spec.rows.forEach(function(r){var tr=el('tr');
      r.forEach(function(c){tr.appendChild(el('td',null,md(c)));});tb.appendChild(tr);});
    t.appendChild(tb);sc.appendChild(t);return sc;
  }
  DATA.panels.forEach(function(p){
    var f=fold(p.id,p.title,{def:p.id==='start',anchor:'p-'+p.id});
    (p.body||[]).forEach(function(x){f.body.appendChild(el('p',null,md(x)));});
    if(p.table)f.body.appendChild(panelTable(p.table));
    if(p.list){var ul=el('ul');p.list.forEach(function(x){ul.appendChild(el('li',null,md(x)));});f.body.appendChild(ul);}
    (p.after||[]).forEach(function(x){f.body.appendChild(el('p',null,md(x)));});
    if(p.id==='howlong'){
      f.body.appendChild(el('h4','blk','Your pace'));
      f.body.appendChild(paceWidget());
    }
    if(p.milestones){
      f.body.appendChild(el('h4','blk','Milestones'));
      f.body.appendChild(panelTable(p.milestones));
    }
    m.appendChild(f);
  });
  m.appendChild(minis());
  m.appendChild(table(DATA.basket,'basket'));
  m.appendChild(table({title:DATA.chain.title,intro:DATA.chain.intro,head:['Weeks','Artefact','What it is'],rows:DATA.chain.rows,foot:DATA.chain.foot},'chain'));
  if(DATA.translation)m.appendChild(table(DATA.translation,'translation'));
  m.appendChild(table(DATA.naming,'naming'));
  var hy=fold('hygiene',DATA.hygiene.title,{anchor:'hygiene'});
  hy.body.appendChild(el('p',null,md(DATA.hygiene.gitignore_intro)));
  hy.body.appendChild(el('pre','code',esc(DATA.hygiene.gitignore)));
  DATA.hygiene.sections.forEach(function(s){
    hy.body.appendChild(el('p',null,'<strong>'+esc(s.h)+'</strong>'));
    if(s.list){var ul=el('ul');s.list.forEach(function(x){ul.appendChild(el('li',null,md(x)));});hy.body.appendChild(ul);}
    (s.body||[]).forEach(function(x){hy.body.appendChild(el('p',null,md(x)));});
  });
  m.appendChild(hy);

  DATA.phases.forEach(function(ph){
    var sec=el('section','phase');sec.id='phase'+ph.n;
    var k='ph:'+ph.n,open=(k in S.o)?!!S.o[k]:true;
    var t=el('button','ph');t.type='button';t.setAttribute('aria-expanded',open?'true':'false');
    t.innerHTML='<span class="phn">'+ph.n+'</span><span class="phmeta"><h2>'+esc(ph.title)+
      '</h2><span>'+esc(ph.range)+'</span></span><span class="phpc" data-ph="'+ph.n+'">0%</span>';
    sec.appendChild(t);
    var wr=el('div','phwrap');
    wr.appendChild(el('p','phlede',md(ph.intro)));
    W.filter(function(w){return w.phase===ph.n;}).forEach(function(w){wr.appendChild(week(w));});
    sec.appendChild(wr);
    if(open)sec.classList.add('on');
    t.addEventListener('click',function(){var o=sec.classList.toggle('on');
      t.setAttribute('aria-expanded',o?'true':'false');S.o[k]=o?1:0;save();});
    sec.openUp=function(){if(!sec.classList.contains('on')){sec.classList.add('on');
      t.setAttribute('aria-expanded','true');S.o[k]=1;save();}};
    m.appendChild(sec);
  });

  var dr=document.getElementById('dockRange');
  if(dr){
    dr.value=S.pace||3;
    dr.addEventListener('input',function(){S.pace=+dr.value;save();paceRefresh();});
  }
  var dt=document.getElementById('dockTog');
  if(dt){
    var dock=document.getElementById('dock');
    if(S.o['dock']===0)dock.classList.add('shut');
    dt.setAttribute('aria-expanded',dock.classList.contains('shut')?'false':'true');
    dt.addEventListener('click',function(){
      var shut=dock.classList.toggle('shut');
      dt.setAttribute('aria-expanded',shut?'false':'true');
      S.o['dock']=shut?0:1;save();
    });
  }
  var f=el('div','foot','Progress is stored in this browser only. Opening the file elsewhere starts a fresh count.');
  m.appendChild(f);

  function goTo(id){var n=document.getElementById(id);if(!n)return;
    if(n.openUp)n.openUp();if(n.scrollIntoView)n.scrollIntoView({block:'start'});}
  var nav=document.getElementById('nav');
  DATA.phases.forEach(function(ph){
    var b=el('button',null,'P'+ph.n);b.type='button';b.title=ph.title;
    b.addEventListener('click',function(){goTo('phase'+ph.n);});nav.appendChild(b);
  });
  [['Roles targeted','p-roles'],['Mini-projects','minis'],['GCP ↔ AWS','translation'],['Reference','hygiene']].forEach(function(x){
    var b=el('button',null,x[0]);b.type='button';
    b.addEventListener('click',function(){goTo(x[1]);});nav.appendChild(b);
  });
  var ea=el('button','ghost','Expand all');ea.type='button';
  ea.addEventListener('click',function(){
    var any=false;W.forEach(function(w){if(!S.o['w'+w.n])any=true;});
    if(any)DATA.phases.forEach(function(ph){var p=document.getElementById('phase'+ph.n);if(p.openUp)p.openUp();});
    W.forEach(function(w){var n=document.getElementById('week'+w.n);
      if(any){n.classList.add('on');S.o['w'+w.n]=1;}else{n.classList.remove('on');delete S.o['w'+w.n];}
      n.querySelector('.wkh').setAttribute('aria-expanded',any?'true':'false');});
    ea.textContent=any?'Collapse all':'Expand all';save();});
  nav.appendChild(ea);
  var rs=el('button','ghost','Reset');rs.type='button';
  rs.addEventListener('click',function(){
    if(!confirm('Clear all ticked tasks and mini-projects?\n\nThis cannot be undone.'))return;
    if(!confirm('Really reset?'))return;
    S.t={};S.m={};save();
    var bx=document.querySelectorAll('.day input, .mpr input');
    for(var i=0;i<bx.length;i++)bx[i].checked=false;
    var rows=document.querySelectorAll('.day');
    for(var j=0;j<rows.length;j++)rows[j].classList.remove('tick');
    refresh();});
  nav.appendChild(rs);
  refresh();
}

function refresh(){
  var tot=0,dn=0;
  W.forEach(function(w){
    var t=w.days.length,c=wdone(w);tot+=t;dn+=c;
    var n=document.getElementById('week'+w.n);if(!n)return;
    n.querySelector('[data-c]').textContent=c+'/'+t;
    var dots=n.querySelectorAll('[data-dot]');
    for(var i=0;i<dots.length;i++)dots[i].className=S.t['w'+w.n+'d'+i]?'f':'';
    n.classList.toggle('done',c===t&&t>0);
  });
  DATA.phases.forEach(function(ph){
    var pt=0,pd=0;
    W.forEach(function(w){if(w.phase===ph.n){pt+=w.days.length;pd+=wdone(w);}});
    var e=document.querySelector('[data-ph="'+ph.n+'"]');
    if(e)e.textContent=(pt?Math.round(pd/pt*100):0)+'%';
  });
  var pc=tot?Math.round(dn/tot*100):0;
  document.getElementById('pct').textContent=pc+'%';
  document.getElementById('cnt').innerHTML='<b>'+dn+'</b> / '+tot;
  document.getElementById('fill').style.width=pc+'%';
  var md_=0,mt=0;
  W.forEach(function(w){if(w.mini){mt++;if(S.m['m'+w.mini.n])md_++;}});
  paceRefresh();
  var tg=document.querySelector('#minis [data-tag]');
  if(tg)tg.textContent=md_+' / '+mt;
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',render);else render();

</script>
</body>
</html>
