8.0, \"JNJ\": 158.0}\nDAYS = pd.bdate_range(\"2026-01-01\", \"2026-06-30\")   # business days only\n\nrows = []\nfor i, (ticker, base) in enumerate(BASE.items()):\n    rng = np.random.default_rng(1000 + i)\n    close = base\n    for d in DAYS:\n        drift = rng.normal(0.0004, 0.014)           # ~1.4% daily vol\n        close = round(close * (1 + drift), 2)\n        o = round(close * (1 + rng.normal(0, 0.004)), 2)\n        h = round(max(o, close) * (1 + abs(rng.normal(0, 0.005))), 2)\n        l = round(min(o, close) * (1 - abs(rng.normal(0, 0.005))), 2)\n        rows.append({\"ticker\": ticker, \"price_date\": d.date(),\n                     \"open\": o, \"high\": h, \"low\": l, \"close\": close,\n                     \"volume\": int(rng.integers(5_000_000, 60_000_000))})\n\npd.DataFrame(rows).to_csv(\"data/prices.csv\", index=False)","check":"**5 tickers × ~130 business days ≈ 650 rows**. `high` should never be below `close` and `low` never above it — worth asserting, because that is exactly the kind of validity check Week 30 asks you to automate. Your 7-day moving average will be null for the first 6 rows of each ticker; if it is null for only the first 6 rows *overall*, your window is missing `PARTITION BY ticker`."}],"exercises":{"Mon":["Rank each ticker's trading days by volume and return the **top 3 per ticker**. **Expect 15 rows.**","Run `ROW_NUMBER`, `RANK` and `DENSE_RANK` side by side over the same window and construct a tie so the three differ. Explain the difference in one line.","Use `NTILE(4)` to split each ticker's days into volume quartiles."],"Tue":["Compute daily percentage return per ticker with `LAG`. **5 rows will be null — one per ticker.** If only 1 is null your window is missing `PARTITION BY`.","Find each ticker's single best day. **AAPL 2026-01-28 at +3.18%; MSFT 2026-05-29 at +3.73%.**","Use `LEAD` to flag any day followed by a fall of more than 2%."],"Wed":["Take your Thursday-Week-8 subquery and rewrite it as chained CTEs. Same row count, fewer nested brackets.","Build a 3-CTE query: daily returns → 7-day moving average → rank within month. This becomes `returns_analysis.sql`.","Write two sentences on when a recursive CTE would be the right tool. You do not need to write one.","PDP: Deliberately write a join that returns **more rows than it should** — duplicate a key in the instruments lookup and watch the fact table inflate. Then write a short root-cause note: what was wrong, how you spotted it, the fix. Row-count inflation from a non-unique join key is the single most common silently-wrong result in production."],"Thu":["Daily returns plus a 7-day moving average per ticker. **30 rows will have a null MA — 6 per ticker.**","Rank tickers by monthly return within each month. **Expect 30 ticker-month rows**, ranks 1–5 in each month.","Which ticker ranked first in the most months?"],"Fri":["Run the same query with and without a date filter and record the bytes scanned for each.","Read the query plan and identify which step is most expensive.","Write three lines in the file header explaining why filtering early matters — this is the argument you will make again in Week 22 with real numbers."]},"dayfiles":{"Mon":{"act":"continue","path":"sql/analytics/","note":"Scratch queries in the existing folder — nothing new to create yet."},"Tue":{"act":"continue","path":"sql/analytics/"},"Wed":{"act":"continue","path":"sql/analytics/"},"Thu":{"act":"new","path":"sql/analytics/returns_analysis.sql","note":"The week's real deliverable. Start it today, finish it tomorrow."},"Fri":{"act":"continue","path":"sql/analytics/returns_analysis.sql"}}},{"n":11,"phase":1,"title":"Python OOP for Data Engineers","goal":"Comfortable writing classes, and a reusable client class carried through the rest of the plan. OOP earns its place because pipelines are full of things that hold state and do repeated work — API clients, DB connections.","days":[["Tue","Why OOP for engineering rather than analysis: classes model state plus repeated behaviour. Classes vs functions. **Then:** Attributes, methods, `__init__`, `self`, instance vs class attributes. Build a small `Ticker` class."],["Wed","Encapsulation and composition: a `MarketDataClient` wrapping a requests session with retry configuration. Properties."],["Thu","Inheritance vs composition — why \"prefer composition\" is the default, and where inheritance genuinely fits (you'll subclass Airflow's `BaseOperator` in Week 28). Dunder methods: `__repr__`, `__eq__`."],["Fri","Type hints, docstrings, and structuring a package with `__init__.py`."]],"files":["src/warehouse_client.py","src/__init__.py","src/ticker.py"],"mini":{"n":5,"name":"`src/warehouse_client.py`","desc":"An `WarehouseClient` class with `.run_query()` and `.to_dataframe()`, type-hinted and documented.","feeds":"Feeds all three major projects.","mp":[1,2,3]},"resources":[{"day":null,"md":"Course: [Python OOP — Full Course for Beginners (freeCodeCamp)](https://www.youtube.com/watch?v=Ej_02ICOIgs)"},{"day":null,"md":"Reference: [Real Python — OOP in Python 3](https://realpython.com/python3-object-oriented-programming/)"},{"day":null,"md":"Practice: [Codewars — OOP kata](https://www.codewars.com/)"},{"day":"Fri","md":"[Python Packaging User Guide](https://packaging.python.org/en/latest/)"}],"dod":"A class with attributes and methods works; `WarehouseClient` committed to `/src`; you can explain in your own words when composition beats inheritance.","vidbase":"https://www.youtube.com/watch?v=Ej_02ICOIgs","vidlabel":"freeCodeCamp OOP","chapters":{"Tue":[[0,"Getting Started with Classes"],[731,"Constructor, __init__"],[3035,"Class vs Static Methods"],[6660,"OOP Principles"]],"Wed":[[5414,"Getters and Setters"]],"Thu":[[4402,"Inheritance"]]},"data":[{"title":"What your Ticker and WarehouseClient work against","lang":"python","note":"No new dataset this week — the classes wrap what you already have. Use this as the shape your `Ticker` class should model.","code":"# the five instruments your Ticker class should be able to represent\nINSTRUMENTS = [\n    {\"ticker\": \"AAPL\", \"name\": \"Apple Inc.\",           \"sector\": \"Technology\"},\n    {\"ticker\": \"MSFT\", \"name\": \"Microsoft Corp.\",      \"sector\": \"Technology\"},\n    {\"ticker\": \"JPM\",  \"name\": \"JPMorgan Chase & Co.\", \"sector\": \"Financials\"},\n    {\"ticker\": \"XOM\",  \"name\": \"Exxon Mobil Corp.\",    \"sector\": \"Energy\"},\n    {\"ticker\": \"JNJ\",  \"name\": \"Johnson & Johnson\",    \"sector\": \"Healthcare\"},\n]","check":"Two `Ticker` objects built from the same dict should compare equal once you have written `__eq__`, and `repr()` should be something you would be happy to see in a log line — `Ticker('AAPL', sector='Technology')`, not `<object at 0x7f…>`."}],"exercises":{"Tue":["List three things in this plan that hold state and do repeated work, and would therefore be better as classes than functions.","Take one Week-7 function and write down what it would gain, and lose, as a method on a class. If it gains nothing, that is the correct answer.","Build a `Ticker` class with `symbol`, `name` and `sector`, instantiated for all five instruments.","Add a class attribute counting how many `Ticker` objects exist, and prove it differs from an instance attribute.","Add a `.is_tech` property returning a bool."],"Wed":["Write `MarketDataClient` wrapping a `requests.Session` with a retry adapter configured in `__init__`.","Give it a `.get(path, params)` method. Do not call a real API yet — Week 25 does that.","Explain in one line why the session is created once in `__init__` rather than per request."],"Thu":["Add `__repr__` and `__eq__` to `Ticker`. Two objects built from the same data must compare equal, and `repr()` must be something you would be happy to see in a log.","Write down one case where subclassing `Ticker` would be wrong, and one where inheritance is genuinely right. You will use the second in Week 27."],"Fri":["Add type hints and docstrings to every method in `src/`.","Add `src/__init__.py` exporting `WarehouseClient` and `Ticker`, so `from src import WarehouseClient` works.","Write `WarehouseClient.run_query()` and `.to_dataframe()` as **stubs that raise `NotImplementedError`** — Week 12 fills them in against real BigQuery."]},"dayfiles":{"Tue":{"act":"new","path":"src/ticker.py","note":"Goes in the existing `src/` folder from Week 7."},"Wed":{"act":"new","path":"src/warehouse_client.py","note":"The class you will still be importing in Week 32."},"Thu":{"act":"continue","path":"src/warehouse_client.py","note":"Add `__repr__` and `__eq__` here."},"Fri":{"act":"new","path":"src/__init__.py","note":"Turns `src/` into a real package. Add type hints across the files you already wrote."}}},{"n":12,"phase":2,"title":"Cloud Storage & BigQuery: Building the Lake","goal":"A working data lake layout in Cloud Storage with BigQuery querying it, driven from Python via your Week-11 class.","days":[["Mon","Cloud Storage concepts: buckets, objects, prefixes, storage classes, lifecycle rules. Location matters — pick a single region such as `europe-west2` (London) and stay in it, because a multi-region bucket and a single-region dataset will not query each other. Why prefix design *is* your partitioning strategy later."],["Tue","BigQuery first-run setup: create a dataset, and set its location to match your bucket. Work the official external-table walkthrough over a public dataset first. Note the difference between a **native** table (data lives in BigQuery) and an **external** table (data stays in Cloud Storage) — that choice is the whole shape of your lake."],["Wed","Create an external table over *your own* CSV in Cloud Storage. Schema auto-detection versus an explicit schema, column types, and what happens when the schema doesn't match the file."],["Thu","The catalog layer: how BigQuery stores table metadata, `INFORMATION_SCHEMA`, and what Knowledge Catalog (formerly Dataplex) adds on top for discovery and lineage. Auto-detection versus declaring a schema by hand."],["Fri","Drive BigQuery from Python with your `WarehouseClient`; return results as a DataFrame."]],"files":["sql/ddl/create_external_prices.sql","scripts/query_bigquery.py","NOTES.md"],"mini":{"n":6,"name":"`raw` layer live","desc":"Trades data in Cloud Storage under a proper `raw/` prefix, an BigQuery table over it, and a Python script querying it through `WarehouseClient`.","feeds":"Major Project 1's storage and query foundation.","mp":[1]},"resources":[{"day":null,"md":"Course: [Learn Google Cloud for Analytics in Under 2 Hours — Cloud Storage, BigQuery, Knowledge Catalog, Looker Studio](https://www.youtube.com/watch?v=oHte3qFa-oY)"},{"day":"Tue","md":"[Create Cloud Storage external tables — official docs](https://docs.cloud.google.com/bigquery/docs/external-data-cloud-storage)"},{"day":"Thu","md":"[Using schema auto-detection — official docs](https://docs.cloud.google.com/bigquery/docs/schema-detect)"},{"day":null,"md":"Reference: [Cloud Storage — documentation](https://docs.cloud.google.com/storage/docs)"},{"day":null,"md":"Practice: [Google Skills — free labs and courses](https://www.skills.google/)"},{"day":"Mon","md":"[Create a bucket — Cloud Storage quickstart](https://docs.cloud.google.com/storage/docs/creating-buckets)"}],"vidbase":"https://www.youtube.com/watch?v=nq2PhjznFzo","vidlabel":"Full BigQuery Tutorial","chapters":{"Mon":[[850,"Setting Up Your Google Cloud Account"],[925,"Organisations, Projects & Billing"]],"Tue":[[1041,"BigQuery Studio: Interface Tour"],[1187,"Datasets & Tables in BigQuery"]],"Wed":[[1244,"Connecting & Blending Data Sources"]]},"dod":"A correctly-named bucket with a sane prefix layout; an external table over your own Cloud Storage data; one query run from Python via your client class; region choice and the native-vs-external decision logged in `NOTES.md` and committed.","data":[{"title":"Cloud Storage layout — decide the prefixes before you upload","lang":"text","note":"Upload `data/prices.csv` under this layout. Keep the bucket and your BigQuery dataset in the **same region** (`europe-west2` for London) or queries will fail with a location mismatch. The prefix design is your partitioning strategy in Week 22.","code":"gs://ronald-equity-analytics-raw-dev/\n└── raw/\n    └── prices/\n        └── ingest_date=2026-07-29/\n            └── prices.csv"},{"title":"The external table over it","lang":"BigQuery SQL","note":"**Google Cloud specific.** An external table leaves the data in Cloud Storage and queries it in place — the direct equivalent of what other clouds call a lake table. `skip_leading_rows` is the one everyone forgets: without it your header becomes a data row and every numeric column silently becomes a string.","code":"CREATE SCHEMA IF NOT EXISTS market_elt\nOPTIONS (location = 'europe-west2');\n\nCREATE OR REPLACE EXTERNAL TABLE market_elt.raw_prices (\n  ticker      STRING,\n  price_date  DATE,\n  open        NUMERIC,\n  high        NUMERIC,\n  low         NUMERIC,\n  close       NUMERIC,\n  volume      INT64\n)\nOPTIONS (\n  format = 'CSV',\n  uris = ['gs://ronald-equity-analytics-raw-dev/raw/prices/ingest_date=2026-07-29/*.csv'],\n  skip_leading_rows = 1\n);","check":"`SELECT COUNT(*)` should return the same ~645 as your CSV. If it returns 646 you have not skipped the header. If the query errors with a location mismatch, your dataset and bucket are in different regions — that is the single most common first-day BigQuery error, and it is worth writing into `NOTES.md`."}],"exercises":{"Mon":["Write out your full bucket and prefix layout in `NOTES.md` before creating anything, and state which part will become your partition key in Week 22.","Set a lifecycle rule moving objects to Infrequent Access after 30 days, and note what that would save."],"Tue":["Set the BigQuery query-results location and record the exact Cloud Storage path in `NOTES.md`.","Run the official Getting Started walkthrough end to end against the Google Cloud sample dataset, before touching your own data.","Run `CREATE DATABASE market_elt_db` if your dropdown is empty."],"Wed":["Upload `prices.csv` and create an external table over it. **`SELECT COUNT(*)` must return 645.**","Deliberately break it: change one column type in the DDL to `int`, re-run, and record what BigQuery does — error, or silent nulls?","Fix it, and write the lesson in `NOTES.md` in one sentence."],"Thu":["Run a schema auto-detection over the same prefix and compare the table it infers against your hand-written DDL. List every difference.","Decide which one you are keeping and write down why. Crawler convenience versus explicit control is a real interview question."],"Fri":["Implement `WarehouseClient.run_query()` for real — submit, poll for completion, handle the failed state.","Implement `.to_dataframe()` and return the 645-row prices table.","Run one query from Python end to end and paste the row count into `NOTES.md`."]},"dayfiles":{"Mon":{"act":"new","path":"NOTES.md","note":"Repo root. Your running log of Google Cloud decisions — bucket names, prefixes, why."},"Tue":{"act":"continue","path":"NOTES.md","note":"Record the BigQuery query-results location you set. You will forget it otherwise."},"Wed":{"act":"new","path":"sql/ddl/create_external_prices.sql"},"Thu":{"act":"continue","path":"NOTES.md","note":"Write down crawler vs hand-declared table, and which you chose."},"Fri":{"act":"new","path":"scripts/query_bigquery.py","note":"Create the `scripts/` folder. This *imports* `src/warehouse_client.py` from Week 11 — do not rewrite the class."}}},{"n":13,"phase":2,"title":"Statistics & Maths for a Quant-Track Engineer","goal":"Correlation and one hypothesis test, plus real intuition for vectors and matrices. Conceptual first, notation second.","callout":{"title":"Scope note, stated honestly","body":"One week is the right amount of maths for a *Data Engineer* role — no junior DE interview asks you to derive anything. It is nowhere near enough for Quant Developer, which needs real linear algebra, probability, stochastic calculus and numerical methods. This week makes you literate enough to talk to quants and understand what a desk is doing. Build the rest from inside a markets-data job, with income."},"days":[["Mon","Mean, variance, standard deviation, distributions; skew and why financial returns aren't normally distributed."],["Tue","Correlation vs covariance; Pearson vs Spearman; a t-test; what p-values do and don't tell you."],["Wed","Vectors and matrices intuitively: linear combinations, what a matrix *does* to a vector. No proofs."],["Thu","A covariance matrix is just the pairwise covariances of your basket. Compute one in numpy and interpret it in plain English."],["Fri","Volatility as standard deviation of returns; annualising it; rolling volatility."]],"files":["notebooks/02_stats.ipynb"],"mini":{"n":7,"name":"`notebooks/02_stats.ipynb`","desc":"Compare two assets' return distributions, test whether the difference is significant, compute and interpret the covariance matrix.","feeds":"Feeds Major Project 1's correlation and volatility outputs.","mp":[1]},"resources":[{"day":null,"md":"Course: [Statistics Full Course for Data Science (SCALER)](https://www.youtube.com/watch?v=SxXsxCsZ59I)"},{"day":"Tue","md":"[StatQuest — p-values, clearly explained](https://www.youtube.com/watch?v=vemZtEM63GY)"},{"day":"Wed","md":"[3Blue1Brown — Essence of Linear Algebra (playlist)](https://www.youtube.com/playlist?list=PLZHQObOWTQDPD3MizzM2xVFitgF8hE_ab)"},{"day":null,"md":"Reference: [scipy.stats — official documentation](https://docs.scipy.org/doc/scipy/reference/stats.html)"},{"day":null,"md":"Practice: [Khan Academy — Statistics and Probability](https://www.khanacademy.org/math/statistics-probability)"}],"vidbase":"https://www.youtube.com/watch?v=SxXsxCsZ59I","vidlabel":"SCALER Statistics","chapters":{"Mon":[[2201,"Descriptive Statistics"],[3530,"Measures of Dispersion (Variation)"],[10821,"Distributions"]],"Tue":[[18412,"Hypothesis Testing"],[19850,"Types of Test: Z-Test and T-Test"]]},"dod":"Correlation and a t-test run correctly; a covariance matrix computed and explained in plain English; you can describe intuitively what a matrix does to a vector.","exercises":{"Mon":["Compute mean, variance and standard deviation of daily returns per ticker.","Compute skew and kurtosis for each. Write one line on what a fat tail means for a risk model that assumes normality.","Plot one ticker's return distribution against a normal curve with the same mean and standard deviation."],"Tue":["Compute the Pearson correlation matrix of daily returns. **5 × 5, with 10 unique off-diagonal pairs.**","Compute Spearman as well and note any pair where the two disagree meaningfully.","Run a two-sample t-test on AAPL versus JNJ daily returns. State the p-value and then state, in plain English, what it does **not** prove."],"Wed":["Take a 2×2 matrix and a vector, multiply by hand, then verify with numpy.","Write two sentences describing what that matrix *did* to the vector geometrically — rotate, stretch, flatten?"],"Thu":["Compute the covariance matrix of the five tickers' returns in numpy.","Explain each diagonal entry in one sentence, and the largest off-diagonal entry in one sentence.","Which two tickers move together most? Does that match their sectors?"],"Fri":["Compute annualised volatility per ticker. **All five land near 21–23%.** If yours are ~1.4%, you have forgotten to multiply by √252.","Compute a 21-day rolling volatility and plot it.","Write one line: why annualise at all?"]},"dayfiles":{"Mon":{"act":"new","path":"notebooks/02_stats.ipynb"},"Tue":{"act":"continue","path":"notebooks/02_stats.ipynb"},"Wed":{"act":"continue","path":"notebooks/02_stats.ipynb"},"Thu":{"act":"continue","path":"notebooks/02_stats.ipynb"},"Fri":{"act":"continue","path":"notebooks/02_stats.ipynb"}}},{"n":14,"phase":2,"title":"Visualisation Principles & BI (Looker Studio)","goal":"Charts that answer a question rather than decorate one, plus an interactive dashboard reading live from BigQuery.","days":[["Mon","Chart-type selection: comparison, distribution, relationship, composition, change-over-time. Decide on paper which fits three questions about your trades data before building. Then what makes a chart misleading — truncated axes, dual axes, cherry-picked ranges — and colourblind-safe palettes."],["Tue","matplotlib/seaborn properly: figure/axes objects, labels, titles, legends, annotation, saving programmatically. Title states the finding, not the variable."],["Wed","Looker Studio setup. The gotcha here is **not** permissions as it is on other clouds — Looker Studio inherits your Google identity, so it mostly just works. The real trap is **cost**: a dashboard on a live BigQuery connection re-queries on every filter change and every viewer refresh, and you pay each time. Connect a dataset, then compare a live connection against an extract, and understand which one is quietly expensive."],["Thu","Build charts: time-series, scorecards, a detail table. Calculated fields. Then interactivity: parameters, date-range controls, a ticker filter. Watch the bytes billed climb as you click."],["Fri","Layout, styling, publishing; screenshot into the repo. Produce two finished, labelled charts with written captions stating the finding."]],"files":["notebooks/03_eda.ipynb","docs/screenshots/dashboard.png"],"mini":{"n":8,"name":"EDA notebook + the dashboard","desc":"Exploratory pass (distribution per instrument, volume over time, price relationships) with a written paragraph of what you found, plus a Looker Studio dashboard with ticker selector and date range.","feeds":"Major Project 1's written-insight and serving layers.","mp":[1]},"resources":[{"day":null,"md":"Course: [Data Visualization using Matplotlib and Seaborn](https://www.youtube.com/watch?v=FN78JowwpSY)"},{"day":null,"md":"Reference: [seaborn — official documentation](https://seaborn.pydata.org/)"},{"day":null,"md":"Practice: [Kaggle — Data Visualization micro-course](https://www.kaggle.com/learn/data-visualization)"},{"day":"Mon","md":"[Matplotlib: choosing colormaps](https://matplotlib.org/stable/users/explain/colors/colormaps.html)"},{"day":"Wed","md":"[Analyse BigQuery data with Looker Studio — official docs](https://docs.cloud.google.com/bigquery/docs/visualize-looker-studio)"},{"day":null,"md":"Walkthrough: [Connecting BigQuery to Looker Studio](https://www.youtube.com/watch?v=WXpoq0A0UGk)"}],"dod":"Three chart types matched correctly to three questions; one misleading chart identified and explained; a colourblind-safe palette used; dashboard connected to BigQuery with working ticker and date filters; screenshot committed; you can state the live-connection versus extract cost trade-off.","vidbase":"https://www.youtube.com/watch?v=nq2PhjznFzo","vidlabel":"Full BigQuery Tutorial","chapters":{"Wed":[[3845,"Connecting BigQuery to Looker Studio"]],"Thu":[[3999,"Multi-Client Report with BigQuery"]]},"exercises":{"Mon":["Write down three questions about your data, and next to each the chart type that answers it and why the other four do not.","Build one deliberately misleading chart of your own data — truncate the y-axis — screenshot it, and write one line on what it falsely implies.","Pick a colourblind-safe palette and note its name."],"Tue":["Rebuild your best chart using explicit figure and axes objects rather than the pyplot state machine.","Retitle it so the title states the **finding**, not the variable. Not 'AAPL close over time' but what actually happened.","Save it programmatically to `docs/charts/` at 150 dpi."],"Wed":["Complete the Looker Studio permissions grant, then note in `NOTES.md` exactly which menu path fixed it — you will hit this again.","Connect a dataset to your BigQuery table.","Note the SPICE versus direct-query decision you made and the one-line reason."],"Thu":["Build a time-series chart, a KPI card and a detail table.","Add a calculated field for daily return.","Add a ticker filter and a date-range control, and confirm both actually change the numbers."],"Fri":["Lay out and publish the dashboard, then screenshot it into `docs/screenshots/dashboard.png`.","Produce two finished charts with written captions stating the finding in one sentence each."]},"dayfiles":{"Mon":{"act":"none","note":"Paper and pen — decide the three chart types before you open an editor."},"Tue":{"act":"new","path":"notebooks/03_eda.ipynb"},"Wed":{"act":"none","note":"Looker Studio console. Log the permissions steps in `NOTES.md` when you hit the gotcha."},"Thu":{"act":"none","note":"Looker Studio console."},"Fri":{"act":"new","path":"docs/screenshots/dashboard.png","note":"Create `docs/` and `docs/screenshots/`. Also finish `notebooks/03_eda.ipynb` today."}}},{"n":15,"phase":2,"title":"Market Data Domain Essentials","goal":"The four things that separate a markets data engineer from a generic one. Get these wrong and every downstream number is quietly incorrect — which is exactly what an interviewer at a capital-markets firm probes for.","callout":{"title":"Why this week exists","body":"Adverts for the roles you want say *\"experience working with time-series market data\"* and *\"market data platforms and financial data ingestion\"* as **essential**. That is not a tooling requirement — it is a domain requirement, and it is the one thing a generic portfolio cannot fake. Every topic below is a question you will be asked."},"days":[["Mon","**Corporate actions.** A 4-for-1 stock split does not change what the company is worth, but it divides the price by four overnight. If your history is unadjusted, that day shows a −75% return and every volatility, correlation and moving-average number downstream is wrong. Splits, dividends, and the difference between an **adjusted close** and a **raw close** — and why a real platform stores both."],["Tue","**Point-in-time correctness.** \"What did we know on 3 March?\" is the question regulators, risk teams and backtests all ask. Restated figures, late-arriving corrections and revised reference data mean today's table is not what yesterday's table said. Bitemporal modelling: `valid_from`/`valid_to` for when a fact was true, plus the load timestamp for when you learned it. **Then:** how this differs from an SCD Type 2 — and why suitability and regulatory reporting cannot be answered without it."],["Wed","**Instrument identifiers and reference data.** Tickers are not stable keys: they get reused, reassigned after delisting, and differ per venue. ISIN, SEDOL, FIGI, and why a real instrument master keys on something durable and maps tickers to it with a validity window. Survivorship bias — if your basket only contains companies that still exist, your backtest is flattering and wrong."],["Thu","**Market calendars and time.** Trading days are not calendar days: exchange holidays, half-days, and early closes. \"The last 30 rows\" and \"the last 30 trading days\" are different queries, and only one is right. Exchange timezones versus UTC storage — revisit Week 4, now with a market open and close in it."],["Fri","Build the adjuster and the as-of view. Apply a split to your seeded prices, produce an adjusted series, and prove the return series no longer has an artificial cliff. Then add `valid_from`/`valid_to` to `dim_instrument` and write the as-of query."]],"files":["sql/ddl/create_corporate_actions.sql","models/adjusted_prices.sql","models/dim_instrument_scd2.sql","docs/market_data_notes.md"],"mini":{"n":22,"name":"Corporate-actions adjuster + point-in-time view","desc":"A split- and dividend-adjusted price series that survives a corporate action without a false return spike, plus a bitemporal `dim_instrument` you can query as of any date.","feeds":"Feeds Projects 1, 2 and 3 — every returns figure in all three depends on it.","mp":[1,2,3]},"dod":"A corporate action applied and the adjusted series proven correct against the raw one; an as-of query returning what was true on a past date; you can explain survivorship bias and why a ticker is a poor primary key — in one sentence each.","resources":[{"day":"Mon","md":"Reference: [Investopedia — stock splits and price adjustment](https://www.investopedia.com/terms/s/stocksplit.asp)"},{"day":"Tue","md":"Reference: [Martin Fowler — bitemporal history](https://martinfowler.com/articles/bitemporal-history.html)"},{"day":"Wed","md":"Reference: [OpenFIGI — the open instrument identifier](https://www.openfigi.com/)"},{"day":"Thu","md":"Practice: [pandas market calendars](https://pypi.org/project/pandas-market-calendars/)"}],"exercises":{"Mon":["Take your seeded prices and apply a 4-for-1 split to one ticker halfway through the series. Compute daily returns **without** adjusting and find the false −75% day.","Now write the adjustment: multiply every pre-split price by the split ratio. Confirm the artificial return disappears and that **no other day's return changes**.","Write down in one line why you keep both raw and adjusted close rather than overwriting."],"Tue":["Add `valid_from` and `valid_to` to `dim_instrument`, then change a sector and write the as-of query that returns the sector **as it was** on a past date.","Explain the difference between when a fact *was true* and when you *learned it*, and why you need both columns to answer a regulator.","PDP: Write one paragraph on how you would prove to an auditor that a number in last month's report is still reproducible today."],"Wed":["Add an `isin` column to your instruments table and populate it for the five tickers. Research where a free ISIN lookup comes from and note the licensing catch.","Model the case where a ticker is reassigned to a different company: show why keying on ticker breaks, and what you key on instead.","Explain survivorship bias with reference to your own basket — all 15 of your tickers still exist, so what would that flatter?"],"Thu":["Build a trading-day calendar for 2026 including exchange holidays, then compute a 30-**trading**-day moving average and compare it to a 30-**row** one. **They will differ around every bank holiday.**","Store one bar with an exchange-local timestamp and convert it to UTC. Confirm the market open time is what you expect on both sides of a DST change."],"Fri":["Ship `models/adjusted_prices.sql` producing both raw and adjusted close, with a test asserting no single-day return exceeds ±30% after adjustment.","Ship the as-of view and query it for two different dates, showing different answers from the same table.","Write `docs/market_data_notes.md` — this is the document you will talk through when an interviewer asks what you know about market data."]},"dayfiles":{"Mon":{"act":"new","path":"sql/ddl/create_corporate_actions.sql","note":"A small table: ticker, action type, ex-date, ratio. Real platforms have a whole feed for this."},"Tue":{"act":"new","path":"models/dim_instrument_scd2.sql","note":"Supersedes the plain dimension from the modelling week — same idea, now with time travel."},"Wed":{"act":"continue","path":"models/dim_instrument_scd2.sql","note":"Add the durable identifier alongside the ticker."},"Thu":{"act":"new","path":"docs/market_data_notes.md","note":"Start the notes today; finish them Friday."},"Fri":{"act":"new","path":"models/adjusted_prices.sql","note":"The deliverable. Projects 1, 2 and 3 all read from this rather than from raw prices."}},"data":[{"title":"Corporate actions seed","lang":"BigQuery SQL","note":"Two real-shaped events against your existing basket: a 4-for-1 split and a cash dividend. Small on purpose — the point is the adjustment logic, not the volume.","code":"CREATE OR REPLACE TABLE market_practice.corporate_actions (\n  ticker       STRING  NOT NULL,\n  action_type  STRING  NOT NULL,   -- SPLIT | DIVIDEND\n  ex_date      DATE    NOT NULL,\n  ratio        NUMERIC,            -- 4.0 means 4-for-1; NULL for dividends\n  amount       NUMERIC,            -- cash per share; NULL for splits\n  PRIMARY KEY (ticker, action_type, ex_date) NOT ENFORCED\n);\n\nINSERT INTO market_practice.corporate_actions\n  (ticker, action_type, ex_date, ratio, amount)\nVALUES\n  ('AAPL', 'SPLIT',    DATE '2026-04-01', 4.0,  NULL),\n  ('MSFT', 'DIVIDEND', DATE '2026-03-12', NULL, 0.83),\n  ('JNJ',  'DIVIDEND', DATE '2026-05-27', NULL, 1.24);","check":"After adjustment, **AAPL's 2026-04-01 return should be an ordinary trading day**, not −75%. Every other AAPL day's return must be **unchanged** to at least 6 decimal places — if they all shifted, you have rebased rather than adjusted. The two dividends move the total-return series but not the price series; keeping those apart is the point."}]},{"n":16,"phase":2,"title":"MAJOR PROJECT 1: Equity Markets Analytics","major":1,"goal":"Public equities → Cloud Storage → BigQuery (via your client class) → pandas → Looker Studio → a written insight. Published on GitHub.","research_intro":"**Research before writing any code** — the step most plans hand-wave, and an interview answer in itself:","research":["Which free source gives daily OHLCV for ~10 US stocks without hitting a wall, and *why that one*? (Alpha Vantage's 25/day is tight; yfinance is unofficial and unguaranteed; Finnhub allows 60/min.)","What does one ticker's response actually contain — columns, grain, timezone?","What's your usage versus the free-tier limit? Headroom to re-run?","What breaks if a ticker returns nothing, and how will you handle it?","Does your chosen source return adjusted or unadjusted prices — and does its documentation actually say? Most do not, which is itself the finding.","How many of your 10 tickers had a split or dividend in your window? If none did, extend the window until one did."],"days":[["Mon","Acquisition research; decide and document the source; new repo `equity-markets-analytics`."],["Tue","Pull ~10 tickers; land raw files in Cloud Storage under `raw/`; define the BigQuery table."],["Wed","Analytical SQL via `WarehouseClient`: returns, volatility, correlations (Weeks 10 + 7 combined)."],["Thu","pandas notebook for deeper analysis; two clean, labelled charts (Week 14 standards)."],["Fri","Looker Studio dashboard; write the insight paragraph; README; commit."]],"tree_title":"Target repo tree — `equity-markets-analytics`","tree":"equity-markets-analytics/\n├── README.md\n├── requirements.txt\n├── .gitignore\n├── src/\n│   ├── __init__.py\n│   ├── warehouse_client.py\n│   ├── trade_utils.py\n│   └── ingest.py\n├── sql/\n│   ├── ddl/create_external_prices.sql\n│   └── analytics/returns_analysis.sql\n├── notebooks/\n│   ├── 01_cleaning.ipynb\n│   ├── 02_stats.ipynb\n│   └── 03_eda.ipynb\n└── docs/\n    ├── screenshots/dashboard.png\n    └── findings.md","spec":"Raw price files in a correctly-named bucket (`raw` layer) · an BigQuery table via the BigQuery catalog, queried through `WarehouseClient` · returns and volatility per stock · a correlation matrix across the basket · a Looker Studio dashboard · a one-paragraph written finding · returns computed from the **split-adjusted** series, with the unadjusted series kept alongside so you can show the difference · one written paragraph naming a corporate action in your window and what it would have done to a naive return calculation.","resources":[{"day":null,"md":"[Finnhub — API documentation](https://finnhub.io/docs/api) and [finnhub-python client](https://github.com/Finnhub-Stock-API/finnhub-python) — most generous free tier (60 calls/min)"},{"day":null,"md":"[Alpha Vantage — API documentation](https://www.alphavantage.co/documentation/) — 25/day, 5/min"},{"day":null,"md":"[yfinance — PyPI](https://pypi.org/project/yfinance/) — unofficial, no SLA"},{"day":null,"md":"[Python client for Cloud Storage — reference](https://docs.cloud.google.com/python/docs/reference/storage/latest)"},{"day":null,"md":"Walkthrough: [An end-to-end data pipeline with BigQuery, dbt and Airflow (Data with Marc, 1h)](https://www.youtube.com/watch?v=DzxtCxi4YaA) — different dataset, same shape. Watch once before you start, not while building."},{"day":"Fri","md":"[Make a README — what a good one contains](https://www.makeareadme.com/)"}],"dod":"Runs end-to-end and is reproducible; the dashboard lets you pick a ticker; the README explains it in 60 seconds; the written insight states something true and specific.","data":[{"title":"What one real API response actually contains","lang":"json","note":"Before you write ingestion code, pull **one** ticker by hand and look at it. This is Finnhub's daily candle shape — arrays, not objects, indexed positionally. Alpha Vantage returns a nested dict keyed by date instead. Knowing which you chose and why is the Week 16 research question.","code":"{\n  \"c\": [225.31, 227.02, 224.88],      // close\n  \"h\": [226.90, 228.44, 226.10],      // high\n  \"l\": [223.05, 224.71, 223.02],      // low\n  \"o\": [224.10, 225.66, 225.90],      // open\n  \"s\": \"ok\",                          // status - \"no_data\" when empty\n  \"t\": [1767225600, 1767312000, 1767398400],   // UNIX seconds, UTC\n  \"v\": [42817300, 38290100, 51004200]          // volume\n}","check":"Three things to write down before coding: the timestamps are **UNIX seconds in UTC**, so a naive `to_datetime` gives you 1970; `\"s\": \"no_data\"` is how an empty ticker fails, not an HTTP error, so `response.ok` is not enough; and the arrays are **parallel** — index 0 of `c` matches index 0 of `t`. Landing this untouched in `raw/` is what lets you re-parse without re-calling the API."}],"exercises":{"Mon":["Answer all four research questions in writing in the README **before** any code.","Register for your chosen API and confirm the key works with one manual call.","Create the repo with `.gitignore`, `README.md` and `requirements.txt` committed first."],"Tue":["Pull all 10 tickers and land the **raw, unmodified** responses in `raw/`.","Confirm your usage against the free-tier limit and write the number in the README.","Define the BigQuery table over the raw layer and confirm the row count matches what you pulled."],"Wed":["Run returns, volatility and the correlation matrix through `WarehouseClient` — Week 10 SQL against Week 16 real data.","Confirm the Week-10 queries needed **no** structural change. If they did, note what and why.","Save each query into `sql/analytics/`."],"Thu":["Deeper analysis in a notebook: which pair is most correlated, which is most volatile, and did anything break the pattern?","Produce two clean labelled charts to Week 14 standards."],"Fri":["Build the Looker Studio dashboard with a working ticker selector.","Write `docs/findings.md` — one paragraph stating something **specific and true** about real market data. Not 'prices varied'.","Rewrite the README so a stranger understands the project in 60 seconds. Commit and pin."]},"dayfiles":{"Mon":{"act":"new","path":"equity-markets-analytics/","note":"New repo, kebab-case. Commit `.gitignore`, `README.md` and `requirements.txt` before any code."},"Tue":{"act":"reuse","path":"src/warehouse_client.py · src/trade_utils.py","note":"Copy in from Weeks 11 and 7. New today: `src/ingest.py` and `sql/ddl/create_external_prices.sql`."},"Wed":{"act":"reuse","path":"sql/analytics/returns_analysis.sql","note":"Carried over from Week 10, adapted to the real BigQuery table."},"Thu":{"act":"reuse","path":"notebooks/01_cleaning.ipynb · 02_stats.ipynb · 03_eda.ipynb","note":"Carried over from Weeks 9, 13 and 14."},"Fri":{"act":"new","path":"docs/findings.md","note":"Plus `docs/screenshots/dashboard.png` and a rewritten `README.md`."}},"callout":{"title":"Free-tier limits — decide before you code","body":"**Finnhub** 60 calls/min, no card, up to a year of history per call — the most generous. **Alpha Vantage** 25/day, 5/min. **Twelve Data** ~800/day. **`yfinance`** has no official API at all; it reverse-engineers Yahoo's internal endpoints, so no key, no SLA, no guarantee it works tomorrow. Fine for learning, never for something you call production. Pick one, write down why, and record your usage against the limit — that decision is itself an interview answer."},"build":["**Scaffold before code.** Repo, `.gitignore`, `README` skeleton, `requirements.txt`, and a `make run` or shell script that will eventually run the whole thing. If you cannot describe the end state in the README on day one, you do not yet understand the project.","**Ingest, raw and untouched.** One script, one job: call the API, write the response to Cloud Storage exactly as received. No parsing, no cleaning, no renaming. The raw layer is your audit trail and your re-parse insurance.","**Catalogue.** External table over the raw layer, then a typed staging view. This is where the string-to-NUMERIC and UNIX-to-timestamp conversions happen — once, in one place.","**Adjust.** Apply Week 15's corporate-actions logic. Everything downstream reads the adjusted series.","**Analyse.** Returns, volatility, correlation — your Week 10 SQL, now against real data.","**Serve.** Looker Studio on the marts, never on raw.","**Write.** The findings paragraph and the README. Budget a full half-day; this is the part that gets read."],"accept":["A fresh `git clone` plus documented setup steps produces the same numbers. **Test this by actually doing it in a clean folder.**","The raw layer is byte-identical to what the API returned — you can re-derive every downstream table from it and nothing else.","Running the ingestion twice does not duplicate a single row.","Returns are computed from the **adjusted** series, and you can show the unadjusted comparison.","The dashboard's ticker selector changes every chart on the page, not just one.","`README.md` gets a stranger to understanding in 60 seconds and contains at least one number.","The findings paragraph states something **specific, true and checkable** — not 'prices were volatile'."],"failure":["**A ticker returns nothing.** Delisted, mistyped, or outside the free tier. Decide: skip and log, or fail the run? Write down which and why.","**You hit the rate limit mid-run.** What state is the raw layer in, and can you resume without duplicating?","**The API returns 200 with an error body.** Status codes are not enough — check the payload shape.","**A corporate action lands inside your window.** If your returns spike ±50% on one day, this is why.","**Timestamps arrive in UNIX seconds, UTC.** A naive parse gives you 1970 or a one-hour drift."],"rubric":["Would a reviewer find hard-coded credentials, paths, or your project ID anywhere? *Search the repo before you push.*","Is there a notebook doing something a module should do? Anything imported twice belongs in `src/`.","Does the README explain **why** you chose your data source, or only that you did?","Are the charts titled with the finding, or with the variable name?","Could you delete the whole dataset and rebuild it from the raw layer in one command? If not, the raw layer is decorative."]},{"n":17,"phase":2,"title":"Project 1 Polish + Start Applying","goal":"Publish Project 1 properly and get applications in flight. Applications convert over weeks — starting now means offers land while you're still building.","days":[["Mon","Clean the repo; strong README: problem, stack, architecture sketch, findings, screenshots."],["Tue","Record a 2-minute walkthrough (Loom or screen capture)."],["Wed","Pin the repo; tidy your GitHub profile; profile README."],["Thu","Draft CV bullets in tool + action + result form. Frame professional GCP/BigQuery/Dataform work explicitly as **multi-cloud strength** — two hyperscalers reads as more senior than one."],["Fri","Apply to 5–10 roles: Analytics Engineer and unprefixed Data Engineer as the target, Junior DE as the floor. Set up a tracking sheet: company, role, date, stage, notes."]],"files":["README.md  (rewritten)","docs/walkthrough.md","application tracker (outside the repo)"],"resources":[{"day":null,"md":"[How to Create a Professional GitHub README Profile](https://www.youtube.com/watch?v=rCt9DatF63I)"},{"day":null,"md":"[Make a README — README guidance](https://www.makeareadme.com/)"},{"day":null,"md":"[Loom — free screen recording](https://www.loom.com/)"}],"dod":"README with screenshots live; repo pinned; walkthrough recorded; first applications sent and tracked.","callout":{"title":"From here on","body":"Applications run in parallel every week. Treat the remaining weeks as depth-building while they're in flight, not a prerequisite to applying."},"vidbase":"https://www.youtube.com/watch?v=rCt9DatF63I","vidlabel":"GitHub profile README","chapters":{"Wed":[[45,"How to create a GitHub Readme Profile"],[387,"Adding GIFs and images"]]},"exercises":{"Mon":["Rewrite the README against a checklist: problem, stack, architecture sketch, how to run, findings, screenshots.","Delete every dead file, commented-out block and stray notebook checkpoint.","Clone the repo into a fresh folder and follow your own README. Anything that fails is a README bug."],"Tue":["Record a 2-minute walkthrough: problem, architecture, one interesting decision, the result. Rehearse once, record once.","Link the recording from the README, and check the link works in an incognito window — an unlisted video nobody can open is worse than none."],"Wed":["Pin the repo on your profile.","Create the profile README repo and write three sentences on what you build.","Audit your other public repos — archive or delete anything that undersells you."],"Thu":["Write six CV bullets in tool + action + result form. Every one needs a number.","Write one bullet framing GCP/BigQuery/Dataform as multi-cloud strength alongside Google Cloud.","Cut any bullet without a measurable outcome."],"Fri":["Apply to 5–10 roles: Analytics Engineer and unprefixed Data Engineer as target, Junior DE as floor.","Build the tracker: company, role, date, stage, source, notes.","Note which two job adverts asked for something you cannot yet do."]},"dayfiles":{"Mon":{"act":"continue","path":"README.md","note":"Full rewrite, not a tidy-up."},"Tue":{"act":"new","path":"docs/walkthrough.md","note":"Holds the link to the recording; the video itself lives on Loom, not in the repo."},"Wed":{"act":"new","path":"<your-username>/<your-username>","note":"A separate repo named after your username — that is what GitHub renders as your profile README."},"Thu":{"act":"new","path":"CV (outside the repo)","note":"Never commit your CV — it has your address and phone number in it."},"Fri":{"act":"new","path":"Application tracker (outside the repo)","note":"Spreadsheet: company, role, date, stage, notes."}}},{"n":18,"phase":3,"title":"Data Modelling & Normalisation","goal":"A 3NF relational schema and ER diagram for a trading dataset.","days":[["Tue","Entities, attributes, relationships; primary and foreign keys; cardinality. **Then:** 1NF, 2NF, 3NF — the intent behind each, not the definitions."],["Wed","Design tables for trades / instruments / prices / venues; identify PKs and FKs."],["Thu","Draw the ERD; normalise to 3NF and write down why each split exists."],["Fri","Where denormalisation is correct on purpose — the bridge into next week."]],"files":["models/schema.sql","docs/erd.png"],"mini":{"n":9,"name":"`models/schema.sql` + ERD image","desc":"","feeds":"Feeds Major Project 2's warehouse design.","mp":[2]},"resources":[{"day":null,"md":"Course: [Comparing 3 Types of Data Modeling: Normalized vs Star Schema vs Data Vault](https://www.youtube.com/watch?v=qXXNhLv986I)"},{"day":"Thu","md":"[dbdiagram.io — free ERD tool](https://dbdiagram.io/)"},{"day":null,"md":"Practice: [SQLBolt — schema design & SQL exercises](https://sqlbolt.com/)"},{"day":null,"md":"Practice: [dbdiagram.io — free ERD tool, exports PNG](https://dbdiagram.io/)"}],"dod":"A 3NF schema designed; an ER diagram drawn; DDL and ERD committed with written justification.","vidbase":"https://www.youtube.com/watch?v=GFQaEYEc8_8","vidlabel":"Decomplexify — Normalisation","chapters":{"Tue":[[235,"First Normal Form (1NF)"],[624,"Second Normal Form (2NF)"],[968,"Third Normal Form (3NF)"]],"Wed":[[1229,"Fourth Normal Form (4NF)"]],"Fri":[[1601,"Summary and review"]]},"data":[{"title":"The unnormalised table to fix","lang":"BigQuery SQL","note":"One wide table with every normalisation problem in it: repeating groups, a partial dependency on part of the key, and a transitive dependency. Load it, then take it apart. **Do not look up the answer — the point is finding the violations yourself.**","code":"CREATE OR REPLACE TABLE market_practice.trades_wide AS\nSELECT * FROM UNNEST([\n  STRUCT('T1001' AS trade_ref, 'AAPL' AS ticker, 'Apple Inc.' AS company,\n         'Technology' AS sector, 'XNAS' AS venue_code, 'Nasdaq' AS venue_name,\n         'US' AS venue_country, DATE '2026-01-08' AS trade_date,\n         NUMERIC '224.96' AS price, 1000 AS volume, 'BUY' AS side,\n         'GBP,USD' AS settle_ccys),\n  STRUCT('T1002', 'AAPL', 'Apple Inc.', 'Technology', 'XNAS', 'Nasdaq', 'US',\n         DATE '2026-01-15', NUMERIC '230.02', 2500, 'SELL', 'USD'),\n  STRUCT('T1003', 'MSFT', 'Microsoft Corp.', 'Technology', 'XNAS', 'Nasdaq', 'US',\n         DATE '2026-01-02', NUMERIC '430.23', 2500, 'BUY', 'USD,EUR'),\n  STRUCT('T1004', 'JPM', 'JPMorgan Chase & Co.', 'Financials', 'XNYS',\n         'New York Stock Exchange', 'US', DATE '2026-01-08',\n         NUMERIC '218.81', 1500, 'SELL', 'USD'),\n  STRUCT('T1005', 'XOM', 'Exxon Mobil Corp.', 'Energy', 'XNYS',\n         'New York Stock Exchange', 'US', DATE '2026-01-19',\n         NUMERIC '113.61', 1000, 'SELL', 'GBP,USD')\n]);","check":"There are **three distinct violations** in this table, one for each normal form. Two are visible in a single row; one only appears when you compare rows. Name each, name which form it breaks, and name the table you would split it into. If you find fewer than three, you have not looked at `settle_ccys` closely enough."}],"exercises":{"Tue":["List every entity in a trading dataset and its attributes. Mark the primary key of each.","Identify the cardinality of each relationship and write it as '1 instrument has many trades'.","Write an unnormalised wide trades table on paper, then normalise it step by step, stating which rule each split satisfies.","Find the transitive dependency: `sector` sitting on `trades` is the one to hunt for.","Load `trades_wide` and find all three normalisation violations before watching the video. Write each one down as a sentence: *'X depends on Y, which is not the whole key.'*"],"Wed":["Write the DDL for all four tables with PK and FK constraints declared.","For each foreign key, state what should happen on delete and why."],"Thu":["Draw the ERD in dbdiagram.io and export to `docs/erd.png`.","Write one sentence per table explaining why it exists separately rather than being folded into another."],"Fri":["Name one query that is genuinely painful against this 3NF schema.","Write two sentences on which denormalisation would fix it and what you would give up. That trade-off is Week 19.","Take one query that is genuinely harder against your 3NF schema than against the wide table, write both versions, and time them. That trade-off is what Week 19 resolves with a star schema."]},"dayfiles":{"Tue":{"act":"none","note":"Still paper — normalise before you type."},"Wed":{"act":"new","path":"models/schema.sql","note":"Create the `models/` folder."},"Thu":{"act":"new","path":"docs/erd.png","note":"Export from dbdiagram.io into the existing `docs/` folder."},"Fri":{"act":"continue","path":"models/schema.sql","note":"Add the written justification as SQL comments."}}},{"n":19,"phase":3,"title":"Dimensional Modelling (Kimball) + Snowflake Awareness","goal":"A star schema for market data, built as real BigQuery tables, plus enough Snowflake literacy to hold an interview conversation.","days":[["Tue","Facts vs dimensions; grain — declaring it explicitly and why it's the first decision; star vs snowflake schema. **Then:** Design `fact_prices` with `dim_date` and `dim_instrument`. Surrogate vs natural keys."],["Wed","Slowly changing dimensions: Type 1 vs Type 2 vs Type 3, and when each is right (a sector reclassification is a real SCD case)."],["Thu","Implement the schema as BigQuery tables over Cloud Storage; load sample data."],["Fri","A query joining fact to both dimensions. Then: what Snowflake is, why it is cloud-agnostic, and why it appears across banks, hedge funds and fintech regardless of which hyperscaler they run on. You will actually run against it in Week 21."]],"files":["models/fact_prices.sql","models/dim_date.sql","models/dim_instrument.sql"],"mini":{"n":10,"name":"Star schema live in BigQuery","desc":"","feeds":"Major Project 2's marts layer, prototyped.","mp":[2]},"resources":[{"day":null,"md":"Course: [Dimensional Data Modeling Tutorial — Star Schema case study](https://www.youtube.com/watch?v=7HyGM3Iw0Kc)"},{"day":null,"md":"Reference: [Kimball Group — dimensional modelling techniques](https://www.kimballgroup.com/data-warehouse-business-intelligence-resources/kimball-techniques/dimensional-modeling-techniques/)"},{"day":null,"md":"Applied: [Building a Kimball dimensional model with dbt](https://docs.getdbt.com/blog/kimball-dimensional-model)"},{"day":"Fri","md":"[Snowflake Quickstarts — free guided labs](https://quickstarts.snowflake.com/)"}],"dod":"A star schema designed and built as BigQuery tables; a fact↔dim join query works; you can explain grain, and explain what Snowflake is and why a bank might pick it over the native warehouse.","vidbase":"https://www.youtube.com/watch?v=7HyGM3Iw0Kc","vidlabel":"Star schema case study","chapters":{"Tue":[[188,"What are Facts"],[411,"Dimensions"],[525,"Star Schema"],[848,"Datestamp"]]},"data":[{"title":"dim_date — generate it, never type it","lang":"BigQuery SQL","note":"A date dimension is the one table you always generate. BigQuery gives you `GENERATE_DATE_ARRAY` for exactly this, which is tidier than the equivalent on most warehouses.","code":"CREATE OR REPLACE TABLE market_elt.dim_date AS\nSELECT\n  CAST(FORMAT_DATE('%Y%m%d', d) AS INT64)  AS date_key,\n  d                                        AS full_date,\n  EXTRACT(YEAR    FROM d)                  AS year,\n  EXTRACT(QUARTER FROM d)                  AS quarter,\n  EXTRACT(MONTH   FROM d)                  AS month,\n  EXTRACT(DAY     FROM d)                  AS day_of_month,\n  FORMAT_DATE('%A', d)                     AS day_name,\n  EXTRACT(DAYOFWEEK FROM d) IN (1, 7)      AS is_weekend,\n  d = LAST_DAY(d)                          AS is_month_end\nFROM UNNEST(\n  GENERATE_DATE_ARRAY(DATE '2025-01-01', DATE '2027-12-31', INTERVAL 1 DAY)\n) AS d;","check":"**1,095** rows for 2025–2027. `is_weekend` should be true for roughly 2/7 of them (≈313). Note BigQuery's `DAYOFWEEK` is **1 = Sunday**, not Monday — get that wrong and your weekend flag is silently off by a day, which is exactly the sort of right-shape-wrong-numbers error nobody's tests catch."}],"exercises":{"Tue":["Write the grain of `fact_prices` as one sentence beginning 'One row per…' before designing anything.","List which columns are facts and which are dimensions, and justify any borderline call.","Draw both a star and a snowflake version and state which you are building and why.","Write the DDL for `fact_prices`, `dim_date` and `dim_instrument`.","Give `dim_instrument` a surrogate key and state in one line why the ticker is not good enough as a primary key."],"Wed":["A sector reclassification arrives — NVDA moves sector. Write what `dim_instrument` looks like after Type 1, then Type 2, then Type 3.","Pick one for your build and write the one-line justification.","State which of the three loses history."],"Thu":["Build all three as real BigQuery tables and load the prices data.","Generate `dim_date`. **Expect 1,095 rows for 2025–2027.**","Confirm every `fact_prices` row joins to a `dim_date` row. Orphans mean your date key is wrong."],"Fri":["Write the fact-to-both-dimensions join returning ticker, sector, month name and average close.","Write two sentences defining Snowflake and why it turns up at banks regardless of their cloud. You will be asked this."]},"dayfiles":{"Tue":{"act":"new","path":"models/fact_prices.sql · models/dim_date.sql · models/dim_instrument.sql","note":"Three new files in the existing `models/` folder."},"Wed":{"act":"continue","path":"models/dim_instrument.sql","note":"Sector reclassification is your SCD Type 2 worked example."},"Thu":{"act":"continue","path":"models/","note":"Run the DDL against BigQuery — no new files, but commit any fixes."},"Fri":{"act":"continue","path":"sql/analytics/","note":"Add the fact-to-dimension join query alongside your existing analytics queries."}}},{"n":20,"phase":3,"title":"ETL vs ELT & Pipeline Architecture","goal":"A written architecture document for a batch market-data pipeline — the artefact proving you think before you build.","days":[["Tue","ETL vs ELT and why cloud warehouses shifted the default; the medallion/raw-staging-curated pattern. **Then:** Idempotency — the single most important pipeline property; incremental vs full loads; backfills."],["Thu","Batch vs streaming; scheduling; late-arriving data; watermarks. **Then:** Failure handling: retries, dead-letter paths, partial-failure semantics, what \"at least once\" costs you."],["Fri","Sketch the pipeline (source → Cloud Storage → BigQuery → dbt → Looker Studio) and write the design doc: components, schedule, failure modes, recovery."]],"files":["docs/architecture.md","docs/architecture.png"],"mini":{"n":11,"name":"`docs/architecture.md` with a diagram","desc":"","feeds":"Major Project 2's design doc, written before the build.","mp":[2]},"resources":[{"day":null,"md":"Course: [Fundamentals of Data Engineering Masterclass (Darshil Parmar)](https://www.youtube.com/watch?v=hf2go3E2m8g)"},{"day":null,"md":"Reference: [Cloud Architecture Center](https://docs.cloud.google.com/architecture)"},{"day":null,"md":"Practice: [Google Cloud Architecture Framework](https://docs.cloud.google.com/architecture/framework)"},{"day":null,"md":"Diagramming: [diagrams.net](https://app.diagrams.net/)"}],"vidbase":"https://www.youtube.com/watch?v=hf2go3E2m8g","vidlabel":"DE Fundamentals Masterclass","chapters":{"Fri":[[3916,"Data Architecture 101"],[9152,"Modern Data Architecture"]],"Tue":[[3446,"ETL (Extract Transform Load)"],[6990,"Data Lake vs Data Warehouse"]]},"dod":"Design doc written and committed; it explicitly covers idempotency and failure handling; sanity-checked against real job-ad expectations.","exercises":{"Tue":["Write a paragraph on why cloud warehouses flipped the default from ETL to ELT.","Map your own Weeks 12–19 work onto raw / staging / curated and note which layer each artefact belongs to.","Define idempotency in one sentence without using the word 'idempotent'.","Take your Week-16 ingestion and identify precisely what would duplicate if you ran it twice today.","Write down the key-naming rule that would prevent it."],"Thu":["Draw the same pipeline twice — batch and streaming — and list what changes.","Define a watermark in one sentence, and state what your pipeline should do with a price that arrives three days late.","PDP: Design for **schema drift**: write down what your pipeline should do when the source adds a column, renames one, or changes a type. Decide per case — ignore, fail loudly, or quarantine — and say why.","PDP: Write the same design in **plain English for a non-technical reader**, in under 150 words. If you cannot explain the failure modes without jargon, you cannot flag a risk to a stakeholder either.","For each pipeline stage, write the failure mode and the recovery action.","Write two sentences on what 'at least once' delivery costs you downstream, and which stage absorbs that cost."],"Fri":["Draw the architecture diagram and export to `docs/architecture.png`.","Write `docs/architecture.md` covering components, schedule, failure modes and recovery.","Check it against two real job adverts and note anything they expect that your design does not mention."]},"dayfiles":{"Tue":{"act":"none"},"Thu":{"act":"none","note":"Take rough notes; Friday is where they become the document."},"Fri":{"act":"new","path":"docs/architecture.md · docs/architecture.png","note":"Both in the existing `docs/` folder. Week 26 builds straight from this."}}},{"n":21,"phase":3,"title":"dbt on BigQuery","goal":"A dbt project with models, tests and docs — the industry standard for warehouse transforms, and the layer that makes your work portable between warehouses.","days":[["Mon","dbt Fundamentals; install dbt Core and the `dbt-bigquery` adapter. `profiles.yml` needs `project`, `dataset`, `location` and an auth method — use `oauth` locally via `gcloud auth application-default login` rather than downloading a service-account key. `dbt init` scaffolds it into `~/.dbt/`."],["Tue","Project structure: sources, staging models, marts. Build `stg_prices` from raw."],["Wed","Mart models on your Week-19 star schema. Materialisations: view vs table vs incremental, and the cost implications."],["Thu","Tests: `not_null`, `unique`, `accepted_values`, `relationships`; singular tests for business rules. `ref()` and `source()` and why they build the DAG for you."],["Fri","Generate docs; add model and column descriptions; explore the lineage graph. Then **prove portability**: sign up for a Snowflake trial, add a second target to `profiles.yml`, and run the same models against it. Note every change you had to make — it should be a very short list, and that list is your interview answer about warehouse portability."]],"files":["dbt/dbt_project.yml","dbt/models/staging/stg_prices.sql","dbt/models/marts/fct_daily_prices.sql","dbt/models/marts/dim_instrument.sql","dbt/models/schema.yml"],"mini":{"n":12,"name":"The `dbt/` project","desc":"Staging + marts + passing tests + generated docs.","feeds":"Major Project 2's transformation layer.","mp":[2]},"resources":[{"day":"Mon","md":"[BigQuery configurations — dbt Developer Hub (profiles.yml reference)](https://docs.getdbt.com/reference/resource-configs/bigquery-configs)"},{"day":null,"md":"Course: [dbt Learn — free interactive dbt Fundamentals](https://learn.getdbt.com/)"},{"day":null,"md":"Video: [dbt Crash Course for Beginners (dbt Core)](https://www.youtube.com/watch?v=toSAAgLUHuk)"},{"day":null,"md":"Reference: [dbt tests — official docs](https://docs.getdbt.com/docs/build/data-tests)"},{"day":null,"md":"Structure: [dbt — how we structure our projects](https://docs.getdbt.com/best-practices/how-we-structure/1-guide-overview)"},{"day":"Fri","md":"Portability: [Snowflake setup for dbt](https://docs.getdbt.com/docs/local/connect-data-platform/snowflake-setup) and the [Snowflake free trial](https://www.snowflake.com/en/snowflake-trial/) — 30 days, $400 credits, no card"}],"dod":"dbt connected to BigQuery; staging and mart models built; tests pass; docs generated; **the same project runs against a second warehouse** with the differences written down.","vidbase":"https://www.youtube.com/watch?v=toSAAgLUHuk","vidlabel":"dbt Core crash course","chapters":{"Mon":[[145,"Create dbt project & virtual environment"],[224,"Install dbt Core CLI & database adapter"],[342,"Set up database connection"]],"Tue":[[996,"Build dbt models"]],"Wed":[[1206,"Configure model materialization"],[1576,"Build models on top of other models"]],"Thu":[[1843,"Testing"]],"Fri":[[2029,"Generate documentation"]]},"data":[{"title":"Point dbt at what already exists","lang":"yaml","note":"A `sources` block, not a seed. Your raw table is already in Knowledge Catalog from Week 12 — dbt should read it, not recreate it. `source()` is what builds the lineage graph Friday asks you to explore.","code":"# dbt/models/staging/_sources.yml\nversion: 2\n\nsources:\n  - name: raw\n    database: your BigQuery project\n    schema: market_elt_db\n    tables:\n      - name: raw_prices\n        description: \"Daily OHLCV landed from the markets API, untouched.\"\n        columns:\n          - name: ticker\n            description: \"Instrument symbol, e.g. AAPL.\"\n          - name: price_date\n            description: \"Trading day. One row per ticker per day.\"\n        freshness:\n          warn_after: {count: 36, period: hour}\n          error_after: {count: 72, period: hour}\n        loaded_at_field: price_date","check":"`dbt run` then `dbt test` should both pass before you write a single mart model. Your `stg_prices` must be **unique on (ticker, price_date)** — add that test on Thursday and it should pass first time on clean data. If it fails, your raw layer has duplicates, which is Week 25's idempotency lesson arriving early."}],"exercises":{"Mon":["Install dbt Core plus `dbt-athena` and get `dbt debug` passing.","Write `profiles.yml` outside the repo, and commit a stripped `profiles.yml.example` inside it.","Confirm `~/.dbt/profiles.yml` is **not** picked up by git."],"Tue":["Declare your raw table as a dbt source.","Build `stg_prices`: typed, renamed to your conventions, one row per ticker per day.","Run `dbt run` and confirm the staging row count matches raw."],"Wed":["Build `fct_daily_prices` with close, daily return and 7-day moving average — your Week-10 SQL, now a dbt model.","Build `dim_instrument` as a mart model, sourcing ticker, name and sector.","Materialise one as a view and one as a table, then write down the cost implication of each."],"Thu":["Add `not_null` and `unique` tests. The unique test must be on the **combination** of ticker and date.","Add a singular test asserting `high >= low` — this is the one that catches Week 30's bad load.","Break a model deliberately and confirm `dbt test` fails. A suite that has never failed is unproven."],"Fri":["Add descriptions to every model and column, then run `dbt docs generate` and explore the lineage graph.","Write down exactly what would change to point this project at Snowflake instead. **It should be a short list.**"]},"dayfiles":{"Mon":{"act":"new","path":"dbt/  (scaffolded by dbt init)","note":"Important: `dbt init` writes `profiles.yml` to `~/.dbt/`, **outside** your repo. Commit a `dbt/profiles.yml.example` with the secrets stripped instead."},"Tue":{"act":"new","path":"dbt/models/staging/stg_prices.sql"},"Wed":{"act":"new","path":"dbt/models/marts/fct_daily_prices.sql · dbt/models/marts/dim_instrument.sql","note":"These supersede the hand-written Week 19 DDL — same star schema, now built by dbt."},"Thu":{"act":"new","path":"dbt/models/schema.yml","note":"Where your tests live."},"Fri":{"act":"continue","path":"dbt/models/schema.yml","note":"Add model and column descriptions — they become the generated docs."}}},{"n":22,"phase":3,"title":"BigQuery Performance and Cost","goal":"A partitioned, clustered dataset with a measured before/after in bytes billed — what senior engineers actually watch.","days":[["Tue","How BigQuery actually charges: on-demand bills per **byte processed**, not per row or per second, and `SELECT *` is the most expensive thing you can type. Storage is billed separately and drops after 90 days of no edits. Capacity (slot-based) pricing and when it beats on-demand. **Then:** Partitioning: by ingestion time, by a date column, or by an integer range. Then **clustering** — up to four columns, and why it is not the same thing as partitioning. Require a partition filter so nobody can accidentally scan the whole table."],["Wed","Rebuild the prices table partitioned by `price_date` and clustered by `ticker`."],["Thu","Measure bytes billed before and after on representative queries — the dry-run flag gives you the estimate without paying for it. This is money, not theory. Then the small-partition problem: too many tiny partitions costs you metadata overhead and hits the partition limit."],["Fri","Write the cost note. Then two things worth knowing exist: **Lakehouse** *(formerly BigLake)* with managed Apache Iceberg tables is now GA, which is how GCP does open table formats — and it is the answer if an interviewer asks about Iceberg or Delta. And Snowflake solves the same problem differently again, with automatic micro-partitions and clustering keys and no partition column for you to choose."]],"files":["docs/cost_analysis.md","sql/ddl/create_partitioned_prices.sql"],"mini":{"n":13,"name":"`docs/cost_analysis.md`","desc":"Before/after bytes-scanned table with the query set and the percentage saved.","feeds":"Strong interview material; part of Major Project 2's documentation.","mp":[2]},"resources":[{"day":null,"md":"Course: [The Parquet Format and Performance Optimization Opportunities (Databricks)](https://www.youtube.com/watch?v=1j8SdS7s_NY)"},{"day":"Tue/Thu","md":"[Optimising query performance — official docs](https://docs.cloud.google.com/bigquery/docs/best-practices-performance-overview)"},{"day":null,"md":"Reference: [Partitioned tables — official docs](https://docs.cloud.google.com/bigquery/docs/partitioned-tables)"},{"day":null,"md":"Reference: [Apache Parquet — file format documentation](https://parquet.apache.org/docs/)"},{"day":"Wed","md":"[Clustered tables — official docs](https://docs.cloud.google.com/bigquery/docs/clustered-tables)"},{"day":"Thu","md":"[Estimate and control costs — BigQuery](https://docs.cloud.google.com/bigquery/docs/best-practices-costs)"}],"vidbase":"https://www.youtube.com/watch?v=1j8SdS7s_NY","vidlabel":"Databricks Parquet","chapters":{"Tue":[[494,"Row-wise vs Columnar"],[704,"Parquet: data organization"],[779,"Parquet: encoding schemes"],[1453,"Optimization: partitioning"],[1527,"Optimization: avoid many small files"],[1655,"Optimization: avoid few huge files"]],"Thu":[[1220,"Optimization: predicate pushdown"]]},"dod":"A table rebuilt as partitioned and clustered; bytes billed measured before and after with a dry run; a short written cost analysis in pounds, not just bytes; you can compare BigQuery partitioning to Snowflake micro-partitions.","data":[{"title":"Make the dataset big enough to measure","lang":"python","note":"645 rows will not show a difference — BigQuery bills a **10 MB minimum per table** touched. Inflate to something measurable *before* you benchmark, or your before/after table will show nothing.","code":"# scripts/inflate_prices.py  -- makes a dataset large enough to benchmark\nimport pandas as pd, numpy as np\n\ndf = pd.read_csv(\"data/prices.csv\", parse_dates=[\"price_date\"])\n\nframes = []\nrng = np.random.default_rng(42)\nfor year_offset in range(8):\n    for suffix in [\"\", \"_B\", \"_C\", \"_D\", \"_E\", \"_F\"]:\n        f = df.copy()\n        f[\"price_date\"] = f[\"price_date\"] - pd.DateOffset(years=year_offset)\n        f[\"ticker\"] = f[\"ticker\"] + suffix\n        for col in [\"open\", \"high\", \"low\", \"close\"]:\n            f[col] = (f[col] * rng.uniform(0.7, 1.3)).round(2)\n        frames.append(f)\n\nbig = pd.concat(frames, ignore_index=True)\nprint(len(big), \"rows\")\nbig.to_parquet(\"data/prices_big.parquet\", index=False)\n# load to BigQuery:\n#   bq load --source_format=PARQUET market_elt.prices_big data/prices_big.parquet","check":"Expect roughly **2–3 million rows**. Load it once unpartitioned and once partitioned by `price_date` and clustered by `ticker`."},{"title":"Measure it without paying for it","lang":"BigQuery SQL","note":"Use a dry run to get bytes billed before you run anything. In the console the estimate appears top-right; from the CLI it is `bq query --dry_run`. Record both numbers for the same query against both tables.","code":"-- run this against prices_big (unpartitioned) and prices_partitioned\nSELECT ticker, AVG(close) AS avg_close\nFROM market_elt.prices_big\nWHERE price_date BETWEEN DATE '2026-01-01' AND DATE '2026-12-31'\nGROUP BY ticker;\n\n-- from the CLI, no cost incurred:\n--   bq query --dry_run --use_legacy_sql=false '<the query above>'\n\n-- and prove the guardrail works: this should be REJECTED outright\n-- once the partitioned table has require_partition_filter = true\nSELECT COUNT(*) FROM market_elt.prices_partitioned;","check":"The one-year filter should scan close to **1/8** of the partitioned table and **100%** of the unpartitioned one. That ratio, not the absolute number, is what goes in `docs/cost_analysis.md`. Convert it to pounds using the **current** on-demand rate from [the official pricing page](https://cloud.google.com/bigquery/pricing) — third-party sources disagree, and quoting a stale rate in an interview is worse than quoting none. Remember the first 1 TiB per month is free, so benchmark with that in mind. The final query should fail with a partition-filter error; if it runs, your guardrail is not set."}],"exercises":{"Tue":["Write two sentences on why columnar wins for analytical queries, using bytes scanned rather than adjectives.","Compare Snappy against gzip on the same file and record both sizes.","Write out the Hive-style prefix layout you are about to create.","Run `MSCK REPAIR` and then add a partition explicitly, and note which you would use in a pipeline and why.","Read the partition-projection docs and write one line on when it beats auto-detection."],"Wed":["Run the inflate script, then build the same dataset twice — unpartitioned CSV and partitioned Parquet.","Confirm both return **identical results** for the same query before you compare cost."],"Thu":["Run three representative queries against both and record bytes scanned for each.","Compute the percentage saved per query.","Check your Parquet file sizes and state whether you have a small-files problem."],"Fri":["Write `docs/cost_analysis.md` with the before/after table, the query set and the percentage saved.","Translate the biggest saving into pounds per month at $5/TB, assuming the query runs hourly.","Write two sentences comparing this to Snowflake's automatic micro-partitions."]},"dayfiles":{"Tue":{"act":"none","note":"Experiment in the BigQuery console before committing anything."},"Wed":{"act":"new","path":"sql/ddl/create_partitioned_prices.sql"},"Thu":{"act":"new","path":"docs/cost_analysis.md","note":"Record the before number today, while you still have it."},"Fri":{"act":"continue","path":"docs/cost_analysis.md","note":"Add the after number and the percentage saved."}}},{"n":23,"phase":3,"title":"Infrastructure as Code (Terraform)","goal":"The whole stack recreatable from code — destroy and rebuild in one command. Near-universal on real UK DE job specs, and the place you prove multi-cloud honestly.","days":[["Tue","Why IaC: reproducibility and reviewability, not convenience. Providers, resources, data sources, state. **Then:** Install Terraform; Google provider block; a first `google_storage_bucket` resource matching your naming convention. Variables and outputs."],["Wed","`plan` / `apply` / `destroy`. What the state file does, why you never hand-edit it, why it's gitignored, and what remote state (Cloud Storage + DynamoDB locking) solves for teams."],["Thu","Add a `google_bigquery_dataset` and a `google_service_account` with a least-privilege role binding (feeds Week 29). Then modules for reuse — and write the bucket module a **second** time for AWS S3. It is a twenty-line diff, it costs you an hour, and it is the difference between claiming multi-cloud and evidencing it."],["Fri","Destroy and recreate the entire stack from code in under five minutes."]],"files":["infra/main.tf","infra/variables.tf","infra/outputs.tf","infra/modules/bucket_gcs/","infra/modules/bucket_s3/","infra/.gitignore  (.terraform/, *.tfstate)"],"mini":{"n":14,"name":"`infra/*.tf`","desc":"Cloud Storage + Knowledge Catalog + IAM as code.","feeds":"Major Project 2 gets provisioned by this, not by console clicks.","mp":[2]},"resources":[{"day":null,"md":"Official: [HashiCorp Developer — Terraform tutorials (Google Cloud track)](https://developer.hashicorp.com/terraform/tutorials)"},{"day":null,"md":"Course: [Terraform Full Course for Beginners](https://www.youtube.com/watch?v=7xngnjfIlK4)"},{"day":null,"md":"Reference: [Terraform Google provider registry](https://registry.terraform.io/providers/hashicorp/google/latest/docs)"},{"day":"Wed","md":"[Terraform state — official docs](https://developer.hashicorp.com/terraform/language/state)"}],"dod":"A working Terraform config for Cloud Storage + BigQuery + IAM; you can destroy and recreate on demand; you can explain the state file and remote state; and the same logical bucket exists as both a GCS and an S3 module.","vidbase":"https://www.youtube.com/watch?v=7xngnjfIlK4","vidlabel":"Terraform full course","chapters":{"Tue":[[251,"Part 1: Evolution of Cloud + Infrastructure"],[876,"Part 2: Terraform Overview + Setup"],[3503,"Part 4: Variables and Outputs"]],"Wed":[[1712,"Part 3: Basic Terraform Usage"]],"Thu":[[4802,"Part 6: Project Organization + Modules"]]},"exercises":{"Tue":["Write three sentences on why IaC matters for reviewability, not convenience.","Define provider, resource, data source and state in one line each.","Write `main.tf` creating one Cloud Storage bucket matching your naming convention.","Move the bucket name into `variables.tf` and expose the ARN in `outputs.tf`.","Run `plan` and read every line before you `apply`."],"Wed":["Run `plan`, `apply`, then `plan` again — the second must show **no changes**. If it does not, your config is not declarative.","Open the state file, find your bucket, and write one line on why hand-editing it is dangerous.","Write two sentences on what Cloud Storage + DynamoDB remote state solves that local state does not."],"Thu":["Add a BigQuery catalog database and an IAM role whose policy grants read on one bucket and write on another — nothing else.","Extract the bucket into a reusable module and call it twice with different names."],"Fri":["Run `destroy` then `apply` and time it. **Under five minutes.**","Confirm the rebuilt stack works by running one BigQuery query against it.","Note anything that did not survive the rebuild — that is your hidden manual step."]},"dayfiles":{"Tue":{"act":"new","path":"infra/main.tf · infra/variables.tf · infra/outputs.tf","note":"Create the `infra/` folder with all three files from the start, even if two are nearly empty."},"Wed":{"act":"new","path":"infra/.gitignore","note":"Add `.terraform/` and `*.tfstate` **before** your first `apply`. State files leak account detail."},"Thu":{"act":"continue","path":"infra/main.tf","note":"Knowledge Catalog database and IAM role. Week 29 hardens this into `infra/iam.tf`."},"Fri":{"act":"none","note":"Command line only — `destroy` then `apply`. No new files."}}},{"n":24,"phase":3,"title":"Docker & Containerisation","goal":"Code that runs identically on your machine, in CI, and in the cloud.","days":[["Tue","Images vs containers vs registries; layers and the build cache; why \"works on my machine\" dies here. **Then:** Write a Dockerfile for a Python script: base image choice, `WORKDIR`, dependency install order for cache efficiency, `CMD` vs `ENTRYPOINT`."],["Wed","Build and run locally; volumes and environment variables; handling secrets safely (never baked into an image — ties to Week 29)."],["Thu","Multi-stage builds and image size. Push to Artifact Registry."],["Fri","`docker compose` basics — you'll rely on this for Airflow and Kafka locally."]],"files":["Dockerfile",".dockerignore","docker-compose.yml"],"mini":{"n":15,"name":"`Dockerfile` + compose","desc":"Ingestion script containerised and pushed to Artifact Registry.","feeds":"Major Project 3 runs containerised.","mp":[3]},"resources":[{"day":null,"md":"Reference: [Docker — official documentation](https://docs.docker.com/)"},{"day":null,"md":"Course: [Docker Tutorial for Beginners — Full Course in 3 Hours (TechWorld with Nana)](https://www.youtube.com/watch?v=3c-iBn73dDE)"},{"day":null,"md":"Practice: [Play with Docker — free browser sandbox](https://labs.play-with-docker.com/)"},{"day":"Thu","md":"[Push and pull images — Artifact Registry](https://docs.cloud.google.com/artifact-registry/docs/docker/pushing-and-pulling)"}],"vidbase":"https://www.youtube.com/watch?v=3c-iBn73dDE","vidlabel":"Nana Docker","chapters":{"Tue":[[656,"What is a Container?"],[1180,"Docker vs Virtual Machine"],[2522,"Main Docker Commands"],[6122
