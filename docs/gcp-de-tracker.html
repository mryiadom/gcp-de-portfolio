<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>GCP Data Engineer — Foundations to Capstone</title>
<style>
:root{
  --bg:#0b0e13; --sur:#12161d; --sur2:#171c25; --line:#222835; --line2:#2e3644;
  --tx:#e6eaf0; --tx2:#98a3b3; --tx3:#6a7585;
  --acc:#5b9dff; --ok:#46c66d; --gold:#e0b25f; --plum:#c58af0; --warn:#f08a4b;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:5rem;-webkit-font-smoothing:antialiased}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
code{font-family:var(--mono);font-size:.85em;background:#080b10;padding:.1em .4em;
  border-radius:5px;color:#8fe0c4;white-space:nowrap}
h1,h2,h3,h4{line-height:1.2;margin:0;font-weight:650;letter-spacing:-.015em}
.wrap{max-width:940px;margin:0 auto;padding:0 20px}

/* ---- top bar ---- */
.bar{position:-webkit-sticky;position:sticky;top:0;z-index:60;background:rgba(11,14,19,.88);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line)}
.bar .wrap{padding-top:11px;padding-bottom:11px}
.brow{display:flex;align-items:center;gap:14px}
.bname{font-size:14px;font-weight:650;margin-right:auto;letter-spacing:-.01em}
.bname i{font-style:normal;color:var(--tx3);font-weight:450}
.bnum{font-family:var(--mono);font-size:12.5px;color:var(--tx2);white-space:nowrap}
.bpct{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--acc);
  min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
.track{height:4px;border-radius:99px;background:#0a0d12;overflow:hidden;margin-top:10px}
.track>i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--acc),#7ee0c0);transition:width .3s cubic-bezier(.4,0,.2,1)}
.nav{display:flex;gap:5px;flex-wrap:wrap;margin-top:11px}
.nav button{font:600 12px/1 inherit;color:var(--tx2);background:transparent;
  border:1px solid var(--line2);padding:7px 11px;border-radius:8px;cursor:pointer;
  transition:all .15s}
.nav button:hover{color:var(--tx);border-color:var(--acc);background:rgba(91,157,255,.08)}
.nav button.ghost{margin-left:auto;color:var(--tx3);border-color:transparent}
.nav button.ghost:hover{color:var(--warn);border-color:rgba(240,138,75,.4);background:none}

/* ---- hero ---- */
.hero{padding:52px 0 10px}
.hero h1{font-size:clamp(26px,4.5vw,36px);letter-spacing:-.03em}
.hero .lede{color:var(--tx2);font-size:16px;margin-top:12px;max-width:62ch}

/* ---- fold sections ---- */
.sec{border-top:1px solid var(--line);scroll-margin-top:132px}
.sec:first-of-type{border-top:0}
button.sech{display:flex;align-items:center;gap:12px;width:100%;padding:17px 2px;
  background:none;border:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
button.sech:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.chev{color:var(--tx3);font-size:10px;flex:0 0 10px;transition:transform .2s}
.sec.on .chev{transform:rotate(90deg)}
.sech h3{font-size:14.5px;font-weight:600;flex:1 1 auto;min-width:0;color:var(--tx2)}
.sec.on .sech h3{color:var(--tx)}
.tag{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--gold);
  border:1px solid rgba(224,178,95,.35);border-radius:99px;padding:2px 9px;white-space:nowrap}
.secb{display:none;padding:0 0 26px}
.sec.on .secb{display:block}
.secb>*:first-child{margin-top:0}
.secb p{color:var(--tx2);font-size:15px;margin:.7em 0;max-width:74ch}
.secb ul{margin:.7em 0;padding-left:1.15em;color:var(--tx2);font-size:15px;max-width:74ch}
.secb li{margin:.4em 0}
.secb strong{color:var(--tx);font-weight:600}
.secb em{color:var(--tx2)}

/* ---- tables ---- */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:.5em 0}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;color:var(--tx3);font-size:10.5px;text-transform:uppercase;
  letter-spacing:.09em;font-weight:700;padding:0 14px 9px 0;border-bottom:1px solid var(--line2)}
table.t td{padding:10px 14px 10px 0;color:var(--tx2);vertical-align:top;
  border-bottom:1px solid var(--line)}
table.t tr:last-child td{border-bottom:0}
table.t td:first-child{color:var(--tx);font-weight:550}

pre.code{font-family:var(--mono);font-size:12.5px;line-height:1.6;background:#080b10;
  border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;
  color:#8fe0c4;margin:0;-webkit-overflow-scrolling:touch}
pre.tree{color:var(--tx2)}

/* ---- phases ---- */
.phase{margin-top:44px;scroll-margin-top:132px}
button.ph{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;
  padding:0 0 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;
  border-bottom:1px solid var(--line2)}
button.ph:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.phn{font-family:var(--mono);font-size:34px;font-weight:700;color:var(--line2);
  line-height:1;letter-spacing:-.04em;flex:0 0 auto;transition:color .2s}
.phase.on .phn{color:var(--acc)}
.phmeta{flex:1 1 auto;min-width:0}
.phmeta h2{font-size:19px}
.phmeta span{display:block;font-size:12.5px;color:var(--tx3);font-family:var(--mono);margin-top:3px}
.phpc{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--tx2);
  font-variant-numeric:tabular-nums;flex:0 0 auto}
.phase.on .phpc{color:var(--ok)}
.phwrap{display:none;padding-top:6px}
.phase.on .phwrap{display:block}
.phlede{color:var(--tx3);font-size:14px;font-style:italic;margin:14px 0 4px;max-width:74ch}

/* ---- weeks ---- */
.wk{border-bottom:1px solid var(--line)}
button.wkh{display:flex;align-items:center;gap:12px;width:100%;padding:15px 2px;
  background:none;border:0;cursor:pointer;text-align:left;font:inherit;color:inherit}
button.wkh:focus-visible{outline:2px solid var(--acc);outline-offset:-2px;border-radius:6px}
.wkn{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--tx3);
  flex:0 0 34px;letter-spacing:.02em}
.wk.done .wkn{color:var(--ok)}
.wkt{flex:1 1 auto;min-width:0;font-size:15.5px;font-weight:550}
.wk.major .wkt{color:#e9d6fb}
.wkc{font-family:var(--mono);font-size:11.5px;color:var(--tx3);flex:0 0 auto;
  font-variant-numeric:tabular-nums}
.wk.done .wkc{color:var(--ok)}
.pill{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--plum);border:1px solid rgba(197,138,240,.4);border-radius:99px;padding:2px 8px}
.dots{display:flex;gap:3px;flex:0 0 auto}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line2);transition:background .2s}
.dots i.f{background:var(--ok)}
@media(max-width:600px){.dots{display:none}.wkt{font-size:15px}}
.wkb{display:none;padding:4px 0 30px}
.wk.on .wkb{display:block}
.wk.major .wkb{border-left:2px solid rgba(197,138,240,.35);padding-left:16px;margin-left:2px}

.goal{color:var(--tx2);font-size:15px;margin:6px 0 22px;max-width:74ch}
.goal b{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gold);margin-bottom:5px;font-weight:800}
h4.blk{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3);
  font-weight:800;margin:26px 0 11px}

/* ---- days ---- */
.day{display:flex;gap:13px;padding:14px 0;border-top:1px solid rgba(34,40,53,.7)}
.day:first-of-type{border-top:0;padding-top:2px}
.day>input{-webkit-appearance:none;appearance:none;flex:0 0 20px;width:20px;height:20px;
  margin:2px 0 0;border:1.5px solid var(--line2);border-radius:6px;background:#080b10;
  cursor:pointer;position:relative;transition:all .15s}
.day>input:hover{border-color:var(--tx3)}
.day>input:checked{background:var(--ok);border-color:var(--ok)}
.day>input:checked:after{content:"";position:absolute;left:6.5px;top:2.5px;width:4px;height:9px;
  border:solid #0b0e13;border-width:0 2px 2px 0;transform:rotate(43deg)}
.day>input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.dbody{flex:1 1 auto;min-width:0}
.dtop{font-size:15px;color:var(--tx2)}
.dtop b{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--tx);margin-right:9px}
.day.tick .dtop{color:var(--tx3)}
.day.tick .dtop b{color:var(--tx3)}

ul.todo{margin:11px 0 0;padding:0;list-style:none}
ul.todo li{position:relative;padding:4px 0 4px 17px;font-size:14px;color:var(--tx2);max-width:72ch}
ul.todo li:before{content:"";position:absolute;left:3px;top:13px;width:5px;height:5px;
  border-radius:50%;background:var(--acc);opacity:.55}
ul.todo li strong{color:#8fe0c4;font-weight:600}
.pdp{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.09em;
  background:rgba(224,178,95,.14);color:var(--gold);border-radius:4px;padding:2px 5px;
  margin-right:7px;vertical-align:1px}

.meta{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:11px;font-size:12.5px;
  color:var(--tx3);align-items:baseline}
.act{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 7px;border-radius:5px}
.a-new{color:#8fe0c4;background:rgba(143,224,196,.13)}
.a-continue{color:var(--acc);background:rgba(91,157,255,.13)}
.a-reuse{color:var(--plum);background:rgba(197,138,240,.13)}
.a-none{color:var(--tx3);background:rgba(110,120,135,.13)}
.path{font-family:var(--mono);font-size:12px;color:#8fe0c4;word-break:break-all}
.why{color:var(--tx3);flex:1 1 100%;font-size:12.5px;max-width:70ch}
.vid{display:flex;flex-wrap:wrap;gap:7px;align-items:baseline;margin-top:7px;font-size:13px}
.vid:before{content:"\25B6";color:#ff5f56;font-size:9px}
.vid a{color:var(--tx2)}
.vid a:hover{color:var(--tx)}
.vts{font-family:var(--mono);font-size:11.5px;color:var(--gold)}
.dres{margin-top:8px;font-size:13px;color:var(--tx3)}
.dres em{font-style:normal;color:var(--gold);font-weight:700;font-size:10px;
  text-transform:uppercase;letter-spacing:.08em;margin-right:7px}

/* ---- header finish chip ---- */
.bfin{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15;
  white-space:nowrap;padding-right:2px;border-right:1px solid var(--line2);padding-right:13px}
.bfin b{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--gold)}
.bfin span{font-family:var(--mono);font-size:9.5px;color:var(--tx3)}
@media(max-width:700px){.bnum{display:none}}
@media(max-width:430px){.bfin{display:none}}

/* ---- side dock ---- */
#dock{display:none}
@media(min-width:1280px){
  #dock{display:block;position:fixed;top:132px;right:22px;width:186px;z-index:40;
    background:var(--sur);border:1px solid var(--line);border-radius:var(--r);
    padding:14px 15px 15px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  #dock.shut{padding:8px;width:auto}
  #dock.shut .dbody{display:none}
  #dock.shut .dtog{transform:rotate(180deg)}
}
.dtog{position:absolute;top:9px;right:9px;width:22px;height:22px;padding:0;
  background:none;border:0;color:var(--tx3);font-size:10px;cursor:pointer;
  transition:transform .2s;line-height:1}
.dtog:hover{color:var(--tx)}
#dock.shut .dtog{position:static;display:block}
.dh{font-size:10px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  color:var(--tx3);margin-bottom:11px}
.dstats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:11px}
.dstats>div{background:#080b10;border-radius:8px;padding:8px 4px;text-align:center}
.dstats b{display:block;font-family:var(--mono);font-size:17px;font-weight:700;
  color:var(--acc);font-variant-numeric:tabular-nums;line-height:1.1}
.dstats span{display:block;font-size:9.5px;color:var(--tx3);margin-top:2px}
.dfin{background:rgba(224,178,95,.09);border-radius:8px;padding:9px 8px;text-align:center;
  margin-bottom:13px}
.dfin b{display:block;font-family:var(--mono);font-size:15px;font-weight:700;color:var(--gold)}
.dfin span{display:block;font-size:9.5px;color:var(--tx3);margin-top:2px}
.drow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.drow span{font-size:11px;color:var(--tx3)}
.drow output{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--gold)}
#dock input[type=range]{width:100%;margin-bottom:11px}
.dact{font-size:10.5px;color:var(--ok);text-align:center;margin-bottom:7px;
  font-family:var(--mono)}
.dlast{font-size:10.5px;color:var(--tx3);text-align:center}
.dlast b{color:var(--tx2);font-family:var(--mono)}

/* ---- pace tracker ---- */
.pace{background:var(--sur);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:560px){.pgrid{grid-template-columns:repeat(2,1fr)}}
.pstat{text-align:center;background:#080b10;border-radius:10px;padding:11px 6px}
.pstat b{display:block;font-family:var(--mono);font-size:21px;font-weight:700;color:var(--acc);
  font-variant-numeric:tabular-nums;line-height:1.1}
.pstat span{display:block;font-size:10.5px;color:var(--tx3);margin-top:4px;letter-spacing:.02em}
.prow{display:flex;align-items:center;gap:13px;margin:4px 0 14px}
.plab{font-size:12.5px;color:var(--tx2);white-space:nowrap;font-weight:550}
.pout{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--gold);
  min-width:20px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1 1 auto;height:4px;
  border-radius:99px;background:var(--line2);outline:none;cursor:pointer;min-width:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:22px;height:22px;border-radius:50%;background:var(--acc);cursor:pointer;
  border:3px solid var(--bg);box-shadow:0 0 0 1px var(--acc)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;
  background:var(--acc);cursor:pointer;border:3px solid var(--bg)}
input[type=range]:focus-visible{outline:2px solid var(--acc);outline-offset:4px}
.pproj{font-size:14.5px;color:var(--tx2);margin:0 0 9px;max-width:70ch}
.pproj strong{color:var(--tx)}
.pact{font-size:13px;color:var(--tx2);margin:0;max-width:70ch}
.pact strong{color:var(--ok)}
.pdim{color:var(--tx3)}
button.plink{font:600 12.5px/1 inherit;color:var(--acc);background:none;border:0;
  border-bottom:1px solid rgba(91,157,255,.45);padding:0 0 1px;cursor:pointer;margin-left:4px}
button.plink:hover{color:var(--tx)}

/* ---- project blocks ---- */
ol.req,ul.req{margin:0;padding-left:0;list-style:none;counter-reset:rq}
ol.req li,ul.req li{position:relative;padding:7px 0 7px 26px;font-size:14.5px;
  color:var(--tx2);max-width:74ch;border-bottom:1px solid rgba(34,40,53,.55)}
ol.req li:last-child,ul.req li:last-child{border-bottom:0}
ol.req.bd li{counter-increment:rq}
ol.req.bd li:before{content:counter(rq);position:absolute;left:0;top:8px;
  font-family:var(--mono);font-size:11px;font-weight:700;color:var(--acc);
  width:18px;text-align:left}
ul.req.ac li:before{content:"\2713";position:absolute;left:2px;top:7px;
  color:var(--ok);font-size:13px;font-weight:700}
ul.req.fm li:before{content:"\26A0";position:absolute;left:1px;top:8px;
  color:var(--warn);font-size:12px}
ul.req.rb li:before{content:"?";position:absolute;left:4px;top:7px;
  color:var(--plum);font-size:13px;font-weight:800}
ul.req strong,ol.req strong{color:var(--tx)}

/* ---- content blocks ---- */
.files{display:flex;flex-wrap:wrap;gap:6px}
.files span{font-family:var(--mono);font-size:12px;color:#8fe0c4;background:#080b10;
  border:1px solid var(--line);border-radius:7px;padding:6px 10px;word-break:break-all}
.card{background:var(--sur);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px}
.card+.card{margin-top:11px}
.card p{margin:.5em 0;font-size:14.5px;color:var(--tx2)}
.chd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:9px}
.chd .ct{font-size:14.5px;font-weight:600;flex:1 1 auto;min-width:0}
.lang{font-family:var(--mono);font-size:9.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.09em;color:var(--gold);border:1px solid rgba(224,178,95,.35);
  border-radius:5px;padding:2px 7px}
button.cp{font:700 11px/1 inherit;color:var(--tx2);background:var(--sur2);
  border:1px solid var(--line2);border-radius:7px;padding:7px 12px;cursor:pointer;min-width:66px}
button.cp:hover{color:var(--tx);border-color:var(--acc)}
button.cp.y{color:var(--ok);border-color:var(--ok)}
button.cp.n{color:var(--warn);border-color:var(--warn)}
.card pre.code{max-height:360px;overflow:auto}
.chk{margin-top:10px;background:rgba(224,178,95,.07);border-left:2px solid var(--gold);
  border-radius:0 8px 8px 0;padding:10px 13px;font-size:13.5px;color:var(--tx2)}
.chk b{display:block;color:var(--gold);font-size:10px;text-transform:uppercase;
  letter-spacing:.1em;margin-bottom:4px;font-weight:800}
.mini{border-left:2px solid var(--gold);padding:2px 0 2px 15px}
.mini .mh{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--gold)}
.mini p{margin:.4em 0;font-size:14.5px;color:var(--tx2)}
.mini .fd{font-size:13px;color:var(--acc)}
.dod{border-left:2px solid var(--ok);padding:2px 0 2px 15px;font-size:14.5px;color:var(--tx2)}
.dod b{display:block;color:var(--ok);font-size:10.5px;text-transform:uppercase;
  letter-spacing:.09em;margin-bottom:4px;font-weight:800}
.spec{border-left:2px solid var(--plum);padding:2px 0 2px 15px;font-size:14.5px;color:var(--tx2)}
.note{background:rgba(240,138,75,.07);border-left:2px solid var(--warn);
  border-radius:0 8px 8px 0;padding:11px 14px;font-size:14.5px;color:var(--tx2);margin:16px 0}
.note b{display:block;color:var(--warn);font-size:10px;text-transform:uppercase;
  letter-spacing:.1em;margin-bottom:4px;font-weight:800}
ul.res{list-style:none;padding:0;margin:0}
ul.res li{position:relative;padding:5px 0 5px 15px;font-size:14px;color:var(--tx2)}
ul.res li:before{content:"";position:absolute;left:2px;top:14px;width:4px;height:4px;
  border-radius:50%;background:var(--line2)}

/* ---- mini-projects ---- */
.mpg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:720px){.mpg{grid-template-columns:1fr}}
.mpr{display:flex;gap:11px;align-items:flex-start;background:var(--sur);
  border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.mpr input{-webkit-appearance:none;appearance:none;flex:0 0 18px;width:18px;height:18px;
  margin:1px 0 0;border:1.5px solid var(--line2);border-radius:5px;background:#080b10;
  cursor:pointer;position:relative}
.mpr input:checked{background:var(--gold);border-color:var(--gold)}
.mpr input:checked:after{content:"";position:absolute;left:5.5px;top:2px;width:4px;height:9px;
  border:solid #0b0e13;border-width:0 2px 2px 0;transform:rotate(43deg)}
.mpr label{cursor:pointer;flex:1 1 auto;min-width:0}
.mpn{font-size:14px;color:var(--tx);font-weight:550}

<script>
var DATA = {"title":"GCP Data Engineer — Foundations to Capstone","panels":[{"id":"start","title":"Start here","tone":"accent","body":["Six phases to **Analytics Engineer** or unprefixed **Data Engineer** in UK fintech, banking or capital markets. Junior DE is the floor, not the target — 2+ years of data experience plus paid GCP work means \"junior only\" undersells you. Quant Developer is the later move, reached from inside a markets-data role.","**Phase 0 comes first and is not optional.** The original plan assumed you already had the shell, the git workflow, the environment discipline, and the representation traps around money and time. Those assumptions are where self-taught engineers stall — not on writing Python, but on rebasing, reading a traceback, or explaining why a timestamp drifted an hour in March. Six weeks up front buys back far more than six weeks later.","Every week produces a committed artefact. Small components accumulate into three major projects, so nothing is throwaway — the utility module from Week 7 is imported by the capstone in Week 32.","**This is roughly a year, not six months, and that is the deliberate choice.** Depth beats speed when the target is mid-level rather than entry. See *How long this takes* for the pacing — and note that **applications start at Week 17**, not at the end."],"list":["**Each day shows**: what to do, which file it touches (*Create* / *Continue* / *Carried over* / *No file*), and a video chapter jumping to the exact timestamp where that topic is covered.","**Numbers in bold are expected results**, computed from the seed data — so you can check your own work without being shown the answer.","**A <span class=\"pdp\">PDP</span> tag** marks a deliverable that also satisfies a key result in your PM Dragonfly development plan. Do it once, count it twice."]},{"id":"howlong","title":"How long this takes","tone":"plain","body":["**33 weeks · 153 study days · 6 phases.** 22 weeks run the full five days; 11 are shorter because the concept day and the build day were merged into one.","The week numbers are units of work, not calendar weeks. What it costs you in real time depends entirely on how many evenings you get:"],"table":{"head":["Pace","Calendar time","Realistic if…"],"rows":[["5 days/week","~31 weeks · **8 months**","You are between jobs or have unusually free evenings. Treat this as the floor, not the plan."],["4 days/week","~38 weeks · **9–10 months**","Full-time job, no other commitments, and you protect the time."],["3 days/week","~51 weeks · **12 months**","**The honest default.** A full-time Junior DE role, a 12-month development plan running alongside, and a life."]]},"after":["Add roughly 15% for illness, holidays and the weeks where something simply does not work. A plan with no slack is a plan you abandon in week nine.","**The date that matters is not the end date.** Applications start at **Week 17**, the moment Project 1 is publishable — about four months in at full pace, six at the honest one. Everything after that is depth-building while you are already interviewing, not a gate you must clear first."],"milestones":{"head":["Milestone","Week","What you can say"],"rows":[["Foundations done","6","Shell, git, environments, data representation, HTTP, query execution."],["Core skills done","11","Python, SQL to window functions, pandas, OOP."],["**Project 1 published**","16","An end-to-end pipeline on GCP with a written finding."],["**Applications start**","17","CV rebuilt, repo pinned, walkthrough recorded."],["**Project 2 published**","26","The junior/mid DE job, near-verbatim from adverts: dbt, star schema, Terraform, risk marts."],["Production systems done","31","Airflow in depth, IAM, data quality, CI/CD, Kafka."],["**Capstone shipped**","32–33","A platform with two ingestion paths, an audit trail, and CI."]]}},{"id":"cost","title":"What this costs","tone":"done","body":["**£0 to complete, or $200 if you take the certification.** Everything else fits inside free tiers, and the plan is built that way on purpose — Airflow and Kafka run under Docker locally precisely so you never touch a managed-service meter."],"list":["**Free forever:** Python, SQL, pandas, Docker, Terraform, dbt Core, Airflow, Kafka, Great Expectations, pytest, ruff. GitHub is free, and Actions is unlimited on public repos. Looker Studio is free. Finnhub, Alpha Vantage and Twelve Data all have no-card free tiers.","**BigQuery:** 1 TiB of queries and 10 GB of storage free every month. Your whole dataset is around 200 MB, so this is not close.","**Google Cloud trial:** $300 of credit for 90 days on a new account, on top of the always-free quotas.","**Snowflake:** $400 of credits for 30 days, no card — enough for the Week 20 portability proof.","**Cloud Storage — the one catch.** The always-free 5 GB applies only to `us-west1`, `us-central1` and `us-east1`. This plan uses `europe-west2` for the data-residency lesson, so storage is charged at about **$0.023/GB/month** once your credit expires. At your volumes that is a **couple of pence a month** — worth knowing, not worth moving for.","**Two ways to actually spend money:** the Week 21 inflate script builds a 2–3 million row table, so price queries with `--dry_run` before running them. And a Looker Studio live connection re-queries BigQuery on every filter click — Week 14 flags it.","**The only paid item** is the Google Cloud Professional Data Engineer exam at **$200**, in Week 33 and explicitly optional. It also satisfies the certification line in your workplace development plan."],"after":["Keep the Cloud Billing budget alert you already set. **£5 is a generous ceiling** for this entire plan — if it ever fires, something is wrong rather than expensive."]},{"id":"roles","title":"The roles this targets, and where each requirement is met","tone":"accent","body":["Read from live London adverts in August 2026. The closest match to your target — a **Senior Data Engineer (Snowflake)** on a regulatory-driven programme at an investment manager — lists these as *essential*. The right-hand column is where this plan produces the evidence."],"table":{"head":["Listed as essential","Where you build it"],"rows":[["Strong SQL and data engineering capability","Weeks 8, 10 · window functions, CTEs, optimisation"],["Excellent understanding of star schema / dimensional modelling","Weeks 17–18 · designed, then built, then dbt-tested"],["Experience with dbt","Weeks 20, 26, 32 · models, tests, docs, and a second warehouse"],["**Experience working with time-series market data**","Week 15 · corporate actions, trading calendars, point-in-time"],["**Market data platforms and financial data ingestion**","Weeks 16, 24, 26 · a packaged, retrying, idempotent API client"],["Strong commercial experience with Snowflake","Week 20 · same dbt project run against Snowflake · *the weakest link — see below*"],["**Risk-related environments**","Week 26 · volatility, drawdown and historical VaR marts"],["Implementing data quality, validation and governance controls","Weeks 28, 29 · least-privilege, dbt tests, Great Expectations, alerting"],["Regulatory reporting initiatives","Weeks 15, 32 · as-of queries, audit trail, reproducible figures"],["Stakeholder engagement and communication","Weeks 19, 27, 33 · design notes in plain English, a runbook, a walkthrough"]]},"after":["**The honest gap: Snowflake.** Adverts say *commercial* experience and one portability exercise is not that. Two ways to close it — spend the free trial doing something substantial rather than a smoke test, and be direct in interview that your Snowflake is project-depth, not production-depth. Overstating it is the fastest way to fail a technical screen. **Databricks and Spark** also appear across senior London adverts; they are deliberately out of scope here, and that is a defensible answer as long as you can say why."],"anchor":"roles"},{"id":"why","title":"Why GCP, and what stays portable","tone":"plain","body":["Built on Google Cloud because you use it daily — a portfolio you finish beats one you abandon, and it compounds with your workplace plan instead of competing for the same evenings. The cost: your CV already says GCP, so this proves less that is new than an AWS build would.","The answer to that is the portable spine. **SQL, dbt, Airflow, Kafka, Docker, Terraform, pytest, dimensional modelling and idempotency are not cloud skills** — they are roughly two-thirds of this plan and they move with you anywhere. Three things keep it honest rather than claimed: Airflow and Kafka run in Docker rather than as managed services, Week 21 runs the same dbt project against **Snowflake**, and Week 23 writes the Terraform bucket module for **both GCS and S3**."]},{"id":"setup","title":"Already done — not repeated below","tone":"done","list":["GitHub account and `gcp-de-portfolio` repo · VS Code","Google Cloud project live with billing enabled, and a **Cloud Billing budget alert** set","First bucket created — `ronald-foundations-raw-dev`, `europe-west2`"],"body":["One-off check before Week 7: `python3 --version`, `git --version`, the VS Code Python extension, and `gcloud auth application-default login`."]},{"id":"projects","title":"How the three projects stack","tone":"plain","list":["**Project 1 — Equity Markets Analytics (Week 16).** Absorbs the trade-utils module, the SQL query library, the cleaning notebook, the EDA charts, the `WarehouseClient` class, the lake layout and the dashboard.","**Project 2 — Market Data ELT Pipeline (Week 26).** Adds the star schema, the dbt project, the partitioning and cost work, the Terraform stack, the Dockerfile, and the packaged ingestion module with retries and tests.","**Project 3 — Trading-Data Platform (Weeks 32–33).** Adds two weeks of Airflow, a Kafka streaming path, least-privilege IAM, data-quality checks with alerting, and CI/CD."],"body":["Rhythm: **Learn 40% → Build 40% → Document 15% → Review 5%.** A week is done when its Definition of Done genuinely passes. If it isn't committed, it didn't happen."]}],"hygiene":{"title":"Repo hygiene — applies to every repo, from Week 7","gitignore_intro":"**`.gitignore` essentials** — commit this before anything else:","gitignore":".env\n.venv/\n__pycache__/\n*.pyc\n.ipynb_checkpoints/\n.terraform/\n*.tfstate\n*.tfstate.backup\ntarget/\ndbt_packages/\nlogs/\n.DS_Store","sections":[{"h":"File naming","list":["Python files and folders: `snake_case.py`. Never spaces, capitals, or dates in filenames.","Notebooks: two-digit prefix so they sort in execution order — `01_cleaning.ipynb`, `02_stats.ipynb`.","SQL: `snake_case.sql`, one file per logical model or question.","Terraform: `main.tf`, `variables.tf`, `outputs.tf`, `iam.tf`."]},{"h":"Notebook vs module","body":["Notebooks are for exploration and narrative analysis. `.py` modules are for anything reused. **If you import it twice, it belongs in a module, not a notebook.** Never import from a notebook."]},{"h":"Commits","body":["Imperative mood, one logical change each: `add rolling volatility to stats notebook`, not `updates`. Push at least once per working day."]},{"h":"README","body":["Every repo: what problem it solves, the stack, how to run it, what you found, screenshots. A reader should understand the project in 60 seconds."]},{"h":"Secrets","body":["Never committed, ever. Not in code, not in notebooks, not in `.tf` files, not in git history. Use environment variables locally and Secret Manager in Google Cloud."]}]},"naming":{"title":"Naming conventions — decide once, apply everywhere","head":["Thing","Pattern","Example"],"rows":[["Cloud Storage buckets","`ronald-<project>-<layer>-<env>`","`ronald-equity-analytics-raw-dev`"],["Region","one region, everywhere","`europe-west2` (London) — bucket **and** dataset"],["Layers","`raw` / `staging` / `curated`","pick one scheme, keep it"],["Service accounts","`<project>-<service>-sa`","`market-elt-ingest-sa`"],["BigQuery datasets","`<project>_<layer>`","`market_elt_raw`, `market_elt_marts`"],["GitHub repos","kebab-case","`equity-markets-analytics`"],["Airflow DAG ids","`<project>_<flow>_dag`","`market_elt_daily_dag`"],["Labels on every resource","`project`, `environment`, `owner`","`owner=ronald`"]],"foot":"Cloud Storage bucket names are globally unique across all of Google Cloud — lowercase, numbers, hyphens and underscores only, no capitals. BigQuery dataset names allow underscores but **not** hyphens, which is why the bucket and dataset conventions differ. Labels are GCP's equivalent of tags and are what your billing export groups by."},"phaseTable":{"title":"The five phases at a glance","head":["Phase","Weeks","Title","What it gets you"],"rows":[["**1**","1–5","Core Skills","Python, SQL and pandas at working depth, plus the OOP and advanced-SQL reps everything later assumes"],["**2**","6–10","Google Cloud Foundations & First Project","A live data lake, the maths literacy, a dashboard — and Major Project 1 published, with applications started"],["**3**","11–19","Data Engineering Core","Modelling, dbt, cost tuning, Terraform, Docker, production Python — ending in Major Project 2, the pipeline that *is* the junior/mid DE job"],["**4**","20–24","Production Systems","Orchestration in depth, security, data quality, CI/CD and streaming — the difference between a script and a system"],["**5**","25–26","Capstone & Job Hunt","The headline project built and shipped, CV and interview prep sharpened"]],"foot":"Applications start in Week 17 and run continuously from there. Phases 3–5 are depth-building while they're in flight, not a prerequisite to applying."},"phases":[{"n":0,"title":"Foundations","range":"Weeks 1–6","from":1,"to":6,"intro":"The things the rest of the plan quietly assumes. Skipping these is why self-taught engineers hit a wall at the first code review — not because they can't write Python, but because they can't rebase, can't read a traceback, and don't know why their timestamps drifted by an hour in March."},{"n":1,"title":"Core Skills","range":"Weeks 7–11","from":7,"to":11,"intro":"Python, SQL and pandas at working depth, plus the OOP and advanced-SQL reps everything later assumes. No Google Cloud yet — the fundamentals have to be real first."},{"n":2,"title":"Google Cloud Foundations & First Project","range":"Weeks 12–17","from":12,"to":17,"intro":"Your first real cloud storage and query layer, the maths literacy a markets team expects, a working dashboard — and Major Project 1 published. Applications start at the end of this phase, not the end of the plan."},{"n":3,"title":"Data Engineering Core","range":"Weeks 18–26","from":18,"to":26,"intro":"Where the DE title starts to earn out: modelling data properly, transforming it with dbt, tuning what it costs, provisioning it as code, containerising it, and packaging the Python that moves it. Ends in Major Project 2 — the pipeline that IS the junior/mid DE job."},{"n":4,"title":"Production Systems","range":"Weeks 27–31","from":27,"to":31,"intro":"The gap between a script and a system. Orchestration in real depth, least-privilege security, data quality that fails loudly, automated testing, and a streaming path. This phase is what separates you from a portfolio of tutorials."},{"n":5,"title":"Capstone & Job Hunt","range":"Weeks 32–33","from":32,"to":33,"intro":"Everything wired together into the headline project, then the portfolio converted into interviews. Applications have been running since Week 17 — this phase sharpens the pitch rather than starting it."}],"weeks":[{"n":1,"phase":0,"title":"The Command Line","goal":"Live in the shell without friction. Every tool later in this plan — git, dbt, Airflow, Docker, gcloud — is a command-line tool first.","days":[["Mon","Navigation and the filesystem: `pwd`, `cd`, `ls -la`, absolute vs relative paths, `~`, `.` and `..`. Creating, moving, copying and removing files and directories. Tab completion and history — if you are typing full paths by hand you are doing it wrong."],["Tue","Reading and slicing text: `cat`, `head`, `tail -f`, `less`, `wc -l`, `cut`, `sort`, `uniq -c`, `grep`. Then pipes and redirection — `|`, `>`, `>>`, `2>&1` — which is the idea that makes the shell powerful rather than just a file browser."],["Wed","`find` for locating files by name, size and age. `sed` and `awk` at a survival level — enough to change one field in a CSV without opening it. File permissions: what `rwx` and `chmod +x` actually mean, and why a script won't run."],["Thu","Environment variables, `PATH`, and your shell profile (`.zshrc` on a Mac). Exporting a variable versus setting it for one command. Why `export API_KEY=...` in your profile is how secrets stay out of code — and why that file must never be in a repo."],["Fri","Write a shell script that takes an argument, checks it exists, and pipes a CSV through a filter to produce a summary. Make it executable and run it from anywhere. Then set up SSH keys for GitHub so you stop typing passwords."]],"files":["scripts/summarise.sh","~/.zshrc  (outside the repo)"],"dod":"You can move around, find and filter files without reaching for Finder; you can explain what a pipe does; a working executable shell script is committed; SSH auth to GitHub works.","resources":[{"day":null,"md":"Course: [The Missing Semester of Your CS Education (MIT) — shell, scripting, tooling](https://missing.csail.mit.edu/)"},{"day":"Fri","md":"[Connecting to GitHub with SSH — official docs](https://docs.github.com/en/authentication/connecting-to-github-with-ssh)"}],"exercises":{"Mon":["Navigate to your repo, list every hidden file, and explain what each dotfile is for.","Create a nested folder structure three deep, then remove it in one command."],"Tue":["Take `prices.csv` (or any CSV) and answer three questions **without opening it**: how many rows, how many distinct values in column 1, and which value appears most often.","Chain at least four commands with pipes to produce a top-5 list."],"Wed":["Find every `.py` file in your home directory modified in the last 7 days.","Use `sed` to replace a value in a CSV and write the result to a new file, leaving the original untouched."],"Thu":["Set an environment variable in your shell profile, open a new terminal, and read it from Python with `os.environ`.","Explain in one line why a secret in `.zshrc` is safer than one in `config.py`, and what is still wrong with it."],"Fri":["Write `summarise.sh` that takes a CSV path, exits with a clear message if the file is missing, and prints row count plus the top 5 values of a chosen column.","Generate an SSH key, add it to GitHub, and push a commit without entering a password."]},"dayfiles":{"Mon":{"act":"none","note":"Practice only — nothing to commit yet."},"Tue":{"act":"none","note":"Practice only. Keep a scratch note of commands that worked."},"Wed":{"act":"none","note":"Practice only."},"Thu":{"act":"continue","path":"~/.zshrc","note":"Outside the repo, deliberately. Never commit your shell profile."},"Fri":{"act":"new","path":"scripts/summarise.sh","note":"Create `scripts/`. Remember `chmod +x` or it will not run."}}},{"n":2,"phase":0,"title":"Git and Code Review","goal":"Work the way a team works. Your development plan measures progress in **merged pull requests** — this is the week that makes that possible.","days":[["Mon","The three states: working directory, staging area, repository. `status`, `add`, `commit`, `log`, `diff`. What a commit actually is, and why small commits with clear messages are a professional habit rather than a style preference."],["Tue","Branching and merging: `branch`, `switch`, `merge`. Create a conflict on purpose and resolve it by hand — conflict markers are not an error, they are git asking you a question it cannot answer."],["Wed","Remotes and pull requests: `push`, `pull`, `fetch`. Open a PR against your own repo, review your own diff, and merge it. Then branch protection: require a review, and feel the friction that stops you pushing to `main` at midnight."],["Thu","Undoing things without panic: `restore`, `revert`, `reset --soft` vs `--hard`, and `reflog` as the safety net. When to `rebase` and when never to — the rule is never rewrite history that someone else has pulled."],["Fri","Commit hygiene and the review conversation: imperative messages, one logical change per commit, a PR description that says *why* not *what*. Review a PR and leave three useful comments — the skill is asking questions, not finding fault."]],"files":[".gitignore","docs/pr_template.md",".github/pull_request_template.md"],"dod":"A branch created, a conflict resolved by hand, a PR opened and merged with branch protection on; you can undo a bad commit three different ways and explain which to use when; commit history reads as a sequence of intentions.","resources":[{"day":null,"md":"Reference: [Pro Git — the free official book](https://git-scm.com/book/en/v2)"},{"day":null,"md":"Practice: [GitHub Skills — free interactive courses](https://skills.github.com/)"},{"day":"Thu","md":"[Git — undoing things](https://git-scm.com/book/en/v2/Git-Basics-Undoing-Things)"}],"exercises":{"Mon":["Make five commits that each do one thing, with imperative messages. Read the log back and check it tells a story.","Stage part of a file and commit only that part."],"Tue":["Create a branch, change the same line on both branches, merge, and resolve the conflict by hand.","Explain in one line what the conflict markers mean."],"Wed":["PDP: Open a pull request, review your own diff line by line, and merge it. **This is the unit your development plan counts in** — get fluent now.","Turn on branch protection requiring one approval, then try to push directly to `main` and watch it fail."],"Thu":["Commit something wrong, then undo it three ways: `revert`, `reset --soft`, and `restore`. Write one line on when each is right.","Delete a branch you still needed, then recover it with `reflog`."],"Fri":["Write a PR template with sections for what, why, and how to test it.","PDP: Review one PR — your own or an open-source one — and leave three comments that ask a question rather than assert a fix."]},"dayfiles":{"Mon":{"act":"none","note":"Practising in any scratch repo is fine."},"Tue":{"act":"none","note":"Practice branch — delete it afterwards."},"Wed":{"act":"new","path":".github/pull_request_template.md","note":"Create `.github/`. GitHub picks this up automatically for every new PR."},"Thu":{"act":"none","note":"Recovery practice — nothing to keep."},"Fri":{"act":"continue","path":".github/pull_request_template.md"}}},{"n":3,"phase":0,"title":"Python Environments and Tooling","goal":"Never say \"it works on my machine\" again. Isolated environments, readable tracebacks, and a linter that catches what you miss.","days":[["Mon","Virtual environments: what `python3 -m venv .venv` actually does, activating and deactivating, and why installing into system Python breaks things eventually. `pip install`, `pip freeze`, and why a `requirements.txt` frozen from a dirty environment is worse than none."],["Tue","Project layout and imports: modules, packages, `__init__.py`, absolute vs relative imports, and why `ModuleNotFoundError` is almost always a working-directory problem rather than a missing file. Editable installs with `pip install -e .`."],["Wed","Reading a traceback properly — bottom-up, find your own file first. Then `breakpoint()` and stepping through code, which beats scattering `print()` and forgetting to remove them."],["Thu","Linting and formatting with `ruff`, and type hints as documentation the machine can check. Configure it once in `pyproject.toml` and let it run on save."],["Fri","Put it together: a small package with a `pyproject.toml`, installed editable into a venv, importable from anywhere, linted clean. This is the skeleton every later week fills in."]],"files":["pyproject.toml","requirements.txt","src/__init__.py",".venv/  (gitignored)"],"dod":"A clean venv with a frozen `requirements.txt`; your package imports from a different directory; you can read a traceback and name the failing line before running anything; `ruff check` passes.","resources":[{"day":"Mon","md":"[venv — Python standard library docs](https://docs.python.org/3/library/venv.html)"},{"day":null,"md":"Reference: [Python Packaging User Guide](https://packaging.python.org/en/latest/)"},{"day":"Thu","md":"[Ruff — linter and formatter docs](https://docs.astral.sh/ruff/)"}],"exercises":{"Mon":["Create a venv, install `pandas` into it, and prove your system Python does not see it.","Freeze requirements from the clean venv and read the file — every line should be something you meant to install."],"Tue":["Build a two-module package and import one from the other. Break it by running from the wrong directory, then fix it properly rather than with `sys.path` hacks.","Install it editable and import it from your home directory."],"Wed":["Trigger three different exceptions on purpose — `KeyError`, `TypeError`, `FileNotFoundError` — and for each, name the failing line from the traceback before scrolling up.","Use `breakpoint()` to inspect a variable mid-loop."],"Thu":["Run `ruff check` on your Week 1 script and fix everything it flags.","Add type hints to one function and explain what they do and do not guarantee at runtime."],"Fri":["Assemble the package skeleton and confirm a fresh clone plus `pip install -e .` works end to end.","Delete `.venv`, recreate it from `requirements.txt`, and confirm everything still runs."]},"dayfiles":{"Mon":{"act":"new","path":".venv/","note":"Add `.venv/` to `.gitignore` immediately — never commit an environment."},"Tue":{"act":"new","path":"src/__init__.py","note":"Create the `src/` package folder you will use for the rest of the plan."},"Wed":{"act":"none","note":"Debugging practice — nothing to commit."},"Thu":{"act":"new","path":"pyproject.toml","note":"Ruff config lives here alongside your package metadata."},"Fri":{"act":"continue","path":"pyproject.toml","note":"Plus a `requirements.txt` frozen from the clean venv."}}},{"n":4,"phase":0,"title":"How Data Is Actually Represented","goal":"The week that prevents silent corruption. Encodings, money, and time are where data engineering quietly goes wrong — and all three matter more in finance than anywhere else.","days":[["Mon","Text and encodings: bytes versus characters, UTF-8, what a `UnicodeDecodeError` is telling you, and the byte-order mark that breaks your first column name. Then CSV's real problems — embedded commas, quoting, newlines inside fields — and why a hand-rolled `split(',')` parser is always wrong."],["Tue","Numbers: integers, floating point, and why `0.1 + 0.2 != 0.3`. **Never use a float for money.** `Decimal` in Python, `NUMERIC` in BigQuery, and how a rounding error compounds across a million rows into a reconciliation failure someone has to explain."],["Wed","Dates and times, the biggest silent killer: naive versus timezone-aware datetimes, UTC as the only sane storage format, ISO-8601, and what happens to a daily job at 01:30 on the night the clocks change. Market hours, trading days versus calendar days, and why exchange data has its own timezone."],["Thu","Structure: JSON, nested objects, arrays, and the difference between `null`, missing, and empty string — three things that mean different things and get conflated constantly. JSONL for streams. Schema-on-read versus schema-on-write."],["Fri","File formats compared: CSV, JSONL, Parquet. Row versus columnar layout and why that single idea determines the cost of every query you write from Week 12 onward. Write the same data three ways and compare sizes."]],"files":["notebooks/00_representation.ipynb","docs/data_conventions.md"],"dod":"You can explain why floats are wrong for money and demonstrate the error; every timestamp you produce is timezone-aware and stored in UTC; you can state the difference between null, missing and empty; you have measured CSV versus Parquet on the same data.","resources":[{"day":"Tue","md":"[decimal — Python standard library docs](https://docs.python.org/3/library/decimal.html)"},{"day":"Wed","md":"[datetime — Python standard library docs](https://docs.python.org/3/library/datetime.html)"},{"day":"Fri","md":"[Apache Parquet — file format documentation](https://parquet.apache.org/docs/)"}],"exercises":{"Mon":["Save a CSV containing an accented character and a comma inside a quoted field. Read it with the `csv` module and with a naive `split(',')`, and show where the naive version breaks.","Read a file with the wrong encoding on purpose and read the error properly."],"Tue":["Show `0.1 + 0.2 != 0.3` in Python, then fix it with `Decimal`.","Sum a price column a million times as float and as `Decimal` and compare the totals. **The difference is the bug you would have shipped.**","Write down which BigQuery type you will use for price, and why."],"Wed":["Create a naive and an aware datetime, convert both to UTC, and show which one lies.","Take a UNIX timestamp in seconds and convert it correctly to a London wall-clock time — this is exactly what the markets API returns in Week 16.","Work out what your daily 01:30 job does on the last Sunday in March."],"Thu":["Parse JSON with a missing key, a `null` key and an empty-string key, and handle all three distinctly.","Flatten a nested JSON object into a table and decide what to do with the arrays."],"Fri":["Write the same 100k rows as CSV, JSONL and Parquet and record the three file sizes.","Read only one column from the Parquet file and explain why that is cheap and why the same thing is impossible in CSV."]},"dayfiles":{"Mon":{"act":"new","path":"notebooks/00_representation.ipynb","note":"Create `notebooks/`. Two-digit prefix so it sorts first."},"Tue":{"act":"continue","path":"notebooks/00_representation.ipynb"},"Wed":{"act":"continue","path":"notebooks/00_representation.ipynb"},"Thu":{"act":"continue","path":"notebooks/00_representation.ipynb"},"Fri":{"act":"new","path":"docs/data_conventions.md","note":"Write down the rules you will follow for the next 30 weeks: UTC everywhere, NUMERIC for money, explicit encodings."}}},{"n":5,"phase":0,"title":"How the Internet Moves Data","goal":"Everything you ingest arrives over HTTP. Understand the protocol before you write a client that depends on it.","days":[["Mon","The request/response model: methods, status codes that actually matter (200, 201, 400, 401, 403, 404, 429, 500, 503), headers, and the body. Which methods are safe and idempotent, and why that maps directly onto whether a retry is safe."],["Tue","REST in practice: resources, query parameters, pagination styles (offset, cursor, page token) and how each fails. Rate limits, `Retry-After`, and why 429 means wait rather than try harder."],["Wed","Authentication: API keys in headers versus query strings (never the latter — they end up in logs), bearer tokens, OAuth at a conceptual level, and Google service accounts with Application Default Credentials."],["Thu","The transport underneath: DNS resolution, TLS and why certificate errors are never something to disable, ports, and what a timeout actually times out. Read a request with `curl -v` and identify each stage."],["Fri","Read an API's documentation cold — Finnhub's — and answer in writing: what are the endpoints, the auth method, the rate limit, the pagination, and the error shape? That reading skill is the real deliverable."]],"files":["notebooks/00_http.ipynb","docs/api_notes.md"],"dod":"You can name what each HTTP status means for retry logic; you can authenticate to an API from Python without hard-coding the key; you have read one API's docs and written down its limits before writing any client code.","resources":[{"day":null,"md":"Reference: [MDN — HTTP documentation](https://developer.mozilla.org/en-US/docs/Web/HTTP)"},{"day":"Wed","md":"[Application Default Credentials — how ADC works](https://docs.cloud.google.com/docs/authentication/application-default-credentials)"},{"day":"Fri","md":"[Finnhub — API documentation](https://finnhub.io/docs/api)"}],"exercises":{"Mon":["For each of 400, 401, 429, 500 and 503, write one line on whether retrying helps and why.","Explain why retrying a `POST` is riskier than retrying a `GET`."],"Tue":["Call a paginated public API and fetch all pages in a loop with a termination condition that cannot run forever.","Deliberately exceed a rate limit and observe the response. Record what the API actually returns — it is rarely what the docs imply."],"Wed":["Authenticate to an API using a key read from an environment variable, never a literal.","Run `gcloud auth application-default login` and read a Cloud Storage bucket from Python with no key file anywhere."],"Thu":["Run `curl -v` against an HTTPS endpoint and identify the DNS lookup, the TLS handshake and the request.","Set a 1ms timeout and observe the failure — that is the exception your Week 25 retry logic must catch."],"Fri":["Read the Finnhub docs and write `docs/api_notes.md` covering endpoints, auth, rate limit, pagination and error shape.","Predict how many calls your Week 16 project will need, and whether it fits the free tier."]},"dayfiles":{"Mon":{"act":"none","note":"Reading and notes."},"Tue":{"act":"new","path":"notebooks/00_http.ipynb"},"Wed":{"act":"continue","path":"notebooks/00_http.ipynb"},"Thu":{"act":"none","note":"Command line only."},"Fri":{"act":"new","path":"docs/api_notes.md","note":"Week 16's research questions are already half-answered if you do this properly."}}},{"n":6,"phase":0,"title":"How a Query Actually Runs","goal":"Stop guessing at SQL performance. Understand the execution model and query tuning becomes reasoning rather than superstition.","days":[["Mon","The logical order of operations — `FROM` → `WHERE` → `GROUP BY` → `HAVING` → `SELECT` → `ORDER BY` → `LIMIT` — and why that order explains three things that confuse everyone: why you cannot use a `SELECT` alias in `WHERE`, why `HAVING` and `WHERE` are not interchangeable, and why `LIMIT` does not make a slow query fast."],["Tue","Row versus columnar storage, revisited from Week 4 but now as the reason a warehouse behaves differently from Postgres. What a full scan costs, what an index does in a row store, and why BigQuery has no indexes at all."],["Wed","Joins under the bonnet: nested loop versus hash join, why cardinality estimates matter, and what happens when a join key is not unique — the row explosion that produces plausible-looking wrong answers."],["Thu","Reading a query plan. Run one in BigQuery, find the most expensive stage, and connect it back to what you wrote. Shuffle, slot time and bytes processed as three different costs."],["Fri","Transactions and consistency at a working level: ACID, what a warehouse guarantees versus a transactional database, and why analytics engineers rarely think about locking but always think about snapshots and idempotent reloads."]],"files":["docs/query_execution.md"],"dod":"You can state the logical order of operations from memory and use it to explain a specific error; you can read a query plan and name the expensive stage; you can explain a row explosion and how to detect one.","resources":[{"day":null,"md":"Reference: [Use The Index, Luke — how indexing actually works](https://use-the-index-luke.com/)"},{"day":"Thu","md":"[Query plan and timeline — BigQuery official docs](https://docs.cloud.google.com/bigquery/docs/query-plan-explanation)"}],"exercises":{"Mon":["Write a query that fails because it uses a `SELECT` alias in `WHERE`, then explain the failure using the order of operations.","Write the same filter two ways — in `WHERE` and in `HAVING` — and explain why one is wrong."],"Tue":["Explain in two sentences why a columnar store makes `SELECT one_column` cheap and `SELECT *` expensive.","Write down why BigQuery has no indexes and what it uses instead."],"Wed":["Build a lookup table with a **duplicated** key, join it, and watch your row count inflate.","Write the check that would have caught it — a uniqueness assertion on the join key. **This is the test you will add in dbt in Week 21.**"],"Thu":["Run a query in BigQuery, open the execution details, and identify the stage consuming the most slot time.","Change one thing — add a filter, or select fewer columns — and record how the plan changes."],"Fri":["Write one paragraph on what a reload should do if it runs twice, and why that is a consistency question rather than a code question.","Write `docs/query_execution.md` summarising the week in a page you would actually reread before an interview."]},"dayfiles":{"Mon":{"act":"none","note":"Query sandbox — nothing to commit."},"Tue":{"act":"none","note":"Concepts and notes."},"Wed":{"act":"none","note":"Sandbox experiment. Keep the query that broke."},"Thu":{"act":"none","note":"BigQuery console."},"Fri":{"act":"new","path":"docs/query_execution.md","note":"One page. You will reread this before every SQL interview."}}},{"n":7,"phase":1,"title":"Python Fundamentals","goal":"Confident writing plain Python — types, control flow, functions, comprehensions, error handling.","days":[["Mon","Variables, strings, numbers, booleans, lists, dicts, tuples, sets; `if`/`elif`/`else`. Store trades as dicts in a list; print only those above a price threshold."],["Tue","`for` and `while` loops; `range`, `enumerate`, `zip`. Loop 1–100 skipping multiples of 3."],["Wed","Functions: parameters, default arguments, return values, docstrings, scope."],["Thu","List/dict comprehensions. Error handling: `try`/`except`/`finally`, raising custom exceptions with useful messages."],["Fri","Modules and imports: split functions into a separate `.py` file and import them. Commit."]],"files":["src/trade_utils.py","week01/practice.py"],"mini":{"n":1,"name":"`trade_utils.py`","desc":"Percentage return between two prices; a trade-size classifier with a default volume threshold; a currency formatter; each raising a clear `ValueError` on bad input.","feeds":"Feeds Major Project 1 — you'll import this later, not rewrite it.","mp":[1]},"resources":[{"day":null,"md":"Course: [Learn Python — Full Course for Beginners (freeCodeCamp)](https://www.youtube.com/watch?v=rfscVS0vtbw)"},{"day":null,"md":"Reference: [Real Python — tutorials and reference](https://realpython.com/)"},{"day":null,"md":"Practice: [Exercism — Python track (graded, with tests)](https://exercism.org/tracks/python)"},{"day":"Thu","md":"[Real Python: Python Exceptions](https://realpython.com/python-exceptions/)"}],"dod":"Three utility functions written and hand-tested; a comprehension used where it genuinely improves readability; `try`/`except` with a custom exception; the module imports cleanly from another file; committed.","vidbase":"https://www.youtube.com/watch?v=rfscVS0vtbw","vidlabel":"freeCodeCamp Python","chapters":{"Mon":[[906,"Variables & Data Types"],[3790,"Lists"],[6006,"If Statements"],[7637,"Dictionaries"]],"Tue":[[8053,"While Loop"],[9164,"For Loops"]],"Wed":[[5055,"Functions"],[5651,"Return Statement"]],"Thu":[[11057,"Try / Except"]],"Fri":[[12493,"Modules & Pip"]]},"data":[{"title":"Sample trades to work with on Monday","lang":"python","note":"Paste into `week01/practice.py`. Same five tickers you'll use all the way to Week 33. Monday's task is to print only those above a price threshold.","code":"# week01/practice.py\ntrades = [\n    {\"ticker\": \"AAPL\", \"price\": 230.02, \"volume\": 2500, \"side\": \"SELL\"},\n    {\"ticker\": \"MSFT\", \"price\": 430.23, \"volume\": 2500, \"side\": \"BUY\"},\n    {\"ticker\": \"JPM\",  \"price\": 218.81, \"volume\": 1500, \"side\": \"SELL\"},\n    {\"ticker\": \"XOM\",  \"price\": 113.61, \"volume\": 1000, \"side\": \"SELL\"},\n    {\"ticker\": \"JNJ\",  \"price\": 158.15, \"volume\": 2500, \"side\": \"BUY\"},\n    {\"ticker\": \"AAPL\", \"price\": 219.86, \"volume\": 7500, \"side\": \"BUY\"},\n    {\"ticker\": \"MSFT\", \"price\": 452.56, \"volume\": 1500, \"side\": \"SELL\"},\n    {\"ticker\": \"JPM\",  \"price\": 226.68, \"volume\": 1000, \"side\": \"BUY\"},\n    {\"ticker\": \"XOM\",  \"price\": 115.70, \"volume\": 1000, \"side\": \"SELL\"},\n    {\"ticker\": \"JNJ\",  \"price\": 166.07, \"volume\": 750,  \"side\": \"SELL\"},\n]","check":"Filtering for price > 200 should leave **7** trades. Total volume across all ten is **22,750**."}],"exercises":{"Mon":["Print every trade in the sample list priced above 220. **Expect 4 of the 10.**","Store the same ten trades three ways: a list of dicts, a dict keyed by ticker, and a list of tuples. Write one sentence on which you would pick for looking up a single ticker, and why.","Use a set to answer: how many distinct tickers are in the list? **5.**"],"Tue":["Loop 1–100 printing only numbers not divisible by 3. **Expect 67 numbers.**","Use `enumerate` to print each trade with a 1-based row number.","Use `zip` to pair a list of tickers with a list of prices, then find the highest-priced ticker **without** calling `max()` on a dict."],"Wed":["Write `pct_return(old_price, new_price)` returning percentage change to 2dp. `pct_return(200, 230)` must return `15.0`.","Write `classify_trade(volume, threshold=1000)` returning `'BLOCK'` or `'REGULAR'`, using a default argument.","Write `format_gbp(amount)` turning `1234.5` into `'£1,234.50'`. Give all three functions a one-line docstring."],"Thu":["Rewrite Monday's threshold filter as a single list comprehension.","Build a dict comprehension mapping ticker → total volume. **AAPL should come out as 10000.**","Make `pct_return` raise `ValueError('old price must be non-zero')` when `old_price` is 0, then catch it with `try`/`except` and print the message."],"Fri":["Move all three functions into `src/trade_utils.py` and import them into `practice.py`. The import must work with no code copied.","Add an `if __name__ == '__main__':` block to `trade_utils.py` that calls each function once with a known input, so running the file directly self-tests it."]},"dayfiles":{"Mon":{"act":"new","path":"week01/practice.py","note":"Create the `week01/` folder too — this is your scratch file all week."},"Tue":{"act":"continue","path":"week01/practice.py"},"Wed":{"act":"continue","path":"week01/practice.py"},"Thu":{"act":"continue","path":"week01/practice.py"},"Fri":{"act":"new","path":"src/trade_utils.py","note":"Create the `src/` folder. Move the three functions out of `practice.py` and import them back — that move *is* the exercise."}}},{"n":8,"phase":1,"title":"SQL Fundamentals","goal":"Fluent with filtering, joins, aggregation and grouping — the base Week 10 builds on.","days":[["Mon","`SELECT`, `WHERE`, `ORDER BY`, `LIMIT`; `AND`/`OR`/`IN`/`BETWEEN`/`LIKE`; `NULL` handling and why `= NULL` never works."],["Tue","Joins: `INNER`, `LEFT`, `RIGHT`, `FULL`. Create an `instrument → sector` lookup and join it; watch row counts change between INNER and LEFT."],["Wed","`GROUP BY`, `HAVING` vs `WHERE`, `COUNT`/`SUM`/`AVG`/`MIN`/`MAX`; grouping on multiple columns."],["Thu","Subqueries in `WHERE` and in `FROM`; when a join reads clearer than a subquery."],["Fri","`CASE WHEN`, date functions, string functions. Total volume and average price per instrument per month."]],"files":["sql/analytics/*.sql  (five files, snake_case, one per question)","sql/ddl/create_trades.sql"],"mini":{"n":2,"name":"`sql/analytics/` query library","desc":"Five commented, reusable queries, each with a one-line comment stating the question it answers.","feeds":"Feeds Major Project 1 — these become your BigQuery queries, near-unchanged.","mp":[1]},"notes":["Where to run it: a free browser sandbox (DB Fiddle) or BigQuery. Write your own `CREATE TABLE` and `INSERT` 40–60 rows across five instruments and six months."],"resources":[{"day":null,"md":"Course: [SQL Tutorial — Full Database Course for Beginners (freeCodeCamp)](https://www.youtube.com/watch?v=HXV3zeQKqGY)"},{"day":null,"md":"Reference: [W3Schools — SQL Tutorial](https://www.w3schools.com/sql/)"},{"day":null,"md":"Practice: [SQLZoo](https://sqlzoo.net/) and [SQLBolt](https://sqlbolt.com/)"},{"day":null,"md":"Sandbox: [DB Fiddle](https://www.db-fiddle.com/)"}],"dod":"Four join types demonstrated and explained; a `GROUP BY` + `HAVING` query correct; a subquery used appropriately; queries committed and commented.","vidbase":"https://www.youtube.com/watch?v=HXV3zeQKqGY","vidlabel":"freeCodeCamp SQL","chapters":{"Mon":[[6971,"Basic Queries"]],"Tue":[[10896,"Joins"]],"Wed":[[9027,"More Basic Queries (aggregates & GROUP BY)"]],"Thu":[[11509,"Nested Queries"]]},"data":[{"title":"Schema — run this first","lang":"BigQuery SQL","note":"Three tables in a new `market_practice` dataset. Note that BigQuery requires `NOT ENFORCED` on every key constraint — it records them as metadata for the query planner but will happily let you insert a duplicate. That gap between *declared* and *enforced* is worth remembering; it is why Week 21 makes you write a `unique` test rather than trusting the schema.","code":"-- run once; pick EU so your data stays in-region\nCREATE SCHEMA IF NOT EXISTS market_practice\nOPTIONS (location = 'EU');\n\nCREATE OR REPLACE TABLE market_practice.venues (\n  venue_code  STRING NOT NULL,\n  venue_name  STRING NOT NULL,\n  country     STRING NOT NULL,\n  PRIMARY KEY (venue_code) NOT ENFORCED\n);\n\nCREATE OR REPLACE TABLE market_practice.instruments (\n  instrument_id  INT64  NOT NULL,\n  ticker         STRING NOT NULL,\n  name           STRING NOT NULL,\n  sector         STRING NOT NULL,\n  PRIMARY KEY (instrument_id) NOT ENFORCED\n);\n\nCREATE OR REPLACE TABLE market_practice.trades (\n  trade_id       INT64        NOT NULL,\n  instrument_id  INT64        NOT NULL,\n  trade_date     DATE         NOT NULL,\n  price          NUMERIC      NOT NULL,\n  volume         INT64        NOT NULL,\n  venue_code     STRING       NOT NULL,\n  side           STRING       NOT NULL,\n  PRIMARY KEY (trade_id) NOT ENFORCED,\n  FOREIGN KEY (instrument_id)\n    REFERENCES market_practice.instruments(instrument_id) NOT ENFORCED,\n  FOREIGN KEY (venue_code)\n    REFERENCES market_practice.venues(venue_code) NOT ENFORCED\n);"},{"title":"Reference data","lang":"BigQuery SQL","note":"Six instruments, but only five of them ever trade. `NVDA` exists in the lookup and nowhere else — that is the point of it.","code":"INSERT INTO market_practice.venues (venue_code, venue_name, country) VALUES\n  ('XNAS', 'Nasdaq', 'US'),\n  ('XNYS', 'New York Stock Exchange', 'US');\n\nINSERT INTO market_practice.instruments (instrument_id, ticker, name, sector) VALUES\n  (1, 'AAPL', 'Apple Inc.',           'Technology'),\n  (2, 'MSFT', 'Microsoft Corp.',      'Technology'),\n  (3, 'JPM',  'JPMorgan Chase & Co.', 'Financials'),\n  (4, 'XOM',  'Exxon Mobil Corp.',    'Energy'),\n  (5, 'JNJ',  'Johnson & Johnson',    'Healthcare'),\n  (6, 'NVDA', 'NVIDIA Corp.',         'Technology');"},{"title":"54 trades — six months, five instruments","lang":"BigQuery SQL","note":"Deliberately uneven: some months have two trades per instrument, some have one. That unevenness is what makes `GROUP BY` and `HAVING` produce interesting answers on Wednesday.","code":"INSERT INTO market_practice.trades\n  (trade_id, instrument_id, trade_date, price, volume, venue_code, side)\nVALUES\n  (1044, 5, DATE '2026-01-03', 160.04, 1000, 'XNYS', 'SELL'),\n  (1045, 5, DATE '2026-01-03', 152.56, 7500, 'XNYS', 'SELL'),\n  (1012, 2, DATE '2026-01-07', 438.92, 1500, 'XNAS', 'SELL'),\n  (1002, 1, DATE '2026-01-08', 224.96, 1000, 'XNAS', 'BUY'),\n  (1013, 2, DATE '2026-01-11', 447.60, 7500, 'XNAS', 'BUY'),\n  (1023, 3, DATE '2026-01-13', 201.75, 750, 'XNYS', 'BUY'),\n  (1001, 1, DATE '2026-01-15', 230.02, 2500, 'XNAS', 'SELL'),\n  (1024, 3, DATE '2026-01-17', 206.01, 750, 'XNYS', 'SELL'),\n  (1034, 4, DATE '2026-01-27', 124.22, 1000, 'XNYS', 'BUY'),\n  (1014, 2, DATE '2026-02-02', 464.03, 2500, 'XNAS', 'BUY'),\n  (1035, 4, DATE '2026-02-06', 121.68, 2500, 'XNYS', 'BUY'),\n  (1047, 5, DATE '2026-02-06', 157.04, 12000, 'XNYS', 'SELL'),\n  (1003, 1, DATE '2026-02-09', 219.86, 7500, 'XNAS', 'BUY'),\n  (1046, 5, DATE '2026-02-09', 159.38, 2000, 'XNYS', 'BUY'),\n  (1036, 4, DATE '2026-02-12' 5.60, 250, 'XNYS', 'SELL'),\n  (1022, 2, DATE '2026-06-10', 484.12, 7500, 'XNAS', 'BUY'),\n  (1010, 1, DATE '2026-06-18', 236.69, 500, 'XNAS', 'SELL'),\n  (1021, 2, DATE '2026-06-20', 483.72, 12000, 'XNAS', 'SELL'),\n  (1032, 3, DATE '2026-06-22', 223.88, 1000, 'XNYS', 'SELL'),\n  (1043, 4, DATE '2026-06-22', 112.34, 1500, 'XNYS', 'BUY'),\n  (1054, 5, DATE '2026-06-24', 149.53, 5000, 'XNYS', 'SELL'),\n  (1053, 5, DATE '2026-06-25', 155.12, 5000, 'XNYS', 'BUY');","check":"**54** rows. Per instrument: AAPL 11, MSFT 11, JPM 11, XOM 10, JNJ 11 — and NVDA 0. Total volume **184,750**, dates **2026-01-03 → 2026-06-25**, split **28 BUY / 26 SELL**. On Tuesday, `INNER JOIN` instruments → 54 rows, `LEFT JOIN` from instruments → 55. If your LEFT JOIN also returns 54, you have joined the wrong way round."}],"exercises":{"Mon":["Return all trades priced above 220, newest first. **Expect 19 rows.**","Return trades with a price between 150 and 250. **Expect 29 rows.**","Run `WHERE side = NULL` and then `WHERE side IS NULL`. Both return 0 rows here — write one sentence explaining why the first would return 0 even if NULLs existed."],"Tue":["Join trades to instruments and return ticker, sector, price. **INNER JOIN gives 54 rows.**","Rewrite it as a LEFT JOIN *from* instruments. **You should now get 55** — find the extra row and explain in one line what it represents.","Count trades per sector. **Technology 22, Healthcare 11, Financials 11, Energy 10.**"],"Wed":["Total and average volume per instrument. **MSFT 63,000 total; JPM 16,000.**","Add a `HAVING` clause for instruments whose total volume exceeds 35,000. **Expect exactly 2: JNJ and MSFT.**","Group by instrument *and* side. Write one line on why `HAVING` cannot be replaced by `WHERE` here."],"Thu":["Find every trade priced above the average price **for its own instrument**. **Expect 29 rows.**","Now find trades above the **overall** average price of 238.08. **Expect 11.** Explain in one line why the two answers differ so much.","Rewrite one of them as a join instead of a subquery and say which reads more clearly."],"Fri":["Total volume per instrument per month. **Expect 30 rows** — every instrument traded in every month.","Use `CASE WHEN` to bucket trades into SMALL (<1000), MEDIUM (1000–4999) and LARGE (≥5000). **Expect 9 / 28 / 17.**","Which calendar month had the highest total volume? **May, at 40,500.**"]},"dayfiles":{"Mon":{"act":"new","path":"sql/ddl/create_trades.sql","note":"Create the `sql/` tree: `sql/ddl/` and `sql/analytics/`. Your CREATE TABLE and INSERTs live here."},"Tue":{"act":"new","path":"sql/analytics/trades_by_sector.sql","note":"File 1 of 5. Name each file after the question it answers — this one joins trades to the instruments lookup, and is where you see INNER vs LEFT differ because of NVDA."},"Wed":{"act":"new","path":"sql/analytics/volume_by_instrument.sql","note":"File 2 of 5 — total and average volume per instrument, filtered with HAVING."},"Thu":{"act":"new","path":"sql/analytics/above_average_trades.sql","note":"File 3 of 5 — the one that needs a subquery."},"Fri":{"act":"new","path":"sql/analytics/monthly_volume_by_instrument.sql · sql/analytics/trade_size_bands.sql","note":"Files 4 and 5 of 5 — the monthly rollup, plus a CASE WHEN bucketing trades into size bands. Five committed query files by tonight."}}},{"n":9,"phase":1,"title":"Pandas Fundamentals","goal":"Reading data in, cleaning it, reshaping it, joining it — plus first charts.","days":[["Mon","`read_csv`/`read_json`; dtypes; `.info()`/`.describe()`/`.head()`; setting an index; `.loc` vs `.iloc`."],["Tue","Cleaning: detect NaNs with `.isna()` (never `== None` — NaN doesn't equal itself), `dropna`/`fillna`, `duplicated`/`drop_duplicates`, type conversion. Understand why you'd fill per-group rather than with a global mean, and when to flag or quarantine rather than delete."],["Wed","Reshaping: `groupby` + `agg` with a dict of per-column functions, `pivot_table`, `merge`, `concat`."],["Thu","Dates: `to_datetime`, sorting, `resample`, rolling windows, `groupby().transform()` for per-group calculations that broadcast back."],["Fri","`apply` vs `transform` vs `agg`. Boolean indexing and `.isin()`. Then first charts: `.plot()` straight off a DataFrame — line, bar, histogram — enough to see your own data without leaving the notebook."]],"files":["notebooks/01_cleaning.ipynb"],"mini":{"n":3,"name":"`notebooks/01_cleaning.ipynb`","desc":"Load raw trades, deliberately inject missing values and a duplicate row, then detect and fix both defensibly — per-instrument fills, not a global mean. Document *why* each choice.","feeds":"Feeds Major Projects 1 and 2.","mp":[1,2]},"resources":[{"day":null,"md":"Course: [Complete Pandas Data Science Tutorial (Keith Galli)](https://www.youtube.com/watch?v=2uvysYbKdjM)"},{"day":null,"md":"Reference: [pandas — official documentation](https://pandas.pydata.org/docs/)"},{"day":null,"md":"Practice: [Kaggle — Pandas micro-course](https://www.kaggle.com/learn/pandas)"},{"day":"Thu","md":"[pandas: Time series / date functionality](https://pandas.pydata.org/docs/user_guide/timeseries.html)"},{"day":"Fri","md":"[pandas: Chart visualization](https://pandas.pydata.org/docs/user_guide/visualization.html)"}],"dod":"DataFrame cleaned of NaNs and duplicates with justified methods; `groupby`+`agg` and `merge` both used correctly; a rolling window computed per instrument via `transform`; three basic charts produced; notebook committed with written reasoning.","vidbase":"https://www.youtube.com/watch?v=2uvysYbKdjM","vidlabel":"Keith Galli pandas","chapters":{"Mon":[[505,"Loading DataFrames from Files"],[928,"Accessing Data | .loc() .iloc()"]],"Tue":[[3513,"Handling Null Values (NaNs)"]],"Wed":[[3042,"Merging & Concatenating Data"],[3947,"Aggregating Data | groupby()"],[4104,"Aggregating Data | Pivot Tables"]],"Thu":[[4228,"Groupby combined with Datetime Operations"]],"Fri":[[1452,"Filtering Data | Numeric & Multiple Conditions"],[4478,"Advanced Functionality | .shift() .rank()"]]},"data":[{"title":"Build the messy CSV you'll clean","lang":"python","note":"Run once to produce `data/raw_trades.csv`. It exports the same 54 trades, then injects exactly the two problems Tuesday asks you to detect and fix. Keep the script — being able to regenerate dirty input is how you test a cleaning notebook.","code":"# scripts/make_raw_trades.py  -- run once\nimport pandas as pd, numpy as np\n\n# export your trades table to data/trades_clean.csv first, or rebuild it here\ndf = pd.read_csv(\"data/trades_clean.csv\", parse_dates=[\"trade_date\"])\n\nrng = np.random.default_rng(20260729)\n\n# 1. null out 6 prices and 3 volumes, spread across instruments\nprice_idx = rng.choice(df.index, size=6, replace=False)\nvol_idx   = rng.choice(df.index.difference(price_idx), size=3, replace=False)\ndf.loc[price_idx, \"price\"] = np.nan\ndf.loc[vol_idx,   \"volume\"] = np.nan\n\n# 2. duplicate two whole rows\ndupes = df.sample(2, random_state=7)\ndf = pd.concat([df, dupes], ignore_index=True)\n\n# 3. make one column the wrong dtype, so .info() tells you something\ndf[\"volume\"] = df[\"volume\"].astype(\"object\")\n\ndf.to_csv(\"data/raw_trades.csv\", index=False)\nprint(df.shape)","check":"`raw_trades.csv` should have **56** rows (54 + 2 duplicates), **6** null prices and **3** null volumes. After `drop_duplicates()` you should be back to 54. Filling price per-instrument rather than with a global mean should change AAPL's mean by roughly £2–4 versus the global fill — that gap is the point of Tuesday."}],"exercises":{"Mon":["Load `raw_trades.csv`, then report its shape, dtypes and null counts in three lines. **56 rows.**","Set `trade_date` as the index and select January's trades two ways — with `.loc` and with `.iloc` — and write one line on when each is appropriate.","Which column has the wrong dtype straight off the CSV, and why did that happen?"],"Tue":["Detect the nulls: **6 in `price`, 3 in `volume`.** Show that `df.price == None` finds none of them and explain why.","Drop the duplicates. **You should go from 56 rows back to 54.**","Fill the missing prices **per instrument** rather than with a global mean, then compare AAPL's mean under both approaches and write down the gap. That gap is the whole point of today."],"Wed":["`groupby('ticker').agg()` with a dict — sum of volume and mean of price in one call.","Build a `pivot_table` of total volume with tickers as rows and months as columns. **5 × 6.**","Merge the trades frame onto an instruments frame to attach sector, then confirm your row count did not change. If it grew, your join key is not unique."],"Thu":["Convert `trade_date` with `to_datetime`, sort, and resample to month-end total volume.","Compute a 3-trade rolling average price **per instrument** using `groupby().transform()`.","Prove the transform was per-group: the first 2 rows of *each* ticker should be null, not just the first 2 rows overall."],"Fri":["Do the same aggregation three ways — `apply`, `transform` and `agg` — and write one line on what each returns differently.","Use `.isin()` to filter to the Technology tickers only. **Expect 22 rows.**","Produce three charts off the DataFrame: a line of price over time, a bar of volume per ticker, and a histogram of prices."]},"dayfiles":{"Mon":{"act":"new","path":"notebooks/01_cleaning.ipynb","note":"Create the `notebooks/` folder. Two-digit prefix so notebooks sort in execution order."},"Tue":{"act":"continue","path":"notebooks/01_cleaning.ipynb"},"Wed":{"act":"continue","path":"notebooks/01_cleaning.ipynb"},"Thu":{"act":"continue","path":"notebooks/01_cleaning.ipynb"},"Fri":{"act":"continue","path":"notebooks/01_cleaning.ipynb"}}},{"n":10,"phase":1,"title":"Advanced SQL: Window Functions, CTEs, Optimisation","goal":"Where beginners and professionals separate. Standard ANSI SQL that runs near-unchanged on BigQuery, Snowflake, BigQuery and Postgres.","days":[["Mon","Window functions: `ROW_NUMBER`, `RANK`, `DENSE_RANK`, `NTILE`; `OVER (PARTITION BY … ORDER BY …)`."],["Tue","`LAG`/`LEAD` for period-over-period comparison; moving averages with a windowed frame (`ROWS BETWEEN`)."],["Wed","CTEs (`WITH`), including chained CTEs; rewrite a messy nested query as readable CTEs. Recursive CTEs conceptually."],["Thu","Daily returns and a 7-day moving average; rank assets by return within each month using a window partitioned by month."],["Fri","Query performance basics: what a scan costs, why filtering early matters, reading a query plan."]],"files":["sql/analytics/returns_analysis.sql"],"mini":{"n":4,"name":"`returns_analysis.sql`","desc":"One ~100-line multi-CTE analytical query answering a real markets question end-to-end, fully commented.","feeds":"Feeds Major Project 1 — its analytical core.","mp":[1]},"resources":[{"day":null,"md":"Course: [Advanced SQL Full Course — Joins, Window Functions, Subqueries, CTEs (DataCamp)](https://www.youtube.com/watch?v=D2xUEYR-GIY)"},{"day":null,"md":"Practice: [Mode SQL Tutorial — interactive window functions & CTEs](https://mode.com/sql-tutorial/)"},{"day":null,"md":"Drills: [DataLemur — SQL interview questions](https://datalemur.com/)"}],"vidbase":"https://www.youtube.com/watch?v=D2xUEYR-GIY","vidlabel":"DataCamp Advanced SQL","chapters":{"Mon":[[5290,"It's OVER"],[5553,"OVER with a PARTITION"]],"Tue":[[5757,"Sliding windows"]],"Wed":[[4796,"Common Table Expressions"]]},"dod":"A window-function query (rank or lag) works; a nested query rewritten as CTEs; the ~100-line query committed and commented.","data":[{"title":"Daily OHLCV — the file Weeks 10, 12, 13 and 14 all use","lang":"python","note":"Generates ~130 trading days of daily bars for the first five tickers, as a random walk seeded per ticker so it is reproducible. This is the last synthetic dataset — Week 16 replaces it with real API data using **the same columns**.","code":"# scripts/make_prices.py  -- run once\nimport pandas as pd, numpy as np\n\nBASE = {\"AAPL\": 225.0, \"MSFT\": 415.0, \"JPM\": 212.0, \"XOM\": 11
